<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no"/>
<title>EPUB 分章工具 V5.1</title>
<script src="jszip.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#f5f5f5;color:#333;overflow-x:hidden}
#app{display:flex;height:calc(100vh - 48px);padding-top:48px;transition:padding-top .2s}
#sidebar{width:260px;min-width:260px;background:#fff;border-right:1px solid #ddd;overflow-y:auto;transition:transform .3s;z-index:10}
#sidebar.hidden{transform:translateX(-100%)}
#scrim{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.3);z-index:9}
#scrim.show{display:block}
#main{flex:1;display:flex;flex-direction:column;overflow:hidden}
#toolbar{position:fixed;top:0;left:0;right:0;z-index:20;background:#fff;border-bottom:1px solid #ddd;display:flex;flex-wrap:wrap;align-items:center;gap:4px;padding:4px 8px;min-height:44px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
#toolbar button,#toolbar input[type=file]::file-selector-button{padding:6px 10px;font-size:13px;border:1px solid #ccc;border-radius:4px;background:#fff;cursor:pointer;white-space:nowrap}
#toolbar button:hover{background:#e8e8e8}
#toolbar .sep{width:1px;height:24px;background:#ddd;margin:0 2px}
#editor{flex:1;overflow-y:auto;padding:16px;background:#fff;margin:8px;border-radius:4px;box-shadow:0 1px 2px rgba(0,0,0,.06)}
#editor:focus{outline:none}
#editor h1{font-size:1.3em;margin:.5em 0}
#editor h2{font-size:1.15em;margin:.4em 0}
#editor h3{font-size:1.05em;margin:.3em 0}
#editor p{margin:.3em 0;line-height:1.6}
#editor .me,#editor .ta{padding:6px 10px;margin:6px 0;border-radius:6px;position:relative}
#editor .me{background:#e3f2fd;border-left:3px solid #1976d2}
#editor .ta{background:#fce4ec;border-left:3px solid #c62828}
#editor .me::before{content:"我";position:absolute;top:-10px;left:8px;font-size:11px;color:#1976d2;background:#fff;padding:0 4px;border-radius:2px}
#editor .ta::before{content:"TA";position:absolute;top:-10px;left:8px;font-size:11px;color:#c62828;background:#fff;padding:0 4px;border-radius:2px}
.chapter-item{padding:8px 12px;border-bottom:1px solid #eee;cursor:pointer;display:flex;justify-content:space-between;align-items:center;font-size:14px}
.chapter-item.active{background:#e3f2fd;font-weight:600}
.chapter-item .word-count{font-size:11px;color:#888;margin-left:6px;white-space:nowrap}
.chapter-item .actions{display:flex;gap:4px}
.chapter-item .actions button{padding:2px 6px;font-size:11px;border:1px solid #ccc;border-radius:3px;background:#fff;cursor:pointer}
.toc-item{padding:6px 12px;border-bottom:1px solid #eee;display:flex;align-items:center;gap:6px;font-size:13px}
.toc-item input{flex:1;border:1px solid #ddd;border-radius:3px;padding:4px 6px;font-size:13px}
.toc-item select{border:1px solid #ddd;border-radius:3px;padding:3px 4px;font-size:12px}
.toc-item button{padding:2px 6px;font-size:11px;border:1px solid #ccc;border-radius:3px;background:#fff;cursor:pointer}
.meta-panel{padding:12px}
.meta-panel label{display:block;margin:6px 0 2px;font-size:13px;font-weight:600}
.meta-panel input,.meta-panel textarea{width:100%;padding:6px;border:1px solid #ddd;border-radius:4px;font-size:13px;margin-bottom:6px}
.meta-panel textarea{resize:vertical;min-height:60px}
.toast{position:fixed;bottom:60px;left:50%;transform:translateX(-50%);background:#333;color:#fff;padding:8px 18px;border-radius:20px;font-size:14px;z-index:999;opacity:0;transition:opacity .3s;pointer-events:none}
.toast.show{opacity:1}
.restore-bar{position:fixed;top:48px;left:0;right:0;background:#fff3cd;color:#856404;padding:8px 16px;text-align:center;font-size:14px;z-index:19;display:none;border-bottom:1px solid #ffc107}
.restore-bar.show{display:block}
.restore-bar button{margin:0 6px;padding:4px 12px;border:1px solid #856404;border-radius:4px;background:#fff;cursor:pointer;font-size:13px}
@media(max-width:820px){
  #sidebar{position:fixed;top:48px;left:0;bottom:0;width:280px;transform:translateX(-100%);z-index:11}
  #sidebar.open{transform:translateX(0)}
  #scrim.show{display:block}
  #toolbar{padding:4px 6px;gap:3px}
  #toolbar button{padding:5px 8px;font-size:12px}
  #editor{padding:12px;margin:4px}
}
</style>
</head>
<body>
<div id="app">
  <div id="scrim"></div>
  <div id="sidebar">
    <div style="padding:8px 12px;border-bottom:1px solid #ddd;display:flex;justify-content:space-between;align-items:center">
      <strong>章节</strong>
      <button onclick="toggleSidebar()" style="padding:2px 8px;font-size:12px">✕</button>
    </div>
    <div id="chapterList"></div>
    <div style="padding:8px 12px;border-top:1px solid #ddd">
      <button onclick="addChapter()" style="width:100%;padding:6px;font-size:13px;border:1px solid #ccc;border-radius:4px;background:#fff;cursor:pointer">🆕 新建章节</button>
    </div>
    <div style="padding:8px 12px;border-top:1px solid #ddd">
      <div style="font-weight:600;margin-bottom:4px;font-size:13px">目录</div>
      <div id="tocList"></div>
    </div>
    <div style="padding:8px 12px;border-top:1px solid #ddd">
      <div style="font-weight:600;margin-bottom:4px;font-size:13px">元数据</div>
      <div class="meta-panel">
        <label>书名</label><input id="metaTitle" placeholder="书名"/>
        <label>作者</label><input id="metaAuthor" placeholder="作者"/>
        <label>语言</label><input id="metaLang" value="zh-CN"/>
        <label>出版社</label><input id="metaPublisher" placeholder="出版社"/>
        <label>出版日期</label><input id="metaDate" type="date"/>
        <label>简介</label><textarea id="metaDesc" placeholder="简介"></textarea>
        <label>封面</label><input id="coverInput" type="file" accept="image/png,image/jpeg"/>
      </div>
    </div>
  </div>
  <div id="main">
    <div id="toolbar">
      <button onclick="document.getElementById('fileInput').click()">📂 导入</button>
      <input id="fileInput" type="file" accept=".epub" style="display:none" onchange="importEPUB(event)"/>
      <button onclick="saveDraft()">💾 保存</button>
      <button onclick="backupDraft()">⬇️ 备份</button>
      <span class="sep"></span>
      <button onclick="undo()">↩ 撤销</button>
      <button onclick="redo()">↪ 重做</button>
      <span class="sep"></span>
      <button onclick="execCmd('bold')"><b>B</b></button>
      <button onclick="execCmd('italic')"><i>I</i></button>
      <button onclick="execCmd('underline')"><u>U</u></button>
      <button onclick="execCmd('strikeThrough')"><s>S</s></button>
      <span class="sep"></span>
      <button onclick="execCmd('formatBlock','h2')">H2</button>
      <button onclick="execCmd('formatBlock','h3')">H3</button>
      <button onclick="execCmd('formatBlock','p')">P</button>
      <span class="sep"></span>
      <button onclick="execCmd('insertOrderedList')">OL</button>
      <button onclick="execCmd('insertUnorderedList')">UL</button>
      <button onclick="execCmd('createLink',prompt('链接URL:','https://'))">🔗</button>
      <button onclick="execCmd('removeFormat')">清除</button>
      <span class="sep"></span>
      <button onclick="exportEPUB()">⬇️ 导出</button>
    </div>
    <div id="editor" contenteditable="true"></div>
  </div>
</div>
<div id="toast" class="toast"></div>
<div id="restoreBar" class="restore-bar"></div>

<script>
// ====== 全局状态 ======
let chapters = [];          // [{id,title,content}]
let currentChapterId = null;
let tocItems = [];          // [{id,title,chapterId,manual}]
let meta = {title:'',author:'',lang:'zh-CN',publisher:'',date:'',desc:'',cover:''};
let undoStack = {};         // {chapterId:[html]}
let redoStack = {};
const HIST_MAX = 30;
let histTimer = null;
let draftKey = 'epubEditorDraft';
let nextChapterOrdinal = 1;

// ====== 工具函数 ======
function $(id){return document.getElementById(id)}
function toast(msg){const t=$('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2500)}
function safeName(s){return s.replace(/[\\/:*?"<>|]/g,'_').trim()||'未命名'}
function fmtCount(n){return n>=10000?(n/10000).toFixed(1)+'万字':n+'字'}
function toggleSidebar(){const s=$('sidebar'),c=$('scrim');s.classList.toggle('open');c.classList.toggle('show')}

// ====== 编辑器命令 ======
function execCmd(cmd,val){document.execCommand(cmd,false,val||null);$('editor').focus();pushHistory(currentChapterId)}

// ====== 历史栈 ======
function pushHistory(cid){
  if(!cid||!chapters.find(c=>c.id===cid))return;
  clearTimeout(histTimer);
  histTimer=setTimeout(()=>{
    const ch=chapters.find(c=>c.id===cid);if(!ch)return;
    if(!undoStack[cid])undoStack[cid]=[];
    const cur=ch.content;
    if(undoStack[cid].length&&undoStack[cid][undoStack[cid].length-1]===cur)return;
    undoStack[cid].push(cur);
    if(undoStack[cid].length>HIST_MAX)undoStack[cid].shift();
    redoStack[cid]=[];
    autoSaveDraft();
  },500);
}
function undo(){
  const cid=currentChapterId;if(!cid||!undoStack[cid]||!undoStack[cid].length)return toast('没有可撤销的操作');
  const ch=chapters.find(c=>c.id===cid);if(!ch)return;
  if(!redoStack[cid])redoStack[cid]=[];
  redoStack[cid].push(ch.content);
  ch.content=undoStack[cid].pop();
  renderChapter(cid);autoSaveDraft();
}
function redo(){
  const cid=currentChapterId;if(!cid||!redoStack[cid]||!redoStack[cid].length)return toast('没有可恢复的操作');
  const ch=chapters.find(c=>c.id===cid);if(!ch)return;
  if(!undoStack[cid])undoStack[cid]=[];
  undoStack[cid].push(ch.content);
  ch.content=redoStack[cid].pop();
  renderChapter(cid);autoSaveDraft();
}

// ====== 渲染 ======
function renderChapterList(){
  const el=$('chapterList');el.innerHTML='';
  chapters.forEach((ch,i)=>{
    const d=document.createElement('div');d.className='chapter-item'+(ch.id===currentChapterId?' active':'');
    const txt=document.createElement('span');txt.textContent=ch.title+'  '+fmtCount(ch.content.replace(/<[^>]+>/g,'').length);
    d.appendChild(txt);
    const acts=document.createElement('span');acts.className='actions';
    if(i>0){
      const mb=document.createElement('button');mb.textContent='合并↑';mb.onclick=e=>{e.stopPropagation();mergeChapter(i)};
      acts.appendChild(mb);
    }
    const db=document.createElement('button');db.textContent='×';db.onclick=e=>{e.stopPropagation();deleteChapter(i)};
    acts.appendChild(db);
    d.appendChild(acts);
    d.onclick=()=>switchChapter(ch.id);
    el.appendChild(d);
  });
}
function renderTOC(){
  const el=$('tocList');el.innerHTML='';
  tocItems.forEach((item,i)=>{
    const d=document.createElement('div');d.className='toc-item';
    const inp=document.createElement('input');inp.value=item.title;inp.placeholder='目录标题';
    inp.oninput=()=>{item.title=inp.value;item.manual=true;autoSaveDraft()};
    d.appendChild(inp);
    const sel=document.createElement('select');
    const opt0=document.createElement('option');opt0.value='';opt0.textContent='不绑定';sel.appendChild(opt0);
    chapters.forEach(ch=>{
      const o=document.createElement('option');o.value=ch.id;o.textContent=ch.title;
      if(ch.id===item.chapterId)o.selected=true;
      sel.appendChild(o);
    });
    sel.onchange=()=>{item.chapterId=sel.value||null;autoSaveDraft()};
    d.appendChild(sel);
    const db=document.createElement('button');db.textContent='×';db.onclick=()=>{tocItems.splice(i,1);renderTOC();autoSaveDraft()};
    d.appendChild(db);
    el.appendChild(d);
  });
  const addBtn=document.createElement('button');addBtn.textContent='+ 添加目录项';addBtn.style.cssText='margin:6px;padding:4px 10px;font-size:12px;border:1px solid #ccc;border-radius:4px;background:#fff;cursor:pointer';
  addBtn.onclick=()=>{tocItems.push({id:'toc_'+Date.now(),title:'新目录项',chapterId:null,manual:false});renderTOC();autoSaveDraft()};
  el.appendChild(addBtn);
}
function renderChapter(cid){
  const ch=chapters.find(c=>c.id===cid);if(!ch)return;
  $('editor').innerHTML=ch.content;
  window.scrollTo({top:0});
  $('editor').scrollTop=0;
}
function switchChapter(cid){
  if(currentChapterId&&$('editor').innerHTML){
    const ch=chapters.find(c=>c.id===currentChapterId);
    if(ch)ch.content=$('editor').innerHTML;
  }
  currentChapterId=cid;
  renderChapterList();
  renderChapter(cid);
  calibrateLayout();
}

// ====== 章节操作 ======
function addChapter(){
  const ord=nextChapterOrdinal++;
  const id='ch_'+Date.now();
  const title='第'+ord+'章';
  const content='<div class="me"><p>（新建章节内容）</p></div>';
  chapters.push({id,title,content});
  tocItems.push({id:'toc_'+Date.now(),title,chapterId:id,manual:false});
  switchChapter(id);
  toast('已新建：'+title);
}
function mergeChapter(idx){
  if(idx<=0)return toast('已经是第一章，无法向上合并');
  const target=chapters[idx-1],src=chapters[idx];
  target.content+='\n'+src.content;
  target.title=target.title;
  chapters.splice(idx,1);
  tocItems=tocItems.filter(t=>t.chapterId!==src.id);
  // 重排编号
  let num=1;
  chapters.forEach((ch,i)=>{
    if(ch.title.startsWith('第')&&ch.title.includes('章')){
      ch.title='第'+(num++)+'章';
    }
  });
  // 更新目录
  tocItems.forEach(t=>{
    const ch=chapters.find(c=>c.id===t.chapterId);
    if(ch&&!t.manual)t.title=ch.title;
  });
  renderTOC();
  switchChapter(target.id);
  toast('已合并到：'+target.title);
}
function deleteChapter(idx){
  if(chapters.length<=1)return toast('至少保留一个章节');
  const ch=chapters[idx];
  if(confirm('确认删除「'+ch.title+'」？')) {
    chapters.splice(idx,1);
    tocItems=tocItems.filter(t=>t.chapterId!==ch.id);
    if(currentChapterId===ch.id)switchChapter(chapters[0].id);
    else renderChapterList();
    renderTOC();
    autoSaveDraft();
  }
}

// ====== 自动分章逻辑 ======
function splitByRounds(html){
  // 提取纯 body 内容
  let bodyMatch=html.match(/<body[^>]*>([\s\S]*)<\/body>/i);
  let content=bodyMatch?bodyMatch[1]:html;
  // 剥离 nav/cover 特殊章节
  const isNav=/nav/i.test(html);
  const isCover=/cover/i.test(html);
  if(isNav)return [{title:'目录',content}];
  if(isCover)return [{title:'封面',content}];

  // 查找所有 me/ta 块
  const blocks=[];
  const regex=/<(div|p)[^>]*class=["'](me|ta)["'][^>]*>([\s\S]*?)<\/(div|p)>/gi;
  let m;
  while((m=regex.exec(content))!==null){
    blocks.push({tag:m[1],cls:m[2],inner:m[3],start:m.index,end:m.index+m[0].length});
  }

  if(blocks.length===0){
    // 无对话块 → 整章当前言
    return [{title:'前言',content}];
  }

  // 查找首个 h1 时间戳
  const h1Regex=/<h1[^>]*>[\s\S]*?<\/h1>/i;
  const h1Match=h1Regex.exec(content);
  const firstBlock=blocks[0];

  // 前言：首个 block 之前、且不含 h1 时间戳的部分
  let preludeEnd=firstBlock.start;
  let preludeContent='';
  if(h1Match&&h1Match.index<preludeEnd){
    // h1 在首个 block 之前 → h1 及其后内容并入第一章，h1 之前纯文本当前言
    preludeContent=content.substring(0,h1Match.index);
    // 第一章开头 = h1 到首个 block 结束
    const firstRoundContent=content.substring(h1Match.index,firstBlock.end);
    // 剩余内容
    const restContent=content.substring(firstBlock.end);

    // 构建后续回合
    const rounds=[{title:'第一章',content:firstRoundContent}];
    let idx=2;
    let pos=0;
    const remainingBlocks=[];
    const r2=/(<(div|p)[^>]*class=["'](me|ta)["'][^>]*>[\s\S]*?<\/(div|p)>)/gi;
    let m2;
    while((m2=r2.exec(restContent))!==null){
      remainingBlocks.push({full:m2[1],start:m2.index,end:m2.index+m2[1].length});
    }
    if(remainingBlocks.length>0){
      // 从第二个 block 开始，每遇到一个 me 块开启新回合
      let currentRound={title:'第'+(idx)+'章',content:''};
      for(let i=0;i<remainingBlocks.length;i++){
        const b=remainingBlocks[i];
        if(b.full.includes('class="me"')&&currentRound.content.length>0){
          // 新回合
          rounds.push(currentRound);
          idx++;
          currentRound={title:'第'+(idx)+'章',content:b.full};
        }else{
          currentRound.content+=b.full;
        }
      }
      if(currentRound.content.length>0)rounds.push(currentRound);
    }

    // 前言
    const result=[];
    if(preludeContent.trim())result.push({title:'前言',content:preludeContent.trim()});
    rounds.forEach(r=>result.push(r));
    return result;
  }else{
    // 无 h1 或 h1 在首个 block 之后 → 首个 block 之前全当前言
    preludeContent=content.substring(0,firstBlock.start);
    const restContent=content.substring(firstBlock.start);
    const rounds=[{title:'第一章',content:''}];
    let idx=1;
    const remainingBlocks=[];
    const r2=/(<(div|p)[^>]*class=["'](me|ta)["'][^>]*>[\s\S]*?<\/(div|p)>)/gi;
    let m2;
    while((m2=r2.exec(restContent))!==null){
      remainingBlocks.push({full:m2[1],start:m2.index,end:m2.index+m2[1].length});
    }
    if(remainingBlocks.length>0){
      let currentRound={title:'第'+(idx+1)+'章',content:''};
      for(let i=0;i<remainingBlocks.length;i++){
        const b=remainingBlocks[i];
        if(b.full.includes('class="me"')&&currentRound.content.length>0){
          rounds.push(currentRound);
          idx++;
          currentRound={title:'第'+(idx+1)+'章',content:b.full};
        }else{
          currentRound.content+=b.full;
        }
      }
      if(currentRound.content.length>0)rounds.push(currentRound);
      // 第一个回合 = 第一个 block
      rounds[0].content=remainingBlocks[0]?.full||'';
    }
    const result=[];
    if(preludeContent.trim())result.push({title:'前言',content:preludeContent.trim()});
    rounds.forEach(r=>result.push(r));
    return result;
  }
}

// ====== 导入 ======
async function importEPUB(e){
  const file=e.target.files[0];if(!file)return;
  try{
    const buf=await file.arrayBuffer();
    const zip=await JSZip.loadAsync(buf);
    // 读 OPF
    const opfEntry=Object.values(zip.files).find(f=>/\.opf$/i.test(f.name));
    if(!opfEntry)throw new Error('未找到 OPF 文件');
    const opfDoc=new DOMParser().parseFromString(await opfEntry.async('string'),'text/xml');
    // 读元数据
    const ns={opf:'http://www.idpf.org/2007/opf',dc:'http://purl.org/dc/elements/1.1/'};
    const getMeta=(tag)=>opfDoc.querySelector(`dc\\:${tag},${tag}`)?.textContent||'';
    meta.title=getMeta('title');
    meta.author=getMeta('creator');
    meta.lang=getMeta('language')||'zh-CN';
    meta.publisher=getMeta('publisher')||'';
    meta.date=getMeta('date')||'';
    meta.desc=getMeta('description')||'';
    // 封面
    const coverId=opfDoc.querySelector('meta[name="cover"]')?.getAttribute('content');
    if(coverId){
      const itemEl=opfDoc.querySelector(`manifest > item[id="${coverId}"]`);
      if(itemEl){
        const href=itemEl.getAttribute('href');
        const coverEntry=Object.values(zip.files).find(f=>f.name.endsWith(href));
        if(coverEntry){
          const blob=await coverEntry.async('blob');
          const reader=new FileReader();
          meta.cover=await new Promise(res=>{reader.onload=()=>res(reader.result);reader.readAsDataURL(blob)});
        }
      }
    }
    // 读 spine 顺序
    const spineItems=[];
    const spineRefs=opfDoc.querySelectorAll('spine > itemref');
    spineRefs.forEach(ref=>{
      const idref=ref.getAttribute('idref');
      const item=opfDoc.querySelector(`manifest > item[id="${idref}"]`);
      if(item){
        const href=item.getAttribute('href');
        spineItems.push(href);
      }
    });
    // 读各章节
    const allChapters=[];
    for(const href of spineItems){
      const entry=Object.values(zip.files).find(f=>f.name.endsWith(href));
      if(!entry)continue;
      const html=await entry.async('string');
      const isNav=/nav/i.test(href);
      const isCoverImg=/cover/i.test(href);
      if(isNav||isCoverImg){
        allChapters.push(...splitByRounds(html));
      }else{
        allChapters.push(...splitByRounds(html));
      }
    }
    if(allChapters.length===0)throw new Error('未能解析任何章节');
    chapters=allChapters.map((ch,i)=>({id:'ch_'+Date.now()+'_'+i,title:ch.title,content:ch.content}));
    // 构建目录
    tocItems=chapters.map(ch=>({id:'toc_'+Date.now()+'_'+ch.id,title:ch.title,chapterId:ch.id,manual:false}));
    // 计算下一章序号
    let maxOrd=0;
    chapters.forEach(ch=>{
      const m=ch.title.match(/第(\d+)章/);
      if(m)maxOrd=Math.max(maxOrd,parseInt(m[1]));
    });
    nextChapterOrdinal=maxOrd+1;
    // 渲染
    renderTOC();
    if(chapters.length>0)switchChapter(chapters[0].id);
    // 填充元数据
    $('metaTitle').value=meta.title;
    $('metaAuthor').value=meta.author;
    $('metaLang').value=meta.lang;
    $('metaPublisher').value=meta.publisher;
    $('metaDate').value=meta.date;
    $('metaDesc').value=meta.desc;
    autoSaveDraft();
    toast('导入成功：共 '+chapters.length+' 章');
  }catch(err){
    console.error('导入失败:',err);
    toast('导入失败：'+err.message);
  }
  e.target.value='';
}

// ====== 导出 ======
async function exportEPUB(){
  if(!chapters.length)return toast('没有可导出的内容');
  const name=prompt('请输入文件名（留空为"未命名"）:','')||'未命名';
  const fname=safeName(name)+'.epub';
  try{
    const zip=new JSZip();
    // mimetype（必须首条目 + STORE）
    zip.file('mimetype','application/epub+zip',{compression:'STORE',compress:false});
    // META-INF
    zip.folder('META-INF').file('container.xml',
      '<?xml version="1.0"?><container version="1.0" xmlns="urn:oasis:names:tc:opendocument:xmlns:container"><rootfiles><rootfile full-path="OEBPS/content.opf" media-type="application/oebps-package+xml"/></rootfiles></container>');
    // OEBPS
    const oebps=zip.folder('OEBPS');
    // 写章节
    const manifestItems=[];
    const spineOrder=[];
    chapters.forEach((ch,i)=>{
      const fname='chap_'+(i+1)+'.xhtml';
      const xhtml=`<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:epub="http://www.idpf.org/2007/ops" lang="zh-CN">
<head><meta charset="utf-8"/><title>${escapeXml(ch.title)}</title><link rel="stylesheet" type="text/css" href="style.css"/></head>
<body>${ch.content}</body></html>`;
      oebps.file(fname,xhtml);
      manifestItems.push({id:'chap_'+(i+1),href:fname,'media-type':'application/xhtml+xml'});
      spineOrder.push('chap_'+(i+1));
    });
    // 写样式
    oebps.file('style.css','body{font-family:sans-serif;line-height:1.6;padding:1em}.me{background:#e3f2fd;padding:6px 10px;margin:6px 0;border-left:3px solid #1976d2}.ta{background:#fce4ec;padding:6px 10px;margin:6px 0;border-left:3px solid #c62828}');
    // 写 OPF
    const opf=`<?xml version="1.0" encoding="UTF-8"?>
<package xmlns="http://www.idpf.org/2007/opf" unique-identifier="book-id" version="3.0">
  <metadata xmlns:dc="http://purl.org/dc/elements/1.1/">
    <dc:identifier id="book-id">urn:uuid:${generateUUID()}</dc:identifier>
    <dc:title>${escapeXml(meta.title||name)}</dc:title>
    <dc:creator>${escapeXml(meta.author||'未知')}</dc:creator>
    <dc:language>${meta.lang||'zh-CN'}</dc:language>
    ${meta.publisher?'<dc:publisher>'+escapeXml(meta.publisher)+'</dc:publisher>':''}
    ${meta.date?'<dc:date>'+meta.date+'</dc:date>':''}
    ${meta.desc?'<dc:description>'+escapeXml(meta.desc)+'</dc:description>':''}
  </metadata>
  <manifest>
    ${manifestItems.map(it=>'<item id="'+it.id+'" href="'+it.href+'" media-type="'+it['media-type']+'"/>').join('\n    ')}
    <item id="ncx" href="toc.ncx" media-type="application/x-dtbncx+xml"/>
  </manifest>
  <spine toc="ncx">
    ${spineOrder.map(id=>'<itemref idref="'+id+'"/>').join('\n    ')}
  </spine>
</package>`;
    oebps.file('content.opf',opf);
    // 写 NCX
    const ncx=`<?xml version="1.0" encoding="UTF-8"?>
<ncx xmlns="http://www.daisy.org/z3986/2005/ncx/" version="2005-1">
  <head><meta name="dtb:uid" content="urn:uuid:${generateUUID()}"/></head>
  <docTitle><text>${escapeXml(meta.title||name)}</text></docTitle>
  <navMap>
    ${chapters.map((ch,i)=>'<navPoint id="navpoint_'+(i+1)+'" playOrder="'+(i+1)+'"><navLabel><text>'+escapeXml(ch.title)+'</text></navLabel><content src="chap_'+(i+1)+'.xhtml"/></navPoint>').join('\n    ')}
  </navMap>
</ncx>`;
    oebps.file('toc.ncx',ncx);
    // 生成 zip
    const blob=await zip.generateAsync({type:'blob',mimeType:'application/epub+zip',compression:'DEFLATE'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');a.href=url;a.download=fname;document.body.appendChild(a);a.click();
    setTimeout(()=>{document.body.removeChild(a);URL.revokeObjectURL(url)},1000);
    // 导出成功后清草稿
    localStorage.removeItem(draftKey);
    toast('导出成功：'+fname);
  }catch(err){
    console.error('导出失败:',err);
    toast('导出失败：'+err.message);
  }
}
function escapeXml(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function generateUUID(){return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,c=>{const r=Math.random()*16|0;return(c==='x'?r:(r&0x3|0x8)).toString(16)})}

// ====== 草稿 ======
function autoSaveDraft(){
  try{
    const data={
      chapters,currentChapterId,tocItems,meta,
      nextChapterOrdinal,
      editorContent:$('editor').innerHTML
    };
    localStorage.setItem(draftKey,JSON.stringify(data));
  }catch(e){/* 忽略配额超限 */}
}
function saveDraft(){autoSaveDraft();toast('草稿已保存')}
function backupDraft(){
  autoSaveDraft();
  const json=localStorage.getItem(draftKey);
  if(!json)return toast('没有草稿可备份');
  const name=meta.title||'未命名';
  const fname=safeName(name)+'_draft.json';
  const blob=new Blob([json],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=url;a.download=fname;document.body.appendChild(a);a.click();
  setTimeout(()=>{document.body.removeChild(a);URL.revokeObjectURL(url)},1000);
  toast('草稿已备份');
}
function restoreDraft(){
  try{
    const raw=localStorage.getItem(draftKey);
    if(!raw)return false;
    const data=JSON.parse(raw);
    if(data.chapters&&data.chapters.length){
      chapters=data.chapters;
      currentChapterId=data.currentChapterId||null;
      tocItems=data.tocItems||[];
      meta=data.meta||{title:'',author:'',lang:'zh-CN',publisher:'',date:'',desc:'',cover:''};
      nextChapterOrdinal=data.nextChapterOrdinal||1;
      renderTOC();
      if(currentChapterId&&chapters.find(c=>c.id===currentChapterId)){
        switchChapter(currentChapterId);
        if(data.editorContent)$('editor').innerHTML=data.editorContent;
      }else if(chapters.length>0){
        switchChapter(chapters[0].id);
      }
      $('metaTitle').value=meta.title;
      $('metaAuthor').value=meta.author;
      $('metaLang').value=meta.lang;
      $('metaPublisher').value=meta.publisher;
      $('metaDate').value=meta.date;
      $('metaDesc').value=meta.desc;
      return true;
    }
  }catch(e){/* 忽略 */ }
  return false;
}
function showRestoreBar(){
  const bar=$('restoreBar');
  if(localStorage.getItem(draftKey)){
    bar.innerHTML='检测到未保存的草稿，是否恢复？<button onclick="dismissRestore(true)">恢复</button><button onclick="dismissRestore(false)">丢弃</button>';
    bar.classList.add('show');
  }
}
function dismissRestore(restore){
  const bar=$('restoreBar');bar.classList.remove('show');
  if(restore){restoreDraft();toast('草稿已恢复')}
  else{localStorage.removeItem(draftKey);toast('草稿已丢弃')}
}

// ====== 布局校准 ======
function calibrateLayout(){
  const toolbar=$('toolbar');
  const h=toolbar?toolbar.offsetHeight:48;
  $('app').style.paddingTop=h+'px';
  const bar=$('restoreBar');
  if(bar.classList.contains('show'))bar.style.top=h+'px';
}
window.addEventListener('resize',calibrateLayout);

// ====== 页面生命周期 ======
document.addEventListener('DOMContentLoaded',()=>{
  calibrateLayout();
  showRestoreBar();
  // 默认示例
  if(!chapters.length){
    chapters.push({id:'ch_default',title:'前言',content:'<p>欢迎使用 EPUB 分章工具。点击「📂 导入」选择一个 AI 聊天存档 epub 文件，将自动按轮次分章。</p>'});
    currentChapterId='ch_default';
    tocItems.push({id:'toc_default',title:'前言',chapterId:'ch_default',manual:false});
    nextChapterOrdinal=1;
    renderTOC();
    renderChapterList();
    renderChapter(currentChapterId);
  }
});
// 页面卸载时自动存
window.addEventListener('pagehide',autoSaveDraft);
window.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')autoSaveDraft()});

// ====== 编辑器输入监听 ======
$('editor').addEventListener('input',()=>{
  if(currentChapterId){
    const ch=chapters.find(c=>c.id===currentChapterId);
    if(ch)ch.content=$('editor').innerHTML;
    pushHistory(currentChapterId);
    renderChapterList();
  }
});
</script>
