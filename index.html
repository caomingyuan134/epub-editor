            $('load-draft-btn').addEventListener('click', () => {
                const data = loadDraftFromStorage();
                if (data && data.chapters && data.chapters.length > 0) {
                    if (confirm('检测到本地草稿（' + data.chapters.length + ' 章），是否恢复？')) {
                        restoreDraft(data);
                        return;
                    }
                }
                draftInput.click();
            });

            draftInput.addEventListener('change', (e) => {
                const file = e.target.files[0];
                if (!file) return;
                importDraftFile(file);
                draftInput.value = '';
            });

            // 侧边栏
            let sidebarOpen = true;
            $('toggle-sidebar-btn').addEventListener('click', () => {
                sidebarOpen = !sidebarOpen;
                sidebar.classList.toggle('collapsed', !sidebarOpen);
            });
            $('close-sidebar-btn').addEventListener('click', () => {
                sidebarOpen = false;
                sidebar.classList.add('collapsed');
            });

            // 导航
            prevBtn.addEventListener('click', () => {
                if (state.currentIndex > 0) selectChapter(state.currentIndex - 1);
            });
            nextBtn.addEventListener('click', () => {
                if (state.currentIndex < state.chapters.length - 1) selectChapter(state.currentIndex + 1);
            });

            // 撤销/重做
            undoBtn.addEventListener('click', undo);
            redoBtn.addEventListener('click', redo);

            // 模式
            $('mode-preview').addEventListener('click', () => setMode('preview'));
            $('mode-source').addEventListener('click', () => setMode('source'));

            // 章节管理
            $('add-chapter-btn').addEventListener('click', addChapter);
            $('enter-select-btn').addEventListener('click', () => {
                if (state.selectMode) {
                    exitSelectMode();
                } else {
                    // 从当前章节开始选择
                    enterSelectMode(state.currentIndex > 1 ? state.currentIndex : 2);
                }
            });
            $('select-all-btn').addEventListener('click', selectAllChapters);
            $('exit-select-btn').addEventListener('click', exitSelectMode);
            $('delete-selected-btn').addEventListener('click', deleteSelected);
            $('rename-chapter-btn').addEventListener('click', renameChapter);

            // 导出
            exportBtn.addEventListener('click', exportEpub);

            // 快捷键
            document.addEventListener('keydown', (e) => {
                if ((e.ctrlKey || e.metaKey) && e.key === 'z') {
                    e.preventDefault();
                    if (e.shiftKey) {
                        redo();
                    } else {
                        undo();
                    }
                }
                if ((e.ctrlKey || e.metaKey) && e.key === 's') {
                    e.preventDefault();
                    if (state.mode === 'source') {
                        saveCurrentContent();
                        statusLeft.textContent = '✅ 已保存';
                        setTimeout(() => {
                            if (!state.isDirty) {
                                statusLeft.textContent = state.chapters.length ? `${state.chapters.length} 章` : '就绪';
                            }
                        }, 1500);
                    }
                }
                if (e.key === 'Escape') {
                    if (state.selectMode) {
                        exitSelectMode();
                    }
                }
                if (e.key === 'ArrowLeft' && !e.target.closest('input, textarea, [contenteditable]')) {
                    if (state.currentIndex > 0) selectChapter(state.currentIndex - 1);
                }
                if (e.key === 'ArrowRight' && !e.target.closest('input, textarea, [contenteditable]')) {
                    if (state.currentIndex < state.chapters.length - 1) selectChapter(state.currentIndex + 1);
                }
            });

            // 点击外部保存
            document.addEventListener('click', (e) => {
                if (state.mode === 'source' && !e.target.closest('#editor-container')) {
                    saveCurrentContent();
                }
            });

            // 编辑器输入自动保存
            container.addEventListener('input', () => {
                if (state.mode === 'source') {
                    const idx = state.currentIndex;
                    if (idx >= 0 && idx < state.chapters.length) {
                        const newContent = container.textContent;
                        if (state.chapters[idx].content !== newContent) {
                            clearTimeout(container._saveTimer);
                            container._saveTimer = setTimeout(() => {
                                saveCurrentContent();
                            }, 500);
                        }
                    }
                }
            });

            // ============================================================
            //  初始化
            // ============================================================
            console.log('EPUB 分章编辑器 v3.5 已加载');

            const hasDraft = checkDraftOnLoad();
            if (!hasDraft) {
                statusLeft.textContent = '就绪，请导入 EPUB 文件或恢复草稿';
            }

            window.__state = state;
            window.__save = saveCurrentContent;
            window.__clearDraft = clearDraft;

        })();
    </script>

</body>
</html>
