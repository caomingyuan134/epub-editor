<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1f6feb">
<title>EPUB 分章工具 V7</title>
<style>
  :root{
    --blue:#1f6feb; --blue-d:#1858c4; --ink:#1a1a1a; --sub:#666;
    --line:#e3e6ea; --bg:#f6f8fa; --card:#fff; --danger:#d1242f; --warn:#bf8700;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
    background:var(--bg);color:var(--ink);font-size:15px;line-height:1.6;
    padding-top:0; /* calibrated by JS */
  }
  #fixedHeader{position:fixed;top:0;left:0;right:0;z-index:1000;background:var(--blue);color:#fff;box-shadow:0 2px 6px rgba(0,0,0,.12)}
  #topbar{display:flex;flex-wrap:wrap;gap:4px;padding:6px 8px;align-items:center}
  #topbar button,#toolbar button{
    flex:0 1 auto;display:inline-flex;align-items:center;gap:4px;
    background:rgba(255,255,255,.16);color:#fff;border:0;border-radius:6px;
    padding:7px 10px;font-size:13px;cursor:pointer;white-space:nowrap;
  }
  #topbar button:active,#toolbar button:active{background:rgba(255,255,255,.28)}
  #toolbar{display:flex;flex-wrap:wrap;gap:4px;padding:5px 8px;background:#2f7df0;align-items:center}
  #toolbar .grp{border-right:1px solid rgba(255,255,255,.25);padding-right:4px;margin-right:2px;display:inline-flex;gap:3px;flex-wrap:nowrap}
  #toolbar .grp:last-child{border-right:0}
  #toolbar button{background:rgba(255,255,255,.14);padding:6px 8px;font-size:13px}
  #restoreBar{display:none;position:fixed;left:0;right:0;top:0;z-index:1100;background:#fff8c5;border-bottom:1px solid #f0d060;color:#5c4400;padding:8px 10px;font-size:13px;align-items:center;gap:8px;flex-wrap:wrap}
  #restoreBar.show{display:flex}
  #restoreBar button{background:var(--blue);color:#fff;border:0;border-radius:5px;padding:5px 10px;font-size:12px;cursor:pointer}
  #restoreBar .discard{background:transparent;color:var(--danger);border:1px solid var(--danger)}
  #app{display:flex;min-height:calc(100vh - 0px)}
  #sidebar{width:260px;background:var(--card);border-right:1px solid var(--line);overflow-y:auto;position:fixed;top:0;bottom:0;left:0;z-index:900;transform:translateX(-100%);transition:transform .25s;padding-top:env(safe-area-inset-top,0px)}
  #sidebar.open{transform:translateX(0)}
  #sidebar .head{position:sticky;top:0;background:var(--card);border-bottom:1px solid var(--line);padding:8px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
  #sidebar .head input{flex:1;min-width:90px;padding:5px 7px;border:1px solid var(--line);border-radius:5px;font-size:13px}
  #sidebar ul{list-style:none;margin:0;padding:4px}
  #sidebar li{display:flex;align-items:center;gap:4px;padding:5px 6px;border-radius:5px;cursor:pointer;font-size:13px;border:1px solid transparent}
  #sidebar li.active{background:#eaf2ff;border-color:#c5dcfb;color:var(--blue-d);font-weight:600}
  #sidebar li .t{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #sidebar li .wc{color:var(--sub);font-size:11px;flex:0 0 auto}
  #sidebar li .merge,#sidebar li .del{background:transparent;border:0;cursor:pointer;font-size:12px;padding:2px 5px;border-radius:4px}
  #sidebar li .merge{color:var(--blue)}
  #sidebar li .del{color:var(--danger)}
  #sidebar .foot{position:sticky;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:8px;font-size:12px;color:var(--sub);display:flex;flex-direction:column;gap:6px}
  #sidebar .foot button{background:var(--blue);color:#fff;border:0;border-radius:6px;padding:7px 10px;font-size:13px;cursor:pointer}
  #scrim{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:850;display:none}
  #scrim.show{display:block}
  #main{flex:1;padding:12px 12px 80px;max-width:860px;margin:0 auto;width:100%}
  .meta-card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px;margin-bottom:12px;display:flex;flex-wrap:wrap;gap:8px}
  .meta-card label{font-size:12px;color:var(--sub);display:flex;flex-direction:column;gap:3px;flex:1;min-width:120px}
  .meta-card input{padding:6px 8px;border:1px solid var(--line);border-radius:5px;font-size:14px;font-family:inherit}
  .tabs{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
  .tabs button{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:6px 12px;font-size:13px;cursor:pointer;color:var(--sub)}
  .tabs button.on{background:var(--blue);color:#fff;border-color:var(--blue)}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:12px;margin-bottom:12px}
  .panel h3{margin:0 0 8px;font-size:14px;color:var(--sub);font-weight:600}
  #titleInput{width:100%;font-size:18px;font-weight:700;padding:8px 10px;border:1px solid var(--line);border-radius:6px;margin-bottom:8px;font-family:inherit}
  #editor[contenteditable="true"]{min-height:50vh;outline:none;padding:8px 4px;font-size:15px;line-height:1.75}
  #editor:empty:before{content:attr(data-placeholder);color:#aaa}
  .stat{font-size:12px;color:var(--sub);margin-top:6px}
  .toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%);background:#222;color:#fff;padding:8px 14px;border-radius:20px;font-size:13px;z-index:1200;opacity:0;transition:opacity .25s;pointer-events:none;max-width:90vw;text-align:center}
  .toast.show{opacity:1}
  .me-badge{display:inline-block;background:#eaf2ff;color:var(--blue-d);font-size:11px;padding:1px 6px;border-radius:10px;margin-right:6px;vertical-align:middle}
  .ta-badge{display:inline-block;background:#fdf3e7;color:#a05a00;font-size:11px;padding:1px 6px;border-radius:10px;margin-right:6px;vertical-align:middle}
  .help{font-size:12px;color:var(--sub);background:#f0f4fa;border:1px dashed #c5dcfb;border-radius:6px;padding:8px;margin-top:8px;line-height:1.5}
  @media(max-width:600px){
    #sidebar{width:82vw}
    #main{padding:10px 8px 80px}
  }
</style>
</head>
<body>
<div id="fixedHeader">
  <div id="topbar">
    <button id="btnImport">📂 导入</button>
    <button id="btnSave">💾 保存</button>
    <button id="btnBackup">☁️ 备份</button>
    <button id="btnExport">⬇️ 导出</button>
    <button id="btnNew">🆕 新建</button>
    <button id="btnMenu" title="章节面板">☰</button>
  </div>
  <div id="toolbar">
    <span class="grp"><button data-cmd="undo" title="撤销">↩ 撤销</button><button data-cmd="redo" title="重做">↪ 重做</button></span>
    <span class="grp"><button data-cmd="bold" title="加粗"><b>B</b></button><button data-cmd="italic" title="斜体"><i>I</i></button><button data-cmd="underline" title="下划线"><u>U</u></button></span>
    <span class="grp"><button data-cmd="formatBlock" data-arg="H2" title="H2">H2</button><button data-cmd="formatBlock" data-arg="H3" title="H3">H3</button></span>
    <span class="grp"><button data-cmd="insertUnorderedList" title="列表">• 列表</button><button data-cmd="createLink" title="链接">🔗</button><button data-cmd="removeFormat" title="清除格式">清除</button></span>
  </div>
</div>
<div id="restoreBar"><span>⚠️ 检测到未保存的草稿，是否恢复？</span><button id="btnRestore">恢复</button><button id="btnDiscard" class="discard">丢弃</button></div>
<div id="scrim"></div>
<div id="app">
  <aside id="sidebar" aria-label="章节">
    <div class="head"><input id="bookTitle" placeholder="书名"><input id="bookAuthor" placeholder="作者"></div>
    <ul id="chapterList"></ul>
    <div class="foot"><span id="footStat">共 0 章 · 0 字</span><button id="btnNewChapter">+ 新建章节</button></div>
  </aside>
  <main id="main">
    <div class="meta-card">
      <label>AI 角色名<input id="aiRole" placeholder="留空自动提取首个 TA 的 who（默认 TA）"></label>
      <label>当前章节<input id="curMeta" disabled placeholder="—"></label>
    </div>
    <div class="tabs">
      <button data-tab="edit" class="on">编辑</button>
      <button data-tab="toc">目录</button>
      <button data-tab="meta">元数据</button>
    </div>
    <div class="panel" id="panelEdit">
      <input id="titleInput" placeholder="章节标题">
      <div id="editor" contenteditable="true" data-placeholder="在这里编辑章节正文…"></div>
      <div class="stat" id="editStat">第 0 段 · 0 字</div>
    </div>
    <div class="panel" id="panelToc" style="display:none">
      <h3>目录（自动生成 · 可手动改名）</h3>
      <ul id="tocList" style="list-style:none;padding:0;margin:0"></ul>
      <div class="help">提示：修改上方"章节标题"会同步更新目录；目录项输入框获得焦点后标记为手动，不再随章节名自动跟随。</div>
    </div>
    <div class="panel" id="panelMeta" style="display:none">
      <h3>元数据</h3>
      <div class="help">书名/作者会在导入时从 EPUB 的 OPF（dc:title / dc:creator）读取并填入；导出时会写回 OPF。AI 角色名用于新建章节的 TA 区块 who 属性。</div>
    </div>
  </main>
</div>
<input type="file" id="fileInput" accept=".epub,application/epub+zip" style="display:none">
<div class="toast" id="toast"></div>
<script src="jszip.min.js"></script>
<script>
(function(){
'use strict';
const RESTORE_KEY='epubEditorDraftV7';
const HIST_MAX=30, UNDO_DEBOUNCE=500;
const $=(s)=>document.querySelector(s);
const toast=(m)=>{const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toast._h);toast._h=setTimeout(()=>t.classList.remove('show'),2200);};
const safeName=(s)=>(s||'未命名').replace(/[\/\\:\*\?"<>\|]/g,'_').slice(0,80)||'未命名';
const stripTags=(h)=>{const d=document.createElement('div');d.innerHTML=h||'';return (d.textContent||'').trim();};
const charCount=(h)=>stripTags(h).replace(/\s/g,'').length;

// ---------- state ----------
const state={zip:null, opfPath:null, chapters:[], currentId:null, draft:null, meta:{title:'',author:'',aiRole:'TA'}, busy:false};

// ---------- layout ----------
function calibrateLayout(){const fh=$('#fixedHeader');const h=fh?fh.offsetHeight:0;document.body.style.paddingTop=h+'px';$('#sidebar').style.top=h+'px';$('#scrim').style.top=h+'px';$('#restoreBar').style.top=h+'px';}
window.addEventListener('load',calibrateLayout);window.addEventListener('resize',calibrateLayout);

// ---------- toast/error ----------
window.addEventListener('error',(e)=>{toast('出错：'+ (e.message||'未知'));console.error(e);});

// ---------- history (undo/redo) V7: input-event + debounce merge ----------
const hist={stack:[], idx:0, armed:false, timer:null};
function pushHist(){
  const ed=$('#editor');if(!ed)return;
  const html=ed.innerHTML;
  hist.stack=hist.stack.slice(0,hist.idx);
  hist.stack.push(html);
  if(hist.stack.length>HIST_MAX)hist.stack.shift();
  hist.idx=hist.stack.length;
}
function undo(){if(hist.idx<=0)return toast('已是第一步');hist.idx--;$('#editor').innerHTML=hist.stack[hist.idx]||'';renderEditStat();}
function redo(){if(hist.idx>=hist.stack.length-1)return toast('已是最后一步');hist.idx++;$('#editor').innerHTML=hist.stack[hist.idx]||'';renderEditStat();}
$('#editor').addEventListener('input',()=>{
  if(!hist.armed){pushHist();hist.armed=true;clearTimeout(hist.timer);hist.timer=setTimeout(()=>{hist.armed=false;},UNDO_DEBOUNCE);}
  renderEditStat();scheduleDraft();updateMetaCur();
});
$('#editor').addEventListener('keydown',(e)=>{if((e.ctrlKey||e.metaKey)&&!e.shiftKey&&e.key.toLowerCase()==='z'){e.preventDefault();undo();}});

// ---------- toolbar commands ----------
document.querySelectorAll('#toolbar button[data-cmd]').forEach(b=>b.addEventListener('click',()=>{
  const cmd=b.dataset.cmd, arg=b.dataset.arg;
  if(cmd==='undo')return undo();if(cmd==='redo')return redo();
  if(cmd==='createLink'){const u=prompt('链接 URL','https://');if(u)document.execCommand('createLink',false,u);return;}
  document.execCommand(cmd,false,arg||null);$('#editor').focus();
}));

// ---------- chapter model ----------
function uid(){return 'ch_'+Math.random().toString(36).slice(2,9);}
function newChapter(opts={}){return{id:uid(),title:opts.title||'新章节',html:opts.html||'<div class="me"><p class="who">我</p><p><br></p></div><div class="ta"><p class="who">'+(state.meta.aiRole||'TA')+'</p><p><br></p></div>',manualTitle:!!opts.title,file:'ch'+String(state.chapters.length+1).padStart(3,'0')+'.xhtml',navOrder:state.chapters.length};}
function makePreface(html){return{id:uid(),title:'前言',html:html||'<p><br></p>',manualTitle:true,file:'ch000.xhtml',navOrder:2};}
function makeCover(){return{id:uid(),title:'封面',html:'<div class="cover"><p><br></p></div>',manualTitle:true,file:'cover.xhtml',navOrder:1};}
function makeToc(){return{id:uid(),title:'目录',html:'<p><br></p>',manualTitle:true,file:'nav.xhtml',navOrder:0};}
function roundTitle(i){return'第 '+String(i).replace(/\d/g,d=>'〇一二三四五六七八九'[+d])+' 章';}

// ---------- split by rounds (me/ta) ----------
function splitByRounds(bodyHtml){
  const doc=document.createElement('div');doc.innerHTML=bodyHtml||'';
  const children=Array.prototype.slice.call(doc.children);
  const findFirst=(sel)=>{for(let i=0;i<children.length;i++){if(children[i].querySelector&&children[i].querySelector(sel))return children[i];}return null;};
  const firstMe=doc.querySelector('div.me');const firstTa=doc.querySelector('div.ta');
  let trigger=firstMe?firstMe:(firstTa||null);
  // pure preamble: nodes before trigger that do NOT contain an <h1> timestamp
  const preambleNodes=[];const h1Timestamp=null;
  if(trigger){let cur=doc.firstElementChild;while(cur && cur!==trigger){if(!cur.querySelector||!cur.querySelector('h1'))preambleNodes.push(cur);cur=cur.nextElementSibling;}}
  const preambleHtml=preambleNodes.map(n=>n.outerHTML).join('');
  // rounds: from trigger onward, group consecutive me/ta blocks per "turn"
  const rounds=[];let buf=[];
  let cur=trigger;while(cur){if(cur===trigger||(cur.tagName==='DIV'&&(cur.classList.contains('me')||cur.classList.contains('ta')))){buf.push(cur);}else{if(buf.length)rounds.push(buf);buf=[];}
    const nxt=cur.nextElementSibling;cur=nxt;}
  if(buf.length)rounds.push(buf);
  // attach h1-timestamp that sits between preamble and first round start into first round
  let preface=preambleHtml.trim();
  // fallback: if nothing collected but body has content, treat whole body as preface
  if(!preface&&!rounds.length&&(doc.textContent||'').trim())preface=bodyHtml||doc.innerHTML;
  if(rounds.length){const firstRound=rounds[0];const h1s=doc.querySelectorAll('h1');let attached=false;h1s.forEach(h1=>{if(attached)return;if(preface.indexOf(h1.outerHTML)>=0){firstRound.unshift(h1);preface=preface.replace(h1.outerHTML,'').trim();attached=true;}});}
  return{preface:preface,rounds:rounds};
}

// ---------- import ----------
async function importEpub(file){if(state.busy)return;state.busy=true;
  try{state.draft=null;try{localStorage.removeItem(RESTORE_KEY);}catch(e){}
    const zip=await JSZip.loadAsync(file);state.zip=zip;
    let opfPath=null;try{const c=await zip.file('META-INF/container.xml').async('string');const m=c.match(/full-path="([^"]+)"/);if(m)opfPath=m[1];}catch(e){}
    if(!opfPath){const files=Object.keys(zip.files).filter(f=>f.endsWith('.opf'));if(files.length)opfPath=files[0];}
    state.opfPath=opfPath;let opfXml='';try{opfXml=await zip.file(opfPath).async('string');}catch(e){}
    const tMatch=opfXml.match(/<dc:title[^>]*>([\s\S]*?)<\/dc:title>/i);const aMatch=opfXml.match(/<dc:creator[^>]*>([\s\S]*?)<\/dc:creator>/i);
    state.meta.title=tMatch?[tMatch[1].trim()]:'';state.meta.author=aMatch?[aMatch[1].trim()]:'';
    $('#bookTitle').value=state.meta.title;$('#bookAuthor').value=state.meta.author;
    // collect xhtml chapters (exclude nav/cover/toc)
    const spineFiles=[];const itemReg=/<item[^>]+href="([^"]+)"[^>]*id="([^"]+)"[^>]*media-type="application\/xhtml\+xml"/g;let m;while((m=itemReg.exec(opfXml))){const href=m[1],id=m[2];if(/nav\.xhtml|cover\.xhtml|toc\.ncx/i.test(href))continue;const root=opfPath.split('/').slice(0,-1).join('/');const full=(root?root+'/':'')+href;spineFiles.push(full);}
    if(!spineFiles.length){Object.keys(zip.files).forEach(f=>{if(/\.xhtml$/i.test(f)&&!/nav\.xhtml|cover\.xhtml/i.test(f))spineFiles.push(f);});}
    const chapters=[];let aiRoleFound=null;
    for(const f of spineFiles){try{const html=await zip.file(f).async('string');const r=splitByRounds(html);if(r.preface&&r.preface.length){chapters.push(makePreface(r.preface));}
      r.rounds.forEach((blk,i)=>{const html=blk.map(n=>n.outerHTML).join('');const c={id:uid(),title:roundTitle(chapters.length+1-(r.preface?1:0)+(chapters.some(c=>c.title==='前言')?0:0)),html:html,manualTitle:false,file:'ch'+String(chapters.length+1).padStart(3,'0')+'.xhtml',navOrder:chapters.length};chapters.push(c);});
      // extract ai role from first ta.who
      if(!aiRoleFound){const ta=doc.querySelector&&null;const d=document.createElement('div');d.innerHTML=html;const t=d.querySelector('div.ta p.who');if(t&&t.textContent.trim())aiRoleFound=t.textContent.trim();}
    }catch(e){console.warn('skip file',f,e);}}
    // order: 目录(nav) / 封面(cover) / 前言 / 第N章
    const ordered=[];ordered.push(makeToc());ordered.push(makeCover());
    const preface=chapters.find(c=>c.title==='前言');if(preface)ordered.push(preface);
    chapters.filter(c=>c.title!=='前言').forEach((c,idx)=>{c.title=roundTitle(idx+1);c.navOrder=ordered.length;ordered.push(c);});
    state.chapters=ordered;state.meta.aiRole=aiRoleFound||'TA';$('#aiRole').value=state.meta.aiRole;
    saveDraft();selectChapter(state.chapters[0]&&state.chapters[0].id);renderAll();toast('导入并分章完成：'+state.chapters.length+' 章');
  }catch(e){console.error(e);toast('导入失败：'+(e.message||e));}finally{state.busy=false;}
}

// ---------- render ----------
function renderAll(){renderChapterList();renderToc();renderFoot();}
function renderChapterList(){$('#chapterList').innerHTML=state.chapters.map((c,i)=>`<li data-id="${c.id}" class="${c.id===state.currentId?'active':''}"><span class="t">${c.title}</span><span class="wc">${charCount(c.html)}字</span><button class="merge" title="合并到上一章" ${i===0?'disabled style="opacity:.3"':''}>合并↑</button><button class="del" title="删除">×</button></li>`).join('');}
function renderToc(){$('#tocList').innerHTML=state.chapters.map(c=>`<li style="display:flex;gap:6px;align-items:center;padding:4px 0;border-bottom:1px dashed #eee"><span style="flex:0 0 24px;color:#999">${c.navOrder}</span><input data-id="${c.id}" value="${c.title.replace(/"/g,'&quot;')}" style="flex:1;padding:4px 6px;border:1px solid #ddd;border-radius:4px;font-size:13px"></li>`).join('');$('#tocList').querySelectorAll('input[data-id]').forEach(inp=>inp.addEventListener('input',()=>{const c=state.chapters.find(x=>x.id===inp.dataset.id);if(c){c.title=inp.value;c.manualTitle=true;if(c.id===state.currentId)$('#titleInput').value=c.title;renderChapterList();updateMetaCur();}}));}
function renderFoot(){const tot=state.chapters.reduce((s,c)=>s+charCount(c.html),0);$('#footStat').textContent=`共 ${state.chapters.length} 章 · ${tot} 字`;}
function selectChapter(id){const c=state.chapters.find(x=>x.id===id);if(!c)return;state.currentId=id;$('#titleInput').value=c.title;$('#editor').innerHTML=c.html;hist.stack=[c.html];hist.idx=1;hist.armed=false;clearTimeout(hist.timer);window.scrollTo({top:0,behavior:'instant'});const ed=$('#editor');ed.scrollTop=0;renderChapterList();updateMetaCur();renderEditStat();}
function updateMetaCur(){const c=state.chapters.find(x=>x.id===state.currentId);$('#curMeta').value=c?c.title:'—';}
function renderEditStat(){const c=state.chapters.find(x=>x.id===state.currentId);if(!c)return;$('#editStat').textContent=`第 ${state.chapters.findIndex(x=>x.id===state.currentId)+1} 章 · ${charCount(c.html)} 字`;}
$('#chapterList').addEventListener('click',(e)=>{const li=e.target.closest('li[data-id]');if(!li)return;const id=li.dataset.id;if(e.target.classList.contains('merge')){mergeUp(id);return;}if(e.target.classList.contains('del')){deleteChapter(id);return;}selectChapter(id);});

// ---------- mutations ----------
$('#titleInput').addEventListener('input',()=>{const c=state.chapters.find(x=>x.id===state.currentId);if(!c)return;if(!c.manualTitle)c.manualTitle=true;c.title=$('#titleInput').value;renderChapterList();renderToc();updateMetaCur();scheduleDraft();});
function mergeUp(id){const i=state.chapters.findIndex(x=>x.id===id);if(i<=0)return;const cur=state.chapters[i],prev=state.chapters[i-1];prev.html=(prev.html||'<p><br></p>')+(cur.html||'<p><br></p>');state.chapters.splice(i,1);renumber();saveDraft();if(state.currentId===id)state.currentId=prev.id;renderAll();selectChapter(state.currentId);toast('已合并到上一章');}
function deleteChapter(id){if(state.chapters.length<=1)return toast('至少保留一章');const i=state.chapters.findIndex(x=>x.id===id);state.chapters.splice(i,1);renumber();saveDraft();if(state.currentId===id)state.currentId=state.chapters[0]?state.chapters[0].id:null;renderAll();if(state.currentId)selectChapter(state.currentId);}
function renumber(){let n=0;state.chapters.forEach(c=>{if(c.title==='目录'){c.navOrder=0;return;}if(c.title==='封面'){c.navOrder=1;return;}if(c.title==='前言'){c.navOrder=2;return;}n++;c.title='第 '+String(n).replace(/\d/g,d=>'〇一二三四五六七八九'[+d])+' 章';c.navOrder=2+n;});}
$('#btnNewChapter').addEventListener('click',()=>{const c=newChapter();state.chapters.push(c);renumber();saveDraft();renderAll();selectChapter(c.id);toast('已新建章节');});

// ---------- tabs ----------
document.querySelectorAll('.tabs button[data-tab]').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('.tabs button[data-tab]').forEach(x=>x.classList.toggle('on',x===b));$('#panelEdit').style.display=b.dataset.tab==='edit'?'block':'none';$('#panelToc').style.display=b.dataset.tab==='toc'?'block':'none';$('#panelMeta').style.display=b.dataset.tab==='meta'?'block':'none';}));

// ---------- draft ----------
function saveDraft(){try{const d={chapters:state.chapters,currentId:state.currentId,meta:state.meta};localStorage.setItem(RESTORE_KEY,JSON.stringify(d));state.draft=d;}catch(e){}}
let draftTimer=null;function scheduleDraft(){clearTimeout(draftTimer);draftTimer=setTimeout(saveDraft,900);}
['visibilitychange','pagehide'].forEach(ev=>window.addEventListener(ev,()=>{if(document.visibilityState==='hidden'||ev==='pagehide')saveDraft();}));
function loadDraft(){try{const raw=localStorage.getItem(RESTORE_KEY);if(!raw)return false;const d=JSON.parse(raw);if(!d||!Array.isArray(d.chapters)||!d.chapters.length)return false;state.draft=d;state.chapters=d.chapters;state.currentId=d.currentId||d.chapters[0].id;state.meta=d.meta||state.meta;if(state.meta.title)$('#bookTitle').value=state.meta.title;if(state.meta.author)$('#bookAuthor').value=state.meta.author;if(state.meta.aiRole)$('#aiRole').value=state.meta.aiRole;return true;}catch(e){return false;}}
if(loadDraft()){$('#restoreBar').classList.add('show');}
$('#btnRestore').addEventListener('click',()=>{if(!state.draft)return;$('#restoreBar').classList.remove('show');renderAll();selectChapter(state.currentId);toast('已恢复草稿');});
$('#btnDiscard').addEventListener('click',()=>{try{localStorage.removeItem(RESTORE_KEY);}catch(e){}state.draft=null;state.chapters=[];state.currentId=null;$('#restoreBar').classList.remove('show');$('#chapterList').innerHTML='';$('#tocList').innerHTML='';$('#editor').innerHTML='';$('#titleInput').value='';renderFoot();toast('已丢弃草稿');});

// ---------- export (V7: rebuild EPUB standard structure) ----------
async function exportEpub(){
  if(!state.chapters.length)return toast('暂无章节可导出');
  const zip=new JSZip();const OEBPS='OEBPS/';
  // 1) mimetype first (uncompressed)
  zip.file('mimetype','application/epub+zip',{compression:'STORE'});
  // 2) container.xml
  zip.file('META-INF/container.xml','<?xml version="1.0" encoding="UTF-8"?>\n<container version="1.0" xmlns="urn:oasis:names:tc:opendocument:xmlns:container"><rootfiles><rootfile full-path="OEBPS/content.opf" media-type="application/oebps-package+xml"/></rootfiles></rootfiles></container>\n');
  const title=safeName(state.meta.title)||'未命名';const author=safeName(state.meta.author)||'';
  // 3) style.css (reuse from imported zip or default)
  let css='body{font-family:"PingFang SC","Microsoft YaHei",sans-serif;line-height:1.7;padding:16px;color:#222}.me{background:#f0f6ff;border-left:3px solid #1f6feb;padding:6px 10px;margin:8px 0;border-radius:4px}.ta{background:#fdf6ec;border-left:3px solid #e0a94a;padding:6px 10px;margin:8px 0;border-radius:4px}.who{font-weight:700;color:#1f6feb;margin:0 0 4px}.ta .who{color:#a05a00}p{margin:4px 0}.meta{color:#888;font-size:12px}';
  try{if(state.zip){const f=state.zip.file('OEBPS/style.css')||state.zip.file('style.css');if(f)css=await f.async('string');} }catch(e){}
  zip.file(OEBPS+'style.css',css);
  // 4) chapters xhtml
  const chapterFiles=[];const navItems=[];
  state.chapters.forEach((c,idx)=>{const fn='ch'+String(idx+1).padStart(3,'0')+'.xhtml';c.file=fn;const xhtml=`<?xml version="1.0" encoding="UTF-8"?>\n<!DOCTYPE html>\n<html xmlns="http://www.w3.org/1999/xhtml" xmlns:epub="http://www.idpf.org/2007/ops" lang="zh-CN"><head><meta charset="utf-8"/><title>${c.title.replace(/&/g,'&amp;').replace(/</g,'&lt;')}</title><link rel="stylesheet" type="text/css" href="style.css"/></head><body>\n<h1>${c.title.replace(/&/g,'&amp;').replace(/</g,'&lt;')}</h1>\n${(c.html||'<p><br></p>').trim()}\n</body></html>\n`;zip.file(OEBPS+fn,xhtml);chapterFiles.push(fn);navItems.push({label:c.title,href:fn});});
  // 5) content.opf
  let manifest='';chapterFiles.forEach(f=>{manifest+=`    <item href="${f}" id="id_${f.replace('.xhtml','')}" media-type="application/xhtml+xml"/>\n`;});manifest+=`    <item href="style.css" id="id_css" media-type="text/css"/>\n    <item href="nav.xhtml" id="id_nav" media-type="application/xhtml+xml" properties="nav"/>\n`;
  let spine='';chapterFiles.forEach(f=>{spine+=`    <itemref idref="id_${f.replace('.xhtml','')}"/>\n`;});
  const opf=`<?xml version="1.0" encoding="UTF-8"?>\n<package xmlns="http://www.idpf.org/2007/opf" version="3.0" unique-identifier="bookid"><metadata xmlns:dc="http://purl.org/dc/elements/1.1/"><dc:title>${title.replace(/&/g,'&amp;').replace(/</g,'&lt;')}</dc:title><dc:creator>${author.replace(/&/g,'&amp;').replace(/</g,'&lt;')}</dc:creator><dc:identifier id="bookid">urn:uuid:${uid()}</dc:identifier><dc:language>zh-CN</dc:language></metadata><manifest>\n${manifest}</manifest><spine>\n${spine}</spine></package>\n`;
  zip.file(OEBPS+'content.opf',opf);
  // 6) nav.xhtml
  const navLis=navItems.map(n=>`      <li><a href="${n.href}">${n.label.replace(/&/g,'&amp;').replace(/</g,'&lt;')}</a></li>`).join('\n');
  const nav=`<?xml version="1.0" encoding="UTF-8"?>\n<!DOCTYPE html>\n<html xmlns="http://www.w3.org/1999/xhtml" xmlns:epub="http://www.idpf.org/2007/ops" lang="zh-CN"><head><meta charset="utf-8"/><title>目录</title><link rel="stylesheet" type="text/css" href="style.css"/></head><body>\n<nav epub:type="toc" id="toc"><h1>目录</h1><ol>\n${navLis}\n  </ol></nav>\n</body></html>\n`;
  zip.file(OEBPS+'nav.xhtml',nav);
  const blob=await zip.generateAsync({type:'blob',mimeType:'application/epub+zip'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=title+'.epub';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),5000);toast('已导出：'+title+'.epub');
}

// ---------- buttons ----------
$('#btnImport').addEventListener('click',()=>$('#fileInput').click());
$('#fileInput').addEventListener('change',(e)=>{const f=e.target.files&&e.target.files[0];if(f)importEpub(f);e.target.value='';});
$('#btnExport').addEventListener('click',exportEpub);
$('#btnNew').addEventListener('click',()=>$('#btnNewChapter').click());
$('#btnSave').addEventListener('click',()=>{saveDraft();toast('草稿已保存');});
$('#btnBackup').addEventListener('click',()=>{saveDraft();toast('已备份（草稿已存本地）');});
$('#btnMenu').addEventListener('click',()=>{$('#sidebar').classList.toggle('open');$('#scrim').classList.toggle('show');});
$('#scrim').addEventListener('click',()=>{$('#sidebar').classList.remove('open');$('#scrim').classList.remove('show');});
$('#aiRole').addEventListener('input',()=>{state.meta.aiRole=$('#aiRole').value.trim()||'TA';scheduleDraft();});
$('#bookTitle').addEventListener('input',()=>{state.meta.title=$('#bookTitle').value.trim();scheduleDraft();});
$('#bookAuthor').addEventListener('input',()=>{state.meta.author=$('#bookAuthor').value.trim();scheduleDraft();});

// ---------- init ----------
calibrateLayout();renderFoot();
})();
</script>
</body>
</html>
