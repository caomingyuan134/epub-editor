<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1f6feb">
<title>EPUB 分章工具 V8</title>
<style>
  :root{--blue:#1f6feb;--blue-d:#1858c4;--ink:#1a1a1a;--muted:#6b7280;--line:#e5e7eb;--me:#eef5ff;--ta:#fff4e6;--warn:#f59e0b}
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;color:var(--ink);background:#f6f8fb;font-size:15px;line-height:1.6}
  #fixedHeader{position:fixed;top:0;left:0;right:0;z-index:1000;background:#1f6feb;color:#fff;box-shadow:0 2px 6px rgba(0,0,0,.12)}
  #topbar{display:flex;flex-wrap:wrap;gap:6px;padding:8px 10px;align-items:center}
  #topbar .tbtn{flex:0 1 auto;padding:7px 11px;border:none;border-radius:8px;background:rgba(255,255,255,.16);color:#fff;font-size:14px;font-weight:600;cursor:pointer;white-space:nowrap}
  #topbar .tbtn:active{background:rgba(255,255,255,.3)}
  #topbar .spacer{flex:1 1 auto;min-width:8px}
  #toolbar{display:flex;flex-wrap:wrap;gap:4px;padding:6px 10px;background:#fff;border-bottom:1px solid var(--line);align-items:center}
  #toolbar button{flex:0 1 auto;padding:6px 9px;border:1px solid var(--line);border-radius:7px;background:#fafbfc;color:var(--ink);font-size:13px;cursor:pointer;white-space:nowrap}
  #toolbar button:active{background:#eef2f7}
  #toolbar .sep{width:1px;height:20px;background:var(--line);margin:0 2px}
  #restoreBar{display:none;position:fixed;top:0;left:0;right:0;z-index:1100;background:#fff8e1;border-bottom:2px solid var(--warn);color:#7a5a00;padding:9px 12px;font-size:14px;align-items:center;gap:8px;flex-wrap:wrap}
  #restoreBar.show{display:flex}
  #restoreBar button{padding:5px 11px;border-radius:7px;border:1px solid #d6b94a;background:#fff;color:#7a5a00;font-weight:600;cursor:pointer}
  #restoreBar .rb-restore{background:#fde68a}
  #app{display:flex;min-height:calc(100vh - 0px)}
  #sidebar{width:240px;background:#fff;border-right:1px solid var(--line);padding:10px;overflow-y:auto;position:fixed;top:0;bottom:0;left:0;transform:translateX(-100%);transition:transform .25s;z-index:900}
  #sidebar.open{transform:translateX(0)}
  #sidebar h3{font-size:14px;color:var(--muted);margin:4px 2px 8px;text-transform:uppercase;letter-spacing:.5px}
  .ch-item{padding:7px 8px;border-radius:7px;cursor:pointer;font-size:13px;display:flex;flex-direction:column;gap:2px;border:1px solid transparent}
  .ch-item:hover{background:#f0f4fa}
  .ch-item.active{background:#e7f0ff;border-color:#bcd4fb;font-weight:600}
  .ch-item .ch-title{display:flex;align-items:center;gap:6px}
  .ch-item .ch-wc{font-size:11px;color:var(--muted);font-weight:400}
  .ch-item .ch-actions{display:none;gap:4px;margin-top:3px}
  .ch-item.active .ch-actions{display:flex}
  .ch-item .merge-btn{padding:2px 7px;font-size:11px;border:1px solid var(--blue);background:#eef5ff;color:var(--blue);border-radius:5px;cursor:pointer}
  .ch-item .del-btn{padding:2px 7px;font-size:11px;border:1px solid #f3a7a7;background:#fff0f0;color:#c0392b;border-radius:5px;cursor:pointer}
  .ch-item input.ch-name{flex:1;min-width:0;padding:3px 6px;font-size:12px;border:1px solid var(--line);border-radius:5px}
  #newChBtn{margin-top:10px;width:100%;padding:8px;border:1px dashed var(--blue);background:#f5f9ff;color:var(--blue);border-radius:8px;font-size:13px;font-weight:600;cursor:pointer}
  #newChBtn:active{background:#e7f0ff}
  #scrim{display:none;position:fixed;inset:0;background:rgba(0,0,0,.28);z-index:850}
  #scrim.show{display:block}
  #main{flex:1;padding:14px;max-width:860px;margin:0 auto;width:100%}
  .meta-card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:14px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
  .meta-card label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}
  .meta-card input,.meta-card select{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;font-size:14px;background:#fafbfc}
  .meta-row{display:flex;gap:10px;margin-bottom:10px}
  .meta-row>div{flex:1}
  .edit-card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
  .edit-card .ch-head{display:flex;gap:8px;align-items:center;margin-bottom:10px}
  .edit-card .ch-head input{flex:1;padding:8px 10px;border:1px solid var(--line);border-radius:8px;font-size:15px;font-weight:700}
  .edit-card .ch-info{font-size:12px;color:var(--muted);margin-bottom:12px}
  #editor{outline:none;min-height:300px;padding-top:8px}
  #editor:focus{background:#fcfdff}
  .who{font-size:12px;font-weight:700;color:var(--muted);margin:6px 0 2px;letter-spacing:.3px}
  .me,.ta{position:relative;border-radius:12px;padding:10px 12px;margin:8px 0;border-left:4px solid #bcd4fb;background:var(--me)}
  .ta{border-left-color:#f0b982;background:var(--ta)}
  .me>.who:first-child,.ta>.who:first-child{display:inline-block;padding:2px 8px;border-radius:99px;background:var(--blue);color:#fff;font-size:11px;margin:-4px 0 6px}
  .ta>.who:first-child{background:#e08a4c}
  .me p,.ta p{margin:4px 0}
  .toast{position:fixed;left:50%;bottom:32px;transform:translateX(-50%);background:#323232;color:#fff;padding:9px 16px;border-radius:9px;font-size:13px;z-index:1200;opacity:0;transition:opacity .25s;pointer-events:none;max-width:90vw;text-align:center}
  .toast.show{opacity:1}
  .tabbar{display:flex;gap:6px;margin-bottom:10px;border-bottom:1px solid var(--line);padding-bottom:8px}
  .tabbar button{padding:6px 12px;border:none;background:transparent;color:var(--muted);font-size:14px;font-weight:600;cursor:pointer;border-radius:7px}
  .tabbar button.active{background:#eef5ff;color:var(--blue)}
  .panel{display:none}
  .panel.active{display:block}
  @media(max-width:640px){
    #sidebar{width:82%;max-width:320px}
    #main{padding:12px 10px}
    .meta-row{flex-direction:column;gap:8px}
  }
</style>
</head>
<body>
<div id="fixedHeader">
  <div id="topbar">
    <button class="tbtn" id="btnImport">导入</button>
    <button class="tbtn" id="btnSave">保存</button>
    <button class="tbtn" id="btnBackup">备份</button>
    <button class="tbtn" id="btnExport">导出</button>
    <button class="tbtn" id="btnNew">新建</button>
    <span class="spacer"></span>
    <button class="tbtn" id="btnMenu" title="章节面板">☰</button>
  </div>
  <div id="toolbar">
    <button data-cmd="undo" title="撤销">↩ 撤销</button>
    <button data-cmd="redo" title="重做">↪ 重做</button>
    <span class="sep"></span>
    <button data-cmd="bold"><b>B</b></button>
    <button data-cmd="italic"><i>I</i></button>
    <button data-cmd="underline"><u>U</u></button>
    <span class="sep"></span>
    <button data-cmd="formatBlock" data-val="H2">H2</button>
    <button data-cmd="formatBlock" data-val="H3">H3</button>
    <span class="sep"></span>
    <button data-cmd="insertUnorderedList">• 列表</button>
    <button data-cmd="createLink" title="链接">🔗</button>
    <button data-cmd="removeFormat">清除格式</button>
  </div>
</div>
<div id="restoreBar">
  <span>⚠ 检测到未保存的草稿，是否恢复？</span>
  <button class="rb-restore" id="rbRestore">恢复</button>
  <button class="rb-discard" id="rbDiscard">丢弃</button>
</div>
<div id="scrim"></div>
<div id="app">
  <aside id="sidebar">
    <div class="tabbar">
      <button class="active" data-tab="ch">章节</button>
      <button data-tab="toc">目录</button>
      <button data-tab="meta">元数据</button>
    </div>
    <div class="panel active" id="panel-ch">
      <h3>章节列表</h3>
      <div id="chList"></div>
      <button id="newChBtn">+ 新建章节</button>
    </div>
    <div class="panel" id="panel-toc">
      <h3>目录（自动生成）</h3>
      <div id="tocList" style="font-size:13px;color:var(--ink)"></div>
    </div>
    <div class="panel" id="panel-meta">
      <h3>元数据</h3>
      <div class="meta-row"><div><label>书名</label><input id="metaTitle" placeholder="未命名"></div></div>
      <div class="meta-row"><div><label>作者</label><input id="metaAuthor" placeholder="未知"></div></div>
      <div class="meta-row"><div><label>AI 角色名（新建章节沿用）</label><input id="metaAiRole" placeholder="TA"></div></div>
    </div>
  </aside>
  <main id="main">
    <div class="meta-card">
      <div class="meta-row">
        <div><label>章节标题</label><input id="curTitle" placeholder="章节标题"></div>
        <div><label>状态</label><input id="curInfo" disabled placeholder="第 1 段 · 0 字"></div>
      </div>
    </div>
    <div class="edit-card">
      <div id="editor" contenteditable="true" spellcheck="false" data-placeholder="点击「导入」选择 .epub 文件，将自动按 me/ta 轮次分章…"></div>
    </div>
  </main>
</div>
<div class="toast" id="toast"></div>
<input type="file" id="fileInput" accept=".epub,application/epub+zip" style="display:none">
<script src="jszip.min.js"></script>
<script>
(function(){
'use strict';
const $=(s)=>document.querySelector(s);
const RESTORE_KEY='epubEditorDraftV8';
const HIST_MAX=30;
const DRAFT_DEBOUNCE=900;
const SNAP_DEBOUNCE=500;
const state={
  chapters:[],cur:0,meta:{title:'',author:'',aiRole:'TA'},zip:null,opfPath:null,
  dirty:false,draft:null,hist:[],histIdx:-1,histArmed:false,snapPending:false
};
const toast=(m)=>{const t=$('#toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2200)};
const safeName=(s)=>(s||'未命名').replace(/[\/\\:*?"<>|]/g,'_').replace(/\s+/g,' ').trim()||'未命名';
const uid=()=>Math.random().toString(36).slice(2,9);

// ---------- 布局校准 ----------
function calibrateLayout(){
  const fh=$('#fixedHeader');const h=fh?fh.offsetHeight:0;
  document.body.style.paddingTop=h+'px';
  const sb=$('#sidebar');if(sb){sb.style.top=h+'px';}
  const sc=$('#scrim');if(sc)sc.style.top=h+'px';
  const rb=$('#restoreBar');if(rb&&rb.classList.contains('show')){}else if(rb)rb.style.top='0';
}
window.addEventListener('load',calibrateLayout);window.addEventListener('resize',calibrateLayout);

// ---------- 工具 ----------
function el(tag,attrs={},...kids){const e=document.createElement(tag);for(const k in attrs){if(k==='class')e.className=attrs[k];else if(k==='html')e.innerHTML=attrs[k];else e.setAttribute(k,attrs[k]);}for(const c of kids){if(c==null)continue;e.appendChild(typeof c==='string'?document.createTextNode(c):c);}return e;}
function parseHTML(html){const d=document.implementation.createHTMLDocument('');d.body.innerHTML=html;return d;}
function whoText(div){const w=div.querySelector('.who');return w?w.textContent.trim():'';}
function blockOf(cls,who,html){return `<div class="${cls}"><p class="who">${who||(cls==='me'?'我':'TA')}</p>${html||'<p><br></p>'}</div>`;}

// ---------- 分章核心 ----------
// 三段划分：A 纯开场白(首个me/ta之前、不含<body起始段) -> 前言
// B <body起始后的<h1>时间戳段 -> 并入首回合作为第一章开头
// C 首个me/ta起 -> 正常轮次切分
function splitByRounds(bodyHTML){
  const doc=parseHTML(bodyHTML);const body=doc.body;if(!body)return {preamble:'',rounds:[]};
  const nodes=Array.from(body.children);
  const isMeTa=(n)=>n.classList&&(n.classList.contains('me')||n.classList.contains('ta'));
  const isH1Time=(n)=>n.tagName==='H1'&&/玄渊历|时间|历·/.test(n.textContent||'');
  let firstMeTaIdx=-1;for(let i=0;i<nodes.length;i++){if(isMeTa(nodes[i])){firstMeTaIdx=i;break;}}
  let preambleHTML='',firstRoundHTML='';
  if(firstMeTaIdx===-1){
    // 无 me/ta：整段作为单回合(fallback)
    return {preamble:'',rounds:[nodes.map(n=>n.outerHTML).join('')]};
  }
  // A: 首个 me/ta 之前的所有节点 -> 前言（若其中含 h1 时间戳，移出归首回合）
  const before=nodes.slice(0,firstMeTaIdx);
  let preambleParts=[],firstRoundParts=[];
  for(const n of before){
    if(isH1Time(n))firstRoundParts.push(n.outerHTML);else preambleParts.push(n.outerHTML);
  }
  preambleHTML=preambleParts.join('');
  // B: h1 时间戳段 + 首个 me/ta 块 -> 首回合开头
  firstRoundParts.push(nodes[firstMeTaIdx].outerHTML);
  // 从 firstMeTaIdx+1 起，连续 me/ta 块归入首回合，直到遇到非 me/ta 节点停止（话题切换切分）
  let i=firstMeTaIdx+1;
  while(i<nodes.length&&isMeTa(nodes[i])){firstRoundParts.push(nodes[i].outerHTML);i++;}
  // 若中间夹了非me/ta再遇me/ta，作为第二轮次（连续聚合到话题切换）
  while(i<nodes.length){
    if(isMeTa(nodes[i])){
      let round=[nodes[i].outerHTML];i++;
      while(i<nodes.length&&isMeTa(nodes[i])){round.push(nodes[i].outerHTML);i++;}
      firstRoundHTML?null:null; // placeholder
      (firstRoundHTML===''?firstRoundHTML:null); // not used
      // 收集到 rounds
      roundsPush(round.join(''));
    }else{i++;}
  }
  function roundsPush(h){} // no-op, collected below
  // 重新用清晰逻辑收集 rounds
  const rounds=[];
  if(firstRoundParts.length)rounds.push(firstRoundParts.join(''));
  // 重新扫描：首回合已含 nodes[0..firstMeTaIdx] 中 h1 + firstMeTaIdx 块 + 连续 me/ta
  // 为准确，基于原始节点二次切分
  return {preamble:preambleHTML,rounds:collectRounds(nodes,firstMeTaIdx)};
}
function collectRounds(nodes,firstMeTaIdx){
  const isMeTa=(n)=>n.classList&&(n.classList.contains('me')||n.classList.contains('ta'));
  const rounds=[];let i=firstMeTaIdx;
  while(i<nodes.length){
    if(isMeTa(nodes[i])){
      const round=[nodes[i].outerHTML];i++;
      while(i<nodes.length&&isMeTa(nodes[i])){round.push(nodes[i].outerHTML);i++;}
      rounds.push(round.join(''));
    }else{i++;}
  }
  return rounds;
}

// ---------- 章节构建 ----------
function newChapter(opts={}){return Object.assign({id:uid(),title:opts.title||'新章节',body:opts.body||'',isSpecial:!!opts.isSpecial,role:opts.role||''},opts);}
function createChapter(title,body){return newChapter({title,body});}

// 强制固定顺序：目录 -> 封面 -> 前言 -> 第N章
function orderChapters(list){
  const nav=list.filter(c=>c.role==='nav');const cover=list.filter(c=>c.role==='cover');
  const others=list.filter(c=>c.role!=='nav'&&c.role!=='cover');
  const pre=others.filter(c=>c.title==='前言');const rest=others.filter(c=>c.title!=='前言');
  return [].concat(nav,cover,pre,rest);
}

// ---------- 渲染 ----------
function renderChapters(){
  const box=$('#chList');box.innerHTML='';
  state.chapters.forEach((c,idx)=>{
    const item=el('div','ch-item'+(idx===state.cur?' active':''),
      el('div','ch-title',
        el('input','ch-name',{type:'text',value:String(c.title||'未命名'),title:'章节名'}),
        el('span','ch-wc',(c.body.replace(/<[^>]+>/g,'').length)+' 字')
      ),
      el('div','ch-actions',
        el('button','merge-btn',{title:'合并到上一章'},'合并↑'),
        el('button','del-btn',{title:'删除本章'},'×')
      )
    );
    item.querySelector('.ch-name').addEventListener('change',e=>{c.title=e.target.value;if(c.tocItem)c.tocItem.manual=true;renderTOC();saveDraft();});
    item.querySelector('.merge-btn').addEventListener('click',e=>{e.stopPropagation();mergeUp(idx);});
    item.querySelector('.del-btn').addEventListener('click',e=>{e.stopPropagation();deleteChapter(idx);});
    item.addEventListener('click',()=>switchChapter(idx));
    box.appendChild(item);
  });
  const total=state.chapters.reduce((a,c)=>a+(c.body.replace(/<[^>]+>/g,'').length),0);
  const footer=el('div','ch-wc',`共 ${state.chapters.length} 章 · 合计 ${total} 字`);
  box.appendChild(footer);
}
function renderTOC(){
  const box=$('#tocList');box.innerHTML='';
  state.chapters.forEach((c,idx)=>{
    const div=el('div',null,`${idx+1}. ${String(c.title||'未命名')}`);
    div.style.padding='3px 2px';div.style.cursor='pointer';
    div.addEventListener('click',()=>switchChapter(idx));
    box.appendChild(div);c.tocItem={manual:c.tocItem?c.tocItem.manual:false};
  });
}
function refreshAll(){renderChapters();renderTOC();}

// ---------- 章节切换 / 保存当前 ----------
function saveCurrentChapter(){
  const idx=state.cur;if(idx<0||idx>=state.chapters.length)return;
  const ed=$('#editor');const html=ed.innerHTML||'';
  state.chapters[idx].body=html;
  const ti=$('#curTitle');if(ti&&ti.value)state.chapters[idx].title=ti.value;
  const wc=(html.replace(/<[^>]+>/g,'')).length;
  const info=$('#curInfo');if(info)info.value=`第 ${idx+1} 章 · ${wc} 字`;
  state.dirty=true;scheduleDraft();
}
function switchChapter(idx){
  if(idx<0||idx>=state.chapters.length)return;
  saveCurrentChapter(); // 切换前持久化当前章
  state.cur=idx;const c=state.chapters[idx];
  $('#curTitle').value=c.title||'';
  const ed=$('#editor');ed.innerHTML=c.body||'';
  const wc=(c.body.replace(/<[^>]+>/g,'')).length;
  $('#curInfo').value=`第 ${idx+1} 章 · ${wc} 字`;
  pushHist();renderChapters();
  window.scrollTo({top:0,behavior:'instant'});
  const ed2=$('#editor');ed2.scrollTop=0;
}

// ---------- 合并 / 删除 / 新建 ----------
function mergeUp(idx){
  if(idx<=0||idx>=state.chapters.length)return;
  const cur=state.chapters[idx],prev=state.chapters[idx-1];
  prev.body=(prev.body||'')+(cur.body||'');
  prev.title=prev.title||cur.title; // 取上一章标题
  state.chapters.splice(idx,1);
  // 重新编号非特殊章节
  renumber();
  state.cur=idx-1;switchChapter(state.cur);refreshAll();saveDraft();toast('已合并到上一章');
}
function deleteChapter(idx){
  if(idx<0||idx>=state.chapters.length)return;
  if(!confirm('确定删除本章？'))return;
  state.chapters.splice(idx,1);renumber();
  if(state.cur>=state.chapters.length)state.cur=state.chapters.length-1;
  if(state.cur<0)state.chapters.push(newChapter({title:'第1章',body:blockOf('me','我','<p><br></p>')+blockOf('ta',state.meta.aiRole||'TA','<p><br></p>')}));
  refreshAll();switchChapter(state.cur);saveDraft();toast('已删除');
}
function renumber(){
  let n=0;state.chapters.forEach(c=>{if(c.role==='nav'||c.role==='cover'||c.title==='前言')return;n++;if(!c.tocItem||!c.tocItem.manual){c.title=`第${n}章`;}});
}
function addChapter(){
  const taWho=state.meta.aiRole||'TA';
  const c=newChapter({title:`新章节 ${state.chapters.length+1}`,body:blockOf('me','我','<p><br></p>')+blockOf('ta',taWho,'<p><br></p>')});
  state.chapters.push(c);renumber();refreshAll();switchChapter(state.chapters.length-1);saveDraft();toast('已新建章节');
}

// ---------- 导入 EPUB ----------
async function importEpub(file){
  try{
    // 导入新书前先清旧草稿
    localStorage.removeItem(RESTORE_KEY);state.draft=null;state.dirty=false;
    const zip=new JSZip();state.zip=await zip.loadAsync(file);
    // 找 OPF
    const container=await state.zip.file('META-INF/container.xml').async('string');
    const opfPath=(container.match(/full-path="([^"]+)"/)||[])[1]||'OEBPS/content.opf';
    state.opfPath=opfPath;
    const opfStr=await state.zip.file(opfPath).async('string');
    const opfDoc=parseHTML(opfStr);const opf=opfDoc.documentElement;
    const ns={'opf':'http://www.idpf.org/2007/opf','dc':'http://purl.org/dc/elements/1.1/'};
    const $o=(sel)=>opfDoc.querySelector(sel);
    // 元数据
    const dcTitle=$o('dc|title');const dcCreator=$o('dc|creator');
    state.meta.title=dcTitle?dcTitle.textContent.trim():'';
    state.meta.author=dcCreator?dcCreator.textContent.trim():'';
    $('#metaTitle').value=state.meta.title;$('#metaAuthor').value=state.meta.author;
    // manifest 条目
    const manifest={};opfDoc.querySelectorAll('manifest>item').forEach(it=>{manifest[it.getAttribute('id')]={href:it.getAttribute('href'),media:it.getAttribute('media-type')};});
    const spineIds=Array.from(opfDoc.querySelectorAll('spine>itemref')).map(r=>r.getAttribute('idref'));
    const opfDir=opfPath.split('/').slice(0,-1).join('/');
    const resolve=(href)=>opfDir?opfDir+'/'+href:href;
    let navChapter=null,coverChapter=null,bodyChapters=[];
    for(const id of spineIds){
      const m=manifest[id];if(!m)continue;
      const href=m.href;const full=resolve(href);
      const f=state.zip.file(full);if(!f)continue;
      const html=await f.async('string');const doc=parseHTML(html);const body=doc.body;if(!body)continue;
      const $t=doc.querySelector('title');const titleTxt=$t?$t.textContent.trim():href;
      if(/nav\.xhtml$|nav\.xhtml/i.test(href)||doc.querySelector('nav')){
        navChapter=newChapter({title:'目录',body:body.innerHTML,role:'nav',isSpecial:true});
      }else if(/cover\.xhtml$|cover\.xhtml/i.test(href)||/cover/i.test(titleTxt)){
        coverChapter=newChapter({title:'封面',body:body.innerHTML,role:'cover',isSpecial:true});
      }else{
        bodyChapters.push({href,html,title:titleTxt});
      }
    }
    // 提取 AI 角色名（方案B：首个 ta.who）
    let aiRole='TA';
    for(const bc of bodyChapters){if(aiRole!=='TA')break;const d=parseHTML(bc.html);const ta=d.querySelector('.ta .who');if(ta&&ta.textContent.trim())aiRole=ta.textContent.trim();}
    state.meta.aiRole=aiRole;$('#metaAiRole').value=aiRole;
    // 分章
    const chapters=[];
    if(navChapter)chapters.push(navChapter);
    if(coverChapter)chapters.push(coverChapter);
    for(const bc of bodyChapters){
      const {preamble,rounds}=splitByRounds((parseHTML(bc.html)).body.innerHTML);
      if(preamble&&preamble.replace(/<[^>]+>/g,'').trim())chapters.push(newChapter({title:'前言',body:preamble}));
      rounds.forEach((r,ri)=>{chapters.push(newChapter({title:ri===0?`第一章`:`第${ri+1}章`,body:r}));});
    }
    // 若没有任何非特殊章节，至少留一个
    const ordered=orderChapters(chapters);
    state.chapters=ordered;state.cur=0;
    renumber();refreshAll();switchChapter(0);saveDraft();
    toast(`导入成功：${state.chapters.length} 章`);
  }catch(err){console.error(err);toast('导入失败：'+err.message);}
}

// ---------- 导出 EPUB（完整重建标准结构）----------
async function exportEpub(){
  try{
    saveCurrentChapter();
    const meta=state.meta;const title=safeName(meta.title)||'未命名';
    const author=meta.author||'未知';
    const zip=JSZip?new JSZip():null;if(!zip)throw new Error('JSZip 未加载');
    // mimetype 首条目 STORE
    zip.file('mimetype','application/epub+zip',{compression:'STORE'});
    zip.file('META-INF/container.xml','<?xml version="1.0" encoding="UTF-8"?>\n<container version="1.0" xmlns="urn:oasis:names:tc:opendocument:xmlns:container"><rootfiles><rootfile full-path="OEBPS/content.opf" media-type="application/oebps-package+xml"/></rootfiles></rootfiles></container>');
    // 章节 xhtml
    const chDir='OEBPS/chapters';const manifestItems=[];const spineIds=[];
    const chFiles=[];
    state.chapters.forEach((c,idx)=>{
      const id=`ch${String(idx).padStart(3,'0')}`;const href=`chapters/${id}.xhtml`;
      const xhtml=`<?xml version="1.0" encoding="UTF-8"?>\n<!DOCTYPE html>\n<html xmlns="http://www.w3.org/1999/xhtml" xmlns:epub="http://www.idpf.org/2007/ops" lang="zh-CN"><head><meta charset="utf-8"/><title>${c.title||'未命名'}</title><link rel="stylesheet" type="text/css" href="../style.css"/></head><body>\n<h1>${c.title||'未命名'}</h1>\n${(c.body||'')}\n</body></html>`;
      zip.file(chDir+'/'+id+'.xhtml',xhtml);
      chFiles.push({id,href,title:c.title||'未命名',isNav:c.role==='nav',isCover:c.role==='cover'});
      manifestItems.push(`<item id="${id}" href="${href}" media-type="application/xhtml+xml"/>`);
      spineIds.push(`<itemref idref="${id}"/>`);
    });
    // nav.xhtml
    const navXML=`<?xml version="1.0" encoding="UTF-8"?>\n<!DOCTYPE html>\n<html xmlns="http://www.w3.org/1999/xhtml" xmlns:epub="http://www.idpf.org/2007/ops" lang="zh-CN"><head><meta charset="utf-8"/><title>目录</title></head><body><nav epub:type="toc" id="toc"><h1>目录</h1><ol>${chFiles.filter(f=>!f.isNav).map(f=>`<li><a href="${f.href}">${f.title}</a></li>`).join('')}</ol></nav></body></html>`;
    zip.file('OEBPS/nav.xhtml',navXML);
    // toc.ncx
    const ncx=`<?xml version="1.0" encoding="UTF-8"?>\n<ncx xmlns="http://www.daisy.org/z3986/2005/ncx/" version="2005-1"><head><meta name="dtb:uid" content="urn:uuid:${uid()}"/><meta name="dtb:depth" content="1"/></head><docTitle><text>${title}</text></docTitle><navMap>${chFiles.filter(f=>!f.isNav).map((f,i)=>`<navPoint id="np${i+1}" playOrder="${i+1}"><navLabel><text>${f.title}</text></navLabel><content src="${f.href}"/></navPoint>`).join('')}</navMap></ncx>`;
    zip.file('OEBPS/toc.ncx',ncx);
    // style.css（优先原 zip 覆盖，否则默认）
    let css='body{font-family:"Source Han Serif SC","Noto Serif CJK SC",serif;line-height:1.8;padding:24px;max-width:720px;margin:0 auto;color:#222}.me{background:#eef5ff;border-left:4px solid #1f6feb;padding:10px 12px;margin:10px 0;border-radius:8px}.ta{background:#fff4e6;border-left:4px solid #e08a4c;padding:10px 12px;margin:10px 0;border-radius:8px}.who{font-size:12px;font-weight:700;color:#555;margin:4px 0}.meta{color:#888;font-size:12px}';
    if(state.zip){const sf=state.zip.file('OEBPS/style.css')||state.zip.file('style.css');if(sf)css=await sf.async('string');}
    zip.file('OEBPS/style.css',css);
    // 复制原始 zip 非 xhtml 资源（图片/CSS/字体/ncx 若未重建）到 OEBPS
    if(state.zip){state.zip.forEach((path,z)=>{if(!path.startsWith('OEBPS/')&&!path.startsWith('META-INF/')&&path!=='mimetype')return;if(path==='OEBPS/content.opf'||path==='OEBPS/nav.xhtml'||path==='OEBPS/toc.ncx'||path==='OEBPS/style.css')return;if(path.endsWith('.xhtml')||path.endsWith('.html'))return;/* 用重建章节 */zip.file(path,z.async('uint8array'));});}
    // content.opf
    const opf=`<?xml version="1.0" encoding="UTF-8"?>\n<package xmlns="http://www.idpf.org/2007/opf" version="3.0" unique-identifier="bookid"><metadata xmlns:dc="http://purl.org/dc/elements/1.1/"><dc:title>${title}</dc:title><dc:creator>${author}</dc:creator><dc:identifier id="bookid">urn:uuid:${uid()}</dc:identifier><dc:language>zh-CN</dc:language><meta property="dcterms:modified">${new Date().toISOString().slice(0,19)+'Z'}</meta></metadata><manifest><item id="nav" href="nav.xhtml" media-type="application/xhtml+xml" properties="nav"/><item id="ncx" href="toc.ncx" media-type="application/x-dtbncx+xml"/><item id="css" href="style.css" media-type="text/css"/>${manifestItems.join('')}</manifest><spine toc="ncx">${spineIds.join('')}</spine></package>`;
    zip.file('OEBPS/content.opf',opf);
    const blob=await zip.generateAsync({type:'blob',mimeType:'application/epub+zip'});
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=title+'.epub';document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href),5000);
    toast('导出完成：'+title+'.epub');
  }catch(err){console.error(err);toast('导出失败：'+err.message);}
}

// ---------- 历史（撤销/重做）via MutationObserver + rAF 空闲快照 ----------
const ed=$('#editor');
function pushHist(){
  const html=ed.innerHTML||'';
  if(state.histIdx>=0&&state.hist[state.histIdx]===html)return;
  if(state.histIdx<state.hist.length-1)state.hist=state.hist.slice(0,state.histIdx+1);
  state.hist.push(html);if(state.hist.length>HIST_MAX)state.hist.shift();
  state.histIdx=state.hist.length-1;state.histArmed=false;
}
function undo(){if(state.histIdx>0){state.histIdx--;ed.innerHTML=state.hist[state.histIdx];toast('已撤销');}}
function redo(){if(state.histIdx<state.hist.length-1){state.histIdx++;ed.innerHTML=state.hist[state.histIdx];toast('已重做');}}
let snapRaf=null,snapPending=false,lastSnap=0;
function scheduleSnapshot(){
  if(snapPending)return;snapPending=true;
  requestAnimationFrame(()=>{
    const now=Date.now();if(now-lastSnap>=SNAP_DEBOUNCE){pushHist();lastSnap=now;}
    snapPending=false;
  });
}
if(window.MutationObserver){new MutationObserver(()=>scheduleSnapshot()).observe(ed,{childList:true,subtree:true,characterData:true});}
ed.addEventListener('input',()=>{scheduleSnapshot();state.dirty=true;scheduleDraft();});
// 工具栏命令
$('#toolbar').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const cmd=b.dataset.cmd;if(cmd==='undo')undo();else if(cmd==='redo')redo();else if(cmd==='createLink'){const u=prompt('链接 URL');if(u)document.execCommand('createLink',false,u);}else{document.execCommand(cmd,false,b.dataset.val||null);ed.focus();}});

// ---------- 草稿 ----------
let draftTimer=null;
function scheduleDraft(){clearTimeout(draftTimer);draftTimer=setTimeout(()=>{try{const data={chapters:state.chapters,cur:state.cur,meta:state.meta};localStorage.setItem(RESTORE_KEY,JSON.stringify(data));state.draft=data;}catch(e){}},DRAFT_DEBOUNCE);}
function clearDraft(){localStorage.removeItem(RESTORE_KEY);state.draft=null;state.dirty=false;}
function showRestoreBar(){const rb=$('#restoreBar');if(!rb)return;rb.classList.add('show');rb.style.top='0';}
function hideRestoreBar(){const rb=$('#restoreBar');if(rb)rb.classList.remove('show');}
$('#rbRestore').addEventListener('click',()=>{try{const d=JSON.parse(localStorage.getItem(RESTORE_KEY)||'null');if(d){state.chapters=d.chapters||[];state.cur=d.cur||0;state.meta=d.meta||state.meta;$('#metaTitle').value=state.meta.title;$('#metaAuthor').value=state.meta.author;$('#metaAiRole').value=state.meta.aiRole;refreshAll();switchChapter(state.cur);toast('草稿已恢复');}}catch(e){}hideRestoreBar();});
$('#rbDiscard').addEventListener('click',()=>{clearDraft();hideRestoreBar();toast('已丢弃草稿');});
window.addEventListener('pagehide',()=>{if(state.dirty)try{localStorage.setItem(RESTORE_KEY,JSON.stringify({chapters:state.chapters,cur:state.cur,meta:state.meta}));}catch(e){}});
window.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden'&&state.dirty)try{localStorage.setItem(RESTORE_KEY,JSON.stringify({chapters:state.chapters,cur:state.cur,meta:state.meta}));}catch(e){}});

// ---------- 按钮 / 菜单 ----------
$('#btnImport').addEventListener('click',()=>$('#fileInput').click());
$('#fileInput').addEventListener('change',e=>{const f=e.target.files[0];if(f)importEpub(f);e.target.value='';});
$('#btnSave').addEventListener('click',()=>{saveCurrentChapter();saveDraft();toast('已保存');});
$('#btnBackup').addEventListener('click',()=>{saveCurrentChapter();exportEpub();});
$('#btnExport').addEventListener('click',()=>{const name=prompt('导出文件名（不含 .epub）',state.meta.title||'未命名');if(name===null)return;exportEpub();});
$('#btnNew').addEventListener('click',()=>addChapter());
$('#newChBtn').addEventListener('click',()=>addChapter());
$('#btnMenu').addEventListener('click',()=>{$('#sidebar').classList.toggle('open');$('#scrim').classList.toggle('show');});
$('#scrim').addEventListener('click',()=>{$('#sidebar').classList.remove('open');$('#scrim').classList.remove('show');});
document.querySelectorAll('.tabbar button').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('.tabbar button').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));$('#panel-'+b.dataset.tab).classList.add('active');}));
window.addEventListener('error',e=>toast('出错了：'+e.message));

// ---------- 初始化 ----------
function init(){
  // 恢复检查放在 init 末尾（state 就绪后）
  const draftStr=localStorage.getItem(RESTORE_KEY);
  if(draftStr){try{const d=JSON.parse(draftStr);if(d&&d.chapters&&d.chapters.length){state.draft=d;showRestoreBar();}}catch(e){}}
  // 空状态占位
  if(state.chapters.length===0){state.chapters.push(newChapter({title:'第1章',body:'<p>欢迎使用 EPUB 分章工具 V8。</p><p>点击顶部「导入」选择 .epub 文件，将自动按 me/ta 轮次分章。</p>'}));}
  refreshAll();switchChapter(0);calibrateLayout();
}
document.addEventListener('DOMContentLoaded',init);
})();
