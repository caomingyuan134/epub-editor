<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>EPUB 分章工具 V4</title>
<style>
  :root{--p:#2a6df4;--p2:#1d4fc4;--bg:#f4f6fb;--card:#fff;--bd:#e3e7f0;--tx:#1c2431;--mu:#6b7688;--danger:#d64545;--ok:#1a9e5a}
  *{box-sizing:border-box}html,body{margin:0;padding:0}body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--tx);font-size:15px;line-height:1.6;-webkit-text-size-adjust:100%}
  header{position:sticky;top:0;z-index:30;background:linear-gradient(135deg,var(--p),var(--p2));color:#fff;padding:10px 12px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;box-shadow:0 2px 8px rgba(42,109,244,.25)}
  header h1{font-size:16px;margin:0;flex:1;font-weight:700;letter-spacing:.5px;min-width:100px}
  .iconbtn{background:rgba(255,255,255,.16);color:#fff;border:0;border-radius:9px;padding:7px 10px;font-size:12.5px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
  .iconbtn:active{background:rgba(255,255,255,.3)}.iconbtn.danger{background:rgba(255,255,255,.14)}
  .menu-btn{display:none;background:rgba(255,255,255,.16);color:#fff;border:0;border-radius:9px;padding:7px 10px;font-size:16px;cursor:pointer;margin-right:2px}
  main{display:flex;max-width:1200px;margin:0 auto;padding:10px;gap:10px;align-items:flex-start}
  aside{width:300px;flex:0 0 300px;display:flex;flex-direction:column;gap:10px;position:sticky;top:60px;max-height:calc(100vh - 70px);overflow:auto}
  .card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
  .card h2{font-size:14px;margin:0 0 9px;color:var(--p);font-weight:700;display:flex;align-items:center;gap:6px}
  .tabs{display:flex;gap:5px;background:#eef1f7;border-radius:10px;padding:4px;margin-bottom:9px}
  .tab{flex:1;text-align:center;padding:6px 3px;border-radius:8px;font-size:12px;font-weight:600;color:var(--mu);cursor:pointer;user-select:none}
  .tab.on{background:#fff;color:var(--p);box-shadow:0 1px 3px rgba(0,0,0,.08)}
  .ch-item{display:flex;align-items:center;gap:7px;padding:7px 9px;border-radius:9px;cursor:pointer;font-size:13.5px;border:1px solid transparent}
  .ch-item:hover{background:#f0f4ff}.ch-item.active{background:#e8f0ff;border-color:#c9dcff;color:var(--p2);font-weight:600}
  .ch-item .ch-tt{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .ch-item .ch-wc{font-size:11px;color:var(--mu);white-space:nowrap;flex:0 0 auto}
  .ch-item .x{margin-left:auto;color:#b9c0cc;background:0;border:0;font-size:15px;cursor:pointer;padding:0 2px}
  .ch-item .x:active{color:var(--danger)}
  .ch-item .merge-btn{font:inherit;font-size:11px;padding:2px 7px;border:1px solid var(--bd);border-radius:7px;background:#fafbfd;color:var(--mu);cursor:pointer;white-space:nowrap}
  .ch-item .merge-btn:active{background:#eef3ff;color:var(--p2)}
  .addbtn{width:100%;margin-top:6px;padding:8px;background:#eef3ff;color:var(--p2);border:1px dashed #b9cfff;border-radius:10px;font-weight:700;cursor:pointer;font-size:13px}
  .addbtn:active{background:#e2ecff}
  .field{display:flex;flex-direction:column;gap:3px;margin-bottom:8px}
  .field label{font-size:11.5px;color:var(--mu);font-weight:600}
  .field input,.field textarea{font:inherit;padding:7px 9px;border:1px solid var(--bd);border-radius:9px;background:#fafbfd;color:var(--tx);width:100%;max-width:100%}
  .field textarea{resize:vertical;min-height:50px}
  .coverbox{display:flex;gap:9px;align-items:center}
  .coverbox img{width:54px;height:72px;object-fit:cover;border-radius:8px;border:1px solid var(--bd);background:#eee}
  .coverbox button{font:inherit;padding:6px 9px;border:1px solid var(--bd);border-radius:9px;background:#fff;cursor:pointer;font-size:12px}
  .editor-wrap{flex:1;min-width:0}
  .toolbar{display:flex;flex-wrap:wrap;gap:5px;background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:8px;position:sticky;top:60px;z-index:10;box-shadow:0 1px 3px rgba(0,0,0,.04)}
  .toolbar button{font:inherit;font-size:12.5px;padding:6px 9px;border:1px solid var(--bd);border-radius:9px;background:#fafbfd;cursor:pointer;font-weight:600;color:#33465f}
  .toolbar button:active{background:#e8f0ff;color:var(--p2)}
  .toolbar button.undo-redo{padding:6px 8px;font-size:14px}
  .toolbar button.split-btn{padding:6px 8px;font-size:12px;color:var(--p2);background:#eef3ff}
  .toolbar .sep{width:1px;background:var(--bd);margin:2px 3px}
  .editor{margin-top:10px;background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:18px 20px;min-height:55vh;box-shadow:0 1px 3px rgba(0,0,0,.04)}
  .editor:focus{outline:0;border-color:#b9cfff;box-shadow:0 0 0 3px #e2ecff}
  .editor h2{font-size:1.4em;margin:.6em 0 .4em}.editor h3{font-size:1.2em;margin:.5em 0 .3em}
  .ch-title-input{width:100%;font:inherit;font-size:17px;font-weight:700;padding:7px 9px;border:1px solid var(--bd);border-radius:10px;margin-bottom:9px;background:#fafbfd;max-width:100%}
  .toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:#22303f;color:#fff;padding:9px 14px;border-radius:10px;font-size:13px;z-index:99;opacity:0;pointer-events:none;transition:opacity .25s;max-width:92%;text-align:center}
  .toast.show{opacity:1}
  .dialog{position:fixed;inset:0;background:rgba(20,30,45,.45);display:none;align-items:center;justify-content:center;z-index:50;padding:14px}
  .dialog.show{display:flex}.dialog .card{max-width:400px;width:100%}
  .dialog h3{margin:0 0 7px;font-size:15px;color:var(--p)}
  .dialog p{margin:0 0 12px;font-size:13px;color:var(--mu)}
  .dialog .row{display:flex;gap:8px;justify-content:flex-end}
  .btn{font:inherit;padding:8px 13px;border-radius:10px;border:0;cursor:pointer;font-weight:700;font-size:13px}
  .btn.p{background:var(--p);color:#fff}.btn.p:active{background:var(--p2)}.btn.g{background:#eef1f7;color:#33465f}
  .recover-bar{display:none;background:#fff7e6;border:1px solid #f3d99a;color:#8a5a00;padding:9px 12px;border-radius:12px;margin-bottom:10px;align-items:center;gap:9px;font-size:13px}
  .recover-bar.show{display:flex}.recover-bar button{font:inherit;padding:5px 9px;border-radius:8px;border:0;cursor:pointer;font-weight:700;font-size:12px}
  .recover-bar .yes{background:#f0b429;color:#fff}.recover-bar .no{background:#f2f4f8;color:#33465f}
  .hint{font-size:11.5px;color:var(--mu);margin-top:5px;line-height:1.5}

  /* 分章结果弹窗 */
  #splitResultOverlay{position:fixed;inset:0;background:rgba(20,30,45,.5);display:none;align-items:center;justify-content:center;z-index:55;padding:14px}
  #splitResultOverlay.show{display:flex}
  #splitResultOverlay .card{max-width:420px;width:100%;max-height:80vh;display:flex;flex-direction:column}
  #splitResultOverlay h3{margin:0 0 6px;font-size:15px;color:var(--p)}
  #splitResultList{flex:1;overflow:auto;border:1px solid var(--bd);border-radius:10px;padding:6px;background:#fafbfd;min-height:100px}
  .sr-row{display:flex;gap:8px;padding:6px 8px;border-radius:7px;font-size:12.5px;align-items:baseline;border:1px solid transparent}
  .sr-row:nth-child(even){background:#f0f4ff}
  .sr-num{color:var(--mu);font-size:11px;flex:0 0 28px;text-align:right}
  .sr-title{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
  .sr-wc{font-size:11px;color:var(--mu);white-space:nowrap}
  #splitResultOverlay .row{display:flex;gap:8px;justify-content:flex-end;margin-top:10px}

  @media(max-width:820px){
    .menu-btn{display:inline-flex}
    main{padding:7px;gap:0}
    aside{position:fixed;top:0;left:0;bottom:0;width:86%;max-width:340px;height:100%;max-height:none;background:var(--bg);padding:9px;z-index:40;transform:translateX(-105%);transition:transform .28s ease;box-shadow:0 0 24px rgba(0,0,0,.18)}
    aside.open{transform:translateX(0)}
    .scrim{display:none;position:fixed;inset:0;background:rgba(20,30,45,.35);z-index:35}
    .scrim.show{display:block}
    .editor{padding:14px;min-height:50vh}
    .toolbar{top:auto;bottom:0;flex-wrap:wrap}
    .editor-wrap{padding-bottom:56px}
  }
</style>
</head>
<body>
<header>
  <button class="menu-btn" id="menuBtn" title="侧栏">☰</button>
  <h1>📖 EPUB 分章工具 V4</h1>
  <button class="iconbtn" id="importBtn">📂 导入</button>
  <button class="iconbtn" id="autoSplitBtn" title="导入后自动按轮次分章">✂ 自动分章</button>
  <button class="iconbtn" id="saveDraftBtn" title="手动保存草稿">💾 保存</button>
  <button class="iconbtn" id="backupDraftBtn" title="备份草稿为JSON">⬇️ 备份</button>
  <button class="iconbtn" id="exportBtn">📥 导出</button>
  <button class="iconbtn danger" id="newBtn" title="新建">✨ 新建</button>
  <input type="file" id="fileInput" accept=".epub" style="display:none">
  <input type="file" id="coverInput" accept="image/*" style="display:none">
</header>
<div class="scrim" id="scrim"></div>
<main>
  <aside id="aside">
    <div class="card">
      <div class="tabs">
        <div class="tab on" data-tab="ch">章节</div>
        <div class="tab" data-tab="toc">目录</div>
        <div class="tab" data-tab="meta">元数据</div>
      </div>
      <div id="panel-ch">
        <div id="chList"></div>
        <button class="addbtn" id="addCh">＋ 新增章节</button>
        <div class="hint">章节即正文文件。导入 epub 后点击「✂ 自动分章」可一键按轮次拆分。点章节旁的「合并」可与上一章合并。</div>
      </div>
      <div id="panel-toc" style="display:none">
        <div id="tocList"></div>
        <button class="addbtn" id="addToc">＋ 新增目录项</button>
        <div class="hint">目录自动跟随章节变化。双击目录项标题可手动修改。</div>
      </div>
      <div id="panel-meta" style="display:none">
        <div class="field"><label>书名</label><input id="m-title" placeholder="书名"></div>
        <div class="field"><label>作者</label><input id="m-author" placeholder="作者"></div>
        <div class="field"><label>语言</label><input id="m-lang" placeholder="zh-CN" value="zh-CN"></div>
        <div class="field"><label>出版社</label><input id="m-pub" placeholder="出版社"></div>
        <div class="field"><label>出版日期</label><input id="m-date" placeholder="2026-08-16"></div>
        <div class="field"><label>简介</div><textarea id="m-desc" placeholder="书籍简介"></textarea></div>
        <div class="field"><label>封面</label><div class="coverbox"><img id="coverImg" src="" alt=""><button id="coverPick">选择图片</button></div></div>
      </div>
    </div>
  </aside>
  <section class="editor-wrap">
    <div class="recover-bar" id="recoverBar"><span>检测到上次未导出的草稿，可自动恢复。</span><button class="yes" id="recoverYes">恢复</button><button class="no" id="recoverNo">丢弃</button></div>
    <div class="toolbar">
      <button class="undo-redo" id="undoBtn" title="撤销（连续输入/删除合并为一步）">↩ 撤销</button>
      <button class="undo-redo" id="redoBtn" title="重做">↪ 重做</button>
      <span class="sep"></span>
      <button data-cmd="bold" title="加粗"><b>B</b></button>
      <button data-cmd="italic" title="斜体"><i>I</i></button>
      <button data-cmd="underline" title="下划线"><u>U</u></button>
      <span class="sep"></span>
      <button data-cmd="formatBlock" data-val="H2">H2</button>
      <button data-cmd="formatBlock" data-val="H3">H3</button>
      <span class="sep"></span>
      <button data-cmd="insertUnorderedList" title="无序列表">• 列表</button>
      <button data-cmd="createLink" title="插入链接">🔗 链接</button>
      <button data-cmd="removeFormat" title="清除格式">清除格式</button>
    </div>
    <input class="ch-title-input" id="chTitle" placeholder="章节标题">
    <div class="editor" id="editor" contenteditable="true" spellcheck="false" placeholder="导入 epub 后点击「✂ 自动分章」即可一键拆分…"></div>
    <div class="hint">导入 epub → 自动分章：开场白→「前言」，之后每轮（用户+AI）为一章。编辑停止输入约 0.9 秒后自动存草稿（localStorage）。正文支持撤销/重做（↩/↪，每章最近 30 步）。</div>
  </section>
</main>

<!-- 分章结果弹窗 -->
<div id="splitResultOverlay">
  <div class="card">
    <h3>✂ 自动分章结果</h3>
    <div id="splitResultList"></div>
    <div class="row"><button class="btn g" id="srCancel">取消</button><button class="btn p" id="srConfirm">确认分章</button></div>
  </div>
</div>

<div class="toast" id="toast"></div>
<div class="dialog" id="dialog"><div class="card"><h3 id="d-title"></h3><p id="d-msg"></p><div class="row"><button class="btn g" id="d-no">取消</button><button class="btn p" id="d-yes">确定</button></div></div></div>

<script>
/* ============ 工具函数 ============ */
const $=(s)=>document.querySelector(s);
const $$=(s)=>document.querySelectorAll(s);
const el=(tag,attrs={},...children)=>{const d=document.createElement(tag);for(const k in attrs){if(k==='className')d.className=attrs[k];else if(k==='innerHTML')d.innerHTML=attrs[k];else d.setAttribute(k,attrs[k]);}children.forEach(c=>{if(typeof c==='string')d.appendChild(document.createTextNode(c));else d.appendChild(c);});return d;};
const uid=()=>'id_'+Math.random().toString(36).slice(2,9);
const LS_KEY='epub_editor_v4_draft';
const toast=(msg)=>{const t=$('#toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2500);};
const showDialog=(title,msg,yesCb)=>{$('#d-title').textContent=title;$('#d-msg').textContent=msg;$('#dialog').classList.add('show');const yes=()=>{$('#dialog').classList.remove('show');yesCb&&yesCb();};$('#d-yes').onclick=yes;$('#d-no').onclick=()=>$('#dialog').classList.remove('show');};
const escapeXml=(s)=>(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const wordCount=(html)=>{const tmp=document.createElement('div');tmp.innerHTML=html||'';return(tmp.textContent||'').trim().length;};
const fmtCount=(n)=>{if(n>=10000)return(Math.round(n/1000)/10).toFixed(1)+'万字';return n+'字';};
const newUuid=()=>'urn:uuid:'+([1e7]+-${1e3}-${4e3}-${8e3}-${1e11}).replace(/[018]/g,c=>(c^Math.random()*16>>c/4).toString(16));

/* ============ 全局状态 ============ */
const state={
  meta:{title:'',author:'',lang:'zh-CN',publisher:'',date:'',description:'',uuid:''},
  cover:null,
  chapters:[],  // {id,title,html,filename}
  toc:[],       // {id,label,chapterId,manual}
  activeId:null,
  _hist:{},      // per-chapter undo/redo
  _importedRawChapters:null, // 导入后的原始章节（用于自动分章）
  dirty:false,
};

/* ============ 历史栈（每章独立，最多30步，防抖合并连续输入/删除） ============ */
const HIST_MAX=30;
function getHist(){if(!state.activeId)return null;state._hist=state._hist||{};let h=state._hist[state.activeId];if(!h){h=state._hist[state.activeId]={undo:[],redo:[],last:'',composing:false};}return h;}
let histTimer=null;
function pushHistoryIfChanged(){const h=getHist();if(!h)return;const cur=$('#editor').innerHTML;if(cur===h.last)return;if(histTimer)clearTimeout(histTimer);histTimer=setTimeout(()=>{const hh=getHist();if(!hh)return;const c=$('#editor').innerHTML;if(c===hh.last)return;hh.undo.push(c);if(hh.undo.length>HIST_MAX)hh.undo.shift();hh.redo=[];hh.last=c;},500);}
function undoStep(){const h=getHist();if(!h||h.undo.length<2){toast('没有可撤销的操作');return;}h.redo.push(h.undo.pop());const prev=h.undo[h.undo.length-1];$('#editor').innerHTML=prev;h.last=prev;syncActiveFromEditor();scheduleSave();}
function redoStep(){const h=getHist();if(!h||h.redo.length===0){toast('没有可重做的操作');return;}const next=h.redo.pop();h.undo.push(next);$('#editor').innerHTML=next;h.last=next;syncActiveFromEditor();scheduleSave();}

/* ============ 草稿（localStorage 同步落盘 + visibilitychange） ============ */
function buildDraftPayload(){const s=JSON.parse(JSON.stringify(state));if(s.cover&&s.cover.data&&s.cover.data.length>1500000){s.cover=null;}return JSON.stringify({state:s,editorTitle:$('#chTitle').value,editorHtml:$('#editor').innerHTML,ts:Date.now()});}
function loadDraft(){try{return localStorage.getItem(LS_KEY);}catch(e){return null;}}
function saveDraft(){try{localStorage.setItem(LS_KEY,buildDraftPayload());return true;}catch(e){try{const s=JSON.parse(JSON.stringify(state));s.cover=null;localStorage.setItem(LS_KEY,JSON.stringify({state:s,editorTitle:$('#chTitle').value,editorHtml:$('#editor').innerHTML}));}catch(e2){}return false;}}
function clearDraft(){try{localStorage.removeItem(LS_KEY);}catch(e){}}
function applyDraft(o){Object.assign(state,o.state);state._hist={};$('#chTitle').value=o.editorTitle||'';$('#editor').innerHTML=o.editorHtml||'';renderMeta();renderChapters();renderToc();state.dirty=true;}
function downloadDraftBackup(){const raw=loadDraft();if(!raw){toast('当前没有可备份的草稿');return;}const blob=new Blob([raw],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);const t=(state.meta&&state.meta.title)||'draft';a.download=t.replace(/[^\w\u4e00-\u9fa5-]+/g,'_')+'_draft.json';document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(a.href);toast('草稿备份已下载（JSON）');}
let saveTimer=null;
function scheduleSave(){clearTimeout(saveTimer);saveTimer=setTimeout(()=>{saveDraft();state.dirty=true;toast('草稿已自动保存');},900);}

/* ============ 渲染 ============ */
function renderChapters(){const box=$('#chList');box.innerHTML='';
  state.chapters.forEach((c,idx)=>{const wc=wordCount(c.html);const d=el('div',{className:'ch-item'+(c.id===state.activeId?' active':'')},el('span',{className:'ch-tt'},c.title||'(无标题)'),el('span',{className:'ch-wc'},fmtCount(wc)));
    const x=el('button',{className:'x',title:'删除章节'},'✕');x.onclick=(ev)=>{ev.stopPropagation();removeChapter(c.id);};
    d.appendChild(x);
    if(idx>0){const m=el('button',{className:'merge-btn',title:'与上一章合并'},'合并');m.onclick=(ev)=>{ev.stopPropagation();mergeWithPrev(c.id);};d.appendChild(m);}
    d.onclick=()=>setActive(c.id);box.appendChild(d);});}
function renderToc(){const box=$('#tocList');box.innerHTML='';
  state.toc.forEach(t=>{const d=el('div',{className:'toc-item'},el('span',{},t.label||'(未命名)'));
    const lab=el('input',{value:t.label||'',placeholder:'目录标题'});lab.style.flex='1';lab.oninput=(e)=>{t.label=e.target.value;t.manual=true;scheduleSave();};
    const sel=el('select',{});sel.appendChild(el('option',{value:''},'(不绑定)'));state.chapters.forEach(c=>sel.appendChild(el('option',{value:c.id},c.title||'(无标题)')));sel.value=t.chapterId||'';sel.onchange=(e)=>{t.chapterId=e.target.value||null;t.manual=true;scheduleSave();};
    const x=el('button',{className:'x',title:'删除'},'✕');x.onclick=()=>{state.toc=state.toc.filter(i=>i.id!==t.id);renderToc();scheduleSave();};
    d.appendChild(lab);d.appendChild(sel);d.appendChild(x);box.appendChild(d);});}
function renderMeta(){$('#m-title').value=state.meta.title;$('#m-author').value=state.meta.author;$('#m-lang').value=state.meta.lang;$('#m-pub').value=state.meta.publisher;$('#m-date').value=state.meta.date;$('#m-desc').value=state.meta.description;
  const img=$('#coverImg');if(state.cover){img.src=state.cover.data;img.style.display='';}else img.style.display='none';}
function setActive(id){const c=state.chapters.find(x=>x.id===id);if(!c)return;state.activeId=id;$('#chTitle').value=c.title;$('#editor').innerHTML=c.html||'';renderChapters();syncEditorToChapter(false);}
function syncEditorToChapter(save){if(!state.activeId)return;const c=state.chapters.find(x=>x.id===state.activeId);if(!c)return;const newTitle=$('#chTitle').value.trim()||'(无标题)';const titleChanged=c.title!==newTitle;c.title=newTitle;c.html=$('#editor').innerHTML;if(titleChanged){state.toc.forEach(t=>{if(t.chapterId===c.id&&!t.manual){t.label=c.title;}});renderToc();}if(save)scheduleSave();}
function syncActiveFromEditor(){syncEditorToChapter(false);}
function removeChapter(id){if(state.chapters.length<=1){toast('至少保留一个章节');return;}
  showDialog('删除章节','确定删除该章节吗？相关目录项会一并解除绑定。',()=>{state.chapters=state.chapters.filter(c=>c.id!==id);state.toc.forEach(t=>{if(t.chapterId===id){t.chapterId=null;}});if(state.activeId===id)setActive(state.chapters[0].id);renderChapters();renderToc();scheduleSave();});}

/* ============ 章节 / 目录管理 ============ */
function nextChapterOrdinal(){let n=0;state.chapters.forEach(c=>{const m=(c.title||'').match(/第\s*(\d+)\s*章/);if(m){const v=parseInt(m[1],10);if(v>n)n=v;}});return n+1;}
function addChapter(opts={}){const ord=nextChapterOrdinal();const defTitle=opts.title||`第 ${ord} 章`;const c={id:uid(),title:defTitle,html:opts.html||'<p>在此输入正文…</p>',filename:opts.filename||`ch_${state.chapters.length+1}.xhtml`};state.chapters.push(c);if(opts.addToc!==false)state.toc.push({id:uid(),label:c.title,chapterId:c.id,manual:false});setActive(c.id);renderChapters();renderToc();scheduleSave();return c;}
function addTocItem(){state.toc.push({id:uid(),label:'新目录项',chapterId:state.chapters[0]?state.chapters[0].id:null,manual:true});renderToc();scheduleSave();}

/* ============ 合并章节 ============ */
function mergeWithPrev(id){const idx=state.chapters.findIndex(x=>x.id===id);if(idx<=0){toast('已经是第一章，无法向前合并');return;}const cur=state.chapters[idx],prev=state.chapters[idx-1];prev.html=(prev.html||'<p></p>')+(cur.html||'<p></p>');state.chapters.splice(idx,1);state.toc.forEach(t=>{if(t.chapterId===cur.id)t.chapterId=prev.id;});if(state.activeId===cur.id)setActive(prev.id);renderChapters();renderToc();scheduleSave();pushHistoryIfChanged();toast('已与上一章合并');}

/* ============ 元数据绑定 ============ */
['m-title','m-author','m-lang','m-pub','m-date','m-desc'].forEach(id=>{$('#'+id).addEventListener('input',(e)=>{const k=id.slice(2);state.meta[k]=e.target.value;if(k==='title')syncChapterTitleFromMeta();scheduleSave();});});
function syncChapterTitleFromMeta(){if(!state.activeId)return;const c=state.chapters.find(x=>x.id===state.activeId);if(!c)return;if(!c.title||c.title==='未命名书籍'||/^第 \d+ 章$/.test(c.title)){c.title=state.meta.title||c.title;$('#chTitle').value=c.title;}}
$('#coverPick').addEventListener('click',()=>$('#coverInput').click());
$('#coverInput').addEventListener('change',(e)=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{state.cover={data:r.result,name:f.name};renderMeta();scheduleSave();};r.readAsDataURL(f);});

/* ============ 编辑器 ============ */
$('#editor').addEventListener('input',()=>{syncActiveFromEditor();pushHistoryIfChanged();scheduleSave();});
$('#chTitle').addEventListener('input',()=>{syncActiveFromEditor();pushHistoryIfChanged();scheduleSave();});
$$('.toolbar button[data-cmd]').forEach(b=>b.addEventListener('click',()=>{const cmd=b.dataset.cmd,val=b.dataset.val;if(cmd==='createLink'){const u=prompt('请输入链接地址（含 http(s)://）','https://');if(u)document.execCommand(cmd,false,u);}else if(cmd==='formatBlock')document.execCommand(cmd,false,val);else document.execCommand(cmd,false,null);$('#editor').focus();pushHistoryIfChanged();}));

/* ============ 撤销/重做按钮 ============ */
$('#undoBtn').addEventListener('click',undoStep);
$('#redoBtn').addEventListener('click',redoStep);

/* ============ 标签 / 侧栏 ============ */
$$('.tab').forEach(t=>t.addEventListener('click',()=>{$$('.tab').forEach(x=>x.classList.remove('on'));t.classList.add('on');const k=t.dataset.tab;$('#panel-ch').style.display=k==='ch'?'':'none';$('#panel-toc').style.display=k==='toc'?'':'none';$('#panel-meta').style.display=k==='meta'?'':'none';}));
$('#addCh').addEventListener('click',()=>addChapter({}));
$('#addToc').addEventListener('click',addTocItem);
$('#menuBtn').addEventListener('click',()=>{$('#aside').classList.toggle('open');$('#scrim').classList.toggle('show');});
$('#scrim').addEventListener('click',()=>{$('#aside').classList.remove('open');$('#scrim').classList.remove('show');});

/* ============ 全局错误兜底 ============ */
window.addEventListener('error',(e)=>{console.error(e.error||e.message);toast('发生错误：'+(e.message||'未知'));});

/* ============ 导入 EPUB ============ */
$('#importBtn').addEventListener('click',()=>$('#fileInput').click());
$('#fileInput').addEventListener('change',async(e)=>{const f=e.target.files[0];if(!f)return;try{const buf=await f.arrayBuffer();const zip=await JSZip.loadAsync(buf);const opfPath=await findOpfPath(zip);if(!opfPath){toast('未找到 OPF 文件，文件可能非标准 EPUB');return;}const opfDir=opfPath.split('/').slice(0,-1).join('/');const opfXml=await zip.file(opfPath).async('string');const opfDoc=new DOMParser().parseFromString(opfXml,'application/xml');const manifest={};opfDoc.querySelectorAll('manifest > item').forEach(it=>{manifest[it.getAttribute('id')]={href:it.getAttribute('href'),media:it.getAttribute('media-type'),id:it.getAttribute('id')};});const spineIds=[...opfDoc.querySelectorAll('spine > itemref')].map(r=>r.getAttribute('idref'));
    state.chapters=[];state.toc=[];state._hist={};state.meta={title:'',author:'',lang:'zh-CN',publisher:'',date:'',description:'',uuid:''};
    const mTitle=opfDoc.querySelector('metadata > title');if(mTitle)state.meta.title=mTitle.textContent.trim();const mCreator=opfDoc.querySelector('metadata > creator');if(mCreator)state.meta.author=mCreator.textContent.trim();const mLang=opfDoc.querySelector('metadata > language');if(mLang)state.meta.lang=mLang.textContent.trim();const mPub=opfDoc.querySelector('metadata > publisher');if(mPub)state.meta.publisher=mPub.textContent.trim();const mDate=opfDoc.querySelector('metadata > date');if(mDate)state.meta.date=mDate.textContent.trim();const mDesc=opfDoc.querySelector('metadata > description');if(mDesc)state.meta.description=mDesc.textContent.trim();const mId=opfDoc.querySelector('metadata > identifier');if(mId)state.meta.uuid=mId.textContent.trim();if(!state.meta.uuid)state.meta.uuid=newUuid();
    const rawChapters=[];
    for(let i=0;i<spineIds.length;i++){const man=manifest[spineIds[i]];if(!man)continue;const href=opfDir?opfDir+'/'+man.href:man.href;const xhtml=await zip.file(href).async('string');const body=xhtml.match(/<body[^>]*>([\s\S]*?)<\/body>/i);const html=body?body[1]:xhtml;const title=extractTitle(html)||`第 ${i+1} 章`;rawChapters.push({title,html,filename:man.href.split('/').pop()});}
    if(rawChapters.length===0)rawChapters.push({title:'第一章',html:'<p>在此开始写作…</p>',filename:'ch_1.xhtml'});
    state._importedRawChapters=rawChapters;
    // 先把原始章节加载到 state（用户可以选择自动分章或手动编辑）
    state.chapters=rawChapters.map(c=>({id:uid(),title:c.title,html:c.html,filename:c.filename}));
    const ncx=Object.values(manifest).find(m=>m.media==='application/x-dtbncx+xml');if(ncx){const ncxPath=opfDir?opfDir+'/'+ncx.href:ncx.href;const ncxXml=await zip.file(ncxPath).async('string');const ncxDoc=new DOMParser().parseFromString(ncxXml,'application/xml');const navPoints=[...ncxDoc.querySelectorAll('navPoint')].map(n=>{const lab=n.querySelector('navLabel > text');const cnt=n.querySelector('content');return{label:lab?lab.textContent.trim():'(未命名)',src:cnt?cnt.getAttribute('src'):null};});state.toc=[];navPoints.forEach(n=>{const ch=state.chapters.find(c=>n.src&&(n.src.endsWith(c.filename)||c.filename.endsWith(n.src.split('#')[0])));state.toc.push({id:uid(),label:n.label,chapterId:ch?ch.id:null,manual:false});});}
    if(state.toc.length===0)state.chapters.forEach(c=>state.toc.push({id:uid(),label:c.title,chapterId:c.id,manual:false}));
    const coverItem=Object.values(manifest).find(m=>m.id==='cover'||m.properties==='cover-image'||/cover/i.test(m.href));if(coverItem){const cpath=opfDir?opfDir+'/'+coverItem.href:coverItem.href;const cfile=zip.file(cpath);if(cfile){const b64=await cfile.async('base64');const mime=coverItem.media||'image/jpeg';state.cover={data:'data:'+mime+';base64,'+b64,name:coverItem.href.split('/').pop()};}}
    setActive(state.chapters[0].id);renderMeta();renderToc();scheduleSave();toast('导入成功！点击「✂ 自动分章」可一键按轮次拆分');}catch(err){console.error(err);toast('导入失败：'+(err.message||err));}});
async function findOpfPath(zip){const cxml=zip.file('META-INF/container.xml');if(!cxml)return null;const txt=await cxml.async('string');const m=txt.match(/full-path="([^"]+)"/);return m?m[1]:null;}
function extractTitle(html){const m=html.match(/<h[1-3][^>]*>([\s\S]*?)<\/h[1-3]>/i);return m?m[1].replace(/<[^>]+>/g,'').trim():null;}

/* ============ 核心：自动分章（开场白→前言，之后按 me/ta 轮次分章） ============ */
function autoSplitChapters(){
  if(!state._importedRawChapters||state._importedRawChapters.length===0){toast('请先导入 EPUB 文件');return null;}
  // 把所有原始章节的 HTML 合并为一个大文档来分析
  const allHtml=state._importedRawChapters.map(c=>c.html).join('\n');
  const tmp=document.createElement('div');tmp.innerHTML=allHtml;
  // 找到所有 me / ta 的 div（按文档顺序）
  const turns=[]; // {type:'me'|'ta', el:HTMLElement}
  tmp.querySelectorAll('div.me, div.ta').forEach(div=>{
    const cls=div.className||'';
    if(cls.includes('me'))turns.push({type:'me',el:div});
    else if(cls.includes('ta'))turns.push({type:'ta',el:div});
  });
  if(turns.length===0){toast('未检测到 class="me" 或 class="ta" 的对话块，无法自动分章');return null;}
  // 找到第一个 me/ta 的位置 → 分界点
  const firstTurnEl=turns[0].el;
  // 开场白 = firstTurnEl 之前的所有内容
  let prologueHtml='';
  const tmp2=document.createElement('div');tmp2.innerHTML=allHtml;
  for(const child of[...tmp2.children]){if(child===firstTurnEl||child.isSameNode?child.isSameNode(firstTurnEl):child===firstTurnEl)break;prologueHtml+=child.outerHTML||'';}
  // 如果 tmp2 的第一个子节点就是 firstTurnEl，prologueHtml 为空
  // 用另一种方式：收集 firstTurnEl 之前的所有兄弟节点
  prologueHtml='';
  let node=tmp.firstChild;
  while(node){if(node===firstTurnEl||(node.nodeType===1&&node.isSameNode&&node.isSameNode(firstTurnEl)))break;if(node.nodeType===1)prologueHtml+=node.outerHTML;else if(node.nodeType===3&&node.textContent.trim())prologueHtml+=node.textContent;node=node.nextSibling;}
  // 按轮次分组：每轮 = 一个 me 开始到下一个 me 之前（包含中间的 ta）
  const roundSlices=[]; // [{html:string}]
  let currentRound=null;
  turns.forEach((t,ti)=>{
    if(t.type==='me'){
      if(currentRound!==null)roundSlices.push(currentRound);
      currentRound={html:''};
      // 收集从当前 me 到下一个 me 之前的所有节点
      let n=t.el;
      while(n){
        if(ti<turns.length-1){const nextEl=turns[ti+1].el;if(n===nextEl)break;}
        if(n.nodeType===1)currentRound.html+=n.outerHTML;
        else if(n.nodeType===3&&n.textContent.trim())currentRound.html+=n.textContent;
        n=n.nextSibling;
      }
    }
    // ta 节点被包含在当前 round 中（已经在上面的收集中通过 nextSibling 遍历包含了）
  });
  if(currentRound!==null)roundSlices.push(currentRound);
  // 构建新章节列表
  const newChapters=[];
  // 1) 前言章节
  const prologue=(prologueHtml||'').replace(/^\s+|\s+$/g,'');
  newChapters.push({title:'前言',html:prologue||'<p></p>',filename:'ch_prologue.xhtml'});
  // 2) 按轮次分章
  roundSlices.forEach((slice,si)=>{
    const html=(slice.html||'').replace(/^\s+|\s+$/g,'');
    if(!html.replace(/<[^>]+>/g,'').trim())return; // 跳过空内容
    newChapters.push({title:`第 ${si+1} 章`,html:html||'<p></p>',filename:`ch_${si+1}.xhtml`});
  });
  return newChapters;
}

$('#autoSplitBtn').addEventListener('click',()=>{
  if(!state._importedRawChapters||state._importedRawChapters.length===0){toast('请先导入 EPUB 文件');return;}
  const newChapters=autoSplitChapters();
  if(!newChapters)return;
  // 显示分章预览
  const overlay=$('#splitResultOverlay');const list=$('#splitResultList');list.innerHTML='';
  newChapters.forEach((c,ci)=>{const wc=wordCount(c.html);const row=el('div',{className:'sr-row'},el('span',{className:'sr-num'},String(ci+1)),el('span',{className:'sr-title'},c.title),el('span',{className:'sr-wc'},fmtCount(wc)));list.appendChild(row);});
  overlay.classList.add('show');
  $('#srCancel').onclick=()=>overlay.classList.remove('show');
  $('#srConfirm').onclick=()=>{
    state.chapters=newChapters.map(c=>({id:uid(),title:c.title,html:c.html,filename:c.filename}));
    state.toc=state.chapters.map(c=>({id:uid(),label:c.title,chapterId:c.id,manual:false}));
    state._hist={};setActive(state.chapters[0].id);renderChapters();renderToc();scheduleSave();overlay.classList.remove('show');
    toast(`已自动拆分为 ${state.chapters.length} 章（前言 + ${state.chapters.length-1} 轮次章节）`);
  };
});

/* ============ 导出 EPUB ============ */
$('#exportBtn').addEventListener('click',async()=>{try{syncActiveFromEditor();const zip=new JSZip();
    zip.file('mimetype','application/epub+zip',{compression:'STORE'});
    zip.folder('META-INF').file('container.xml','<?xml version="1.0" encoding="UTF-8"?><container version="1.0" xmlns="urn:oasis:names:tc:opendocument:xmlns:container"><rootfiles><rootfile full-path="OEBPS/content.opf" media-type="application/oebps-package+xml"/></rootfiles></container>');
    const oebps=zip.folder('OEBPS');const manifestItems=[],spineItems=[];let coverXhtml='';
    state.chapters.forEach((c,i)=>{const fname=c.filename||`ch_${i+1}.xhtml`;const safe=fname.endsWith('.xhtml')?fname:(fname+'.xhtml');const id=`ch${i+1}`;manifestItems.push(`<item id="${id}" href="${safe}" media-type="application/xhtml+xml"/>`);spineItems.push(`<itemref idref="${id}"/>`);let body=c.html||'';if(!/<(p|div|h[1-6])/i.test(body))body='<p>'+body+'</p>';oebps.file(safe,`<?xml version="1.0" encoding="UTF-8"?><!DOCTYPE html><html xmlns="http://www.w3.org/1999/xhtml" xmlns:epub="http://www.idpf.org/2007/ops"><head><title>${escapeXml(c.title)}</title><meta charset="utf-8"/><style>body{font-family:sans-serif;line-height:1.7;padding:0 1em}h1,h2{color:#222}.me{color:#1a5a2a}.ta{color:#1a3a5a}</style></head><body><h1>${escapeXml(c.title)}</h1>${body}</body></html>`);});
    if(state.cover){const m=state.cover.data.match(/^data:(image\/[a-z]+);base64,(.*)$/);if(m){const ext=m[1]==='image/png'?'png':'jpg';oebps.file('cover.'+ext,state.cover.data,'base64');manifestItems.unshift(`<item id="cover" href="cover.${ext}" media-type="${m[1]}" properties="cover-image"/>`);coverXhtml=`<meta name="cover" content="cover"/>`;}}
    const navPoints=state.toc.map((t,i)=>{const ch=state.chapters.find(c=>c.id===t.chapterId);const href=ch?encodeURI(ch.filename||'ch_1.xhtml'):'ch_1.xhtml';return`<navPoint id="nav${i+1}" playOrder="${i+1}"><navLabel><text>${escapeXml(t.label)}</text></navLabel><content src="${href}"/></navPoint>`;}).join('');
    const uuid=state.meta.uuid||newUuid();oebps.file('toc.ncx',`<?xml version="1.0" encoding="UTF-8"?><ncx xmlns="http://www.daisy.org/z3986/2005/ncx/" version="2005-1"><head><meta name="dtb:uid" content="${escapeXml(uuid)}"/><meta name="dtb:depth" content="1"/><meta name="dtb:totalPageCount" content="0"/><meta name="dtb:maxPageNumber" content="0"/></head><docTitle><text>${escapeXml(state.meta.title||'未命名书籍')}</text></docTitle><navMap>${navPoints||'<navPoint id="nav1"><navLabel><text>开始</text></navLabel><content src="ch_1.xhtml"/></navPoint>'}</navMap></ncx>`);
    manifestItems.push(`<item id="ncx" href="toc.ncx" media-type="application/x-dtbncx+xml"/>`);
    const opf=`<?xml version="1.0" encoding="UTF-8"?><package xmlns="http://www.idpf.org/2007/opf" version="3.0" unique-identifier="bookid"><metadata xmlns:dc="http://purl.org/dc/elements/1.1/"><dc:identifier id="bookid">${escapeXml(uuid)}</dc:identifier><dc:title>${escapeXml(state.meta.title||'未命名书籍')}</dc:title>${state.meta.author?`<dc:creator>${escapeXml(state.meta.author)}</dc:creator>`:''}${state.meta.lang?`<dc:language>${escapeXml(state.meta.lang)}</dc:language>`:''}${state.meta.publisher?`<dc:publisher>${escapeXml(state.meta.publisher)}</dc:publisher>`:''}${state.meta.date?`<dc:date>${escapeXml(state.meta.date)}</dc:date>`:''}${state.meta.description?`<dc:description>${escapeXml(state.meta.description)}</dc:description>`:''}${coverXhtml}</metadata><manifest>${manifestItems.join('')}</manifest><spine toc="ncx">${spineItems.join('')}</spine></package>`;
    oebps.file('content.opf',opf);const blob=await zip.generateAsync({type:'blob',compression:'DEFLATE',compressionOptions:{level:6},mimeType:'application/epub+zip'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);const safeName=(state.meta.title||'未命名书籍').replace(/[\\/:*?"<>|\r\n]+/g,'_').replace(/\s+/g,'_');a.download=safeName+'.epub';document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(a.href);toast('导出成功');await clearDraft();state.dirty=false;}catch(err){console.error(err);toast('导出失败：'+(err.message||err));}});

/* ============ 新建 / 恢复 ============ */
$('#newBtn').addEventListener('click',()=>{showDialog('新建书籍','将清空当前内容并新建一本空白书，确定吗？',()=>{state.meta={title:'未命名书籍',author:'',lang:'zh-CN',publisher:'',date:'',description:'',uuid:newUuid()};state.cover=null;state.chapters=[];state.toc=[];state._hist={};state._importedRawChapters=null;addChapter({title:'第一章',html:'<p>在此开始写作…</p>'});renderMeta();});});
$('#recoverYes').addEventListener('click',()=>{const d=loadDraft();if(!d)return;$('#recoverBar').classList.remove('show');try{const o=JSON.parse(d);applyDraft(o);toast(state.cover?'草稿已恢复':'草稿已恢复（封面过大未保留，可重新选择）');}catch(e){toast('恢复失败');}});
$('#recoverNo').addEventListener('click',async()=>{$('#recoverBar').classList.remove('show');await clearDraft();state.dirty=false;});
$('#saveDraftBtn').addEventListener('click',()=>{const ok=saveDraft();toast(ok?'草稿已手动保存 ✅':'保存失败（可能封面过大，已自动丢弃封面）');});
$('#backupDraftBtn').addEventListener('click',downloadDraftBackup);

/* ============ 启动 ============ */
(async function init(){if(typeof JSZip!=='function'){toast('JSZip 库加载失败，导入/导出将不可用');console.error('JSZip is not defined');}
  addChapter({title:'第一章',html:'<p>欢迎使用 EPUB 分章工具 V4（AI 聊天存档专用）。</p><p>操作步骤：</p><p>1. 点击「📂 导入」选择你的 epub 文件</p><p>2. 点击「✂ 自动分章」一键按轮次拆分（开场白→前言，之后每轮用户+AI 为一章）</p><p>3. 在左侧章节列表查看/编辑各章，可合并误拆的章节</p><p>4. 点击「📥 导出」下载分章后的 epub</p>',addToc:false});renderMeta();
  const d=loadDraft();if(d){try{const o=JSON.parse(d);applyDraft(o);$('#recoverBar').querySelector('span').textContent='已自动恢复上次未导出的草稿（正文/目录/元数据）。';$('#recoverBar').classList.add('show');toast(o.state&&o.state.cover?'草稿已自动恢复':'草稿已自动恢复（封面过大未保留，可重新选择）');}catch(e){console.error(e);}}})();
</script>
