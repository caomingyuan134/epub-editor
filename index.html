<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>EPUB 分章工具 V5</title>
<script src="jszip.min.js"></script>
<style>
  :root{--blue:#2f6feb;--blue-d:#1f55c4;--ink:#1a1a1a;--sub:#6b7280;--line:#e5e7eb;--bg:#f3f4f6;--card:#fff}
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--ink);font-size:15px;padding-top:108px;padding-bottom:24px}
  /* 顶部固定工具栏 */
  #topbar{position:fixed;top:0;left:0;right:0;z-index:60;background:var(--blue);color:#fff;display:flex;flex-wrap:wrap;gap:6px;padding:8px 10px;box-shadow:0 2px 6px rgba(0,0,0,.15);align-items:center}
  #burger{background:rgba(255,255,255,.16);color:#fff;border:0;border-radius:7px;padding:7px 11px;font-size:16px;cursor:pointer;margin-right:4px}
  #burger:active{background:rgba(255,255,255,.32)}
  #topbar .tbtn{background:rgba(255,255,255,.16);color:#fff;border:0;border-radius:7px;padding:7px 11px;font-size:13px;cursor:pointer;white-space:nowrap}
  #topbar .tbtn:active{background:rgba(255,255,255,.32)}
  #topbar .spacer{flex:1}
  /* 富文本格式工具栏（固定置于顶部工具栏下方） */
  #formbar{position:fixed;top:48px;left:0;right:0;z-index:59;background:#fff;border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;gap:4px;padding:6px 8px;overflow-x:auto}
  #formbar button{font-size:13px;padding:5px 9px;border:1px solid var(--line);background:#fff;border-radius:6px;cursor:pointer}
  #formbar button:active{background:#eef3ff}
  /* 抽屉式侧栏 */
  #scrim{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:70;display:none}
  #scrim.show{display:block}
  #sidebar{position:fixed;top:0;bottom:0;left:0;width:300px;max-width:88vw;background:var(--card);border-right:1px solid var(--line);z-index:71;transform:translateX(-100%);transition:transform .25s ease;overflow-y:auto;padding:12px}
  #sidebar.open{transform:translateX(0)}
  #closeSide{position:sticky;top:0;background:var(--card);display:flex;justify-content:flex-end;padding-bottom:6px;border-bottom:1px solid var(--line);margin-bottom:6px}
  #closeSide button{background:0;border:0;font-size:20px;color:var(--sub);cursor:pointer}
  #main{display:flex;gap:0}
  #content{flex:1;padding:12px;min-width:0}
  .sec-title{font-weight:700;font-size:14px;color:var(--sub);margin:6px 2px 8px}
  .ch-item{display:flex;align-items:center;gap:6px;padding:6px 8px;border-radius:7px;cursor:pointer;font-size:14px;border:1px solid transparent}
  .ch-item:hover{background:#eef3ff}
  .ch-item.active{background:#e3ecff;border-color:#c7d8ff;font-weight:700}
  .ch-item .ch-title{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .ch-item .cnt{color:var(--sub);font-size:11px;white-space:nowrap}
  .ch-item .merge{font-size:11px;padding:2px 6px;border:1px solid var(--line);border-radius:5px;background:#fff;cursor:pointer;color:var(--blue)}
  .ch-item .del{font-size:13px;color:#d33;background:0;border:0;cursor:pointer;padding:0 4px}
  .add-btn{width:100%;margin-top:8px;padding:8px;border:1px dashed var(--blue);background:#f6f9ff;color:var(--blue);border-radius:8px;cursor:pointer;font-size:13px}
  .add-btn:active{background:#e3ecff}
  .tabs{display:flex;gap:0;border-bottom:2px solid var(--line);margin-bottom:10px}
  .tab{padding:8px 12px;cursor:pointer;font-size:14px;color:var(--sub);border-bottom:2px solid transparent;margin-bottom:-2px}
  .tab.active{color:var(--blue);border-bottom-color:var(--blue);font-weight:700}
  .panel{display:none}
  .panel.active{display:block}
  .meta-row{display:flex;align-items:center;gap:8px;margin:6px 0}
  .meta-row label{width:60px;color:var(--sub);font-size:13px}
  .meta-row input{flex:1;padding:6px 8px;border:1px solid var(--line);border-radius:6px;font-size:14px}
  .toc-item{display:flex;align-items:center;gap:6px;padding:5px 4px;border-bottom:1px dashed var(--line);font-size:13px}
  .toc-item input{flex:1;padding:5px 7px;border:1px solid var(--line);border-radius:5px;font-size:13px}
  .toc-item select{padding:5px;border:1px solid var(--line);border-radius:5px;font-size:12px}
  .toc-item .tdel{color:#d33;background:0;border:0;cursor:pointer;font-size:14px}
  .editor{border:1px solid var(--line);border-radius:9px;background:#fff;padding:12px;min-height:55vh;outline:0;line-height:1.8;word-break:break-word;scroll-margin-top:120px}
  .editor:focus{box-shadow:0 0 0 2px #c7d8ff}
  /* 可视化 me/ta 容器（仅新建章节使用，导出时转回标准 div.me/ta） */
  .me-box{background:#eef7ee;border:1px solid #cfe6cf;border-radius:8px;padding:8px 10px;margin:8px 0}
  .me-box .lbl{font-size:12px;color:#2e7d32;font-weight:700;margin-bottom:4px}
  .ta-box{background:#eef2ff;border:1px solid #d4dcf5;border-radius:8px;padding:8px 10px;margin:8px 0}
  .ta-box .lbl{font-size:12px;color:#2f6feb;font-weight:700;margin-bottom:4px}
  .me-edit,.ta-edit{min-height:40px;outline:0;white-space:pre-wrap}
  #toast{position:fixed;left:50%;bottom:34px;transform:translateX(-50%);background:rgba(20,20,20,.88);color:#fff;padding:9px 16px;border-radius:8px;font-size:13px;z-index:200;display:none;max-width:90vw;text-align:center}
  #toast.show{display:block}
  .stat{font-size:12px;color:var(--sub);margin:4px 2px 8px}
  .help{font-size:12px;color:var(--sub);line-height:1.6;background:#f6f9ff;border:1px solid #e3ecff;border-radius:8px;padding:8px 10px;margin-top:8px}
  @media(max-width:760px){
    #content{padding:10px}
  }
</style>
</head>
<body>

<div id="topbar">
  <button id="burger" title="打开章节面板">☰</button>
  <button class="tbtn" id="btnImport">📂 导入</button>
  <input type="file" id="fileInput" accept=".epub,application/epub+zip" style="display:none">
  <button class="tbtn" id="btnSave">💾 保存</button>
  <button class="tbtn" id="btnBackup">📦 备份</button>
  <button class="tbtn" id="btnExport">⬇️ 导出</button>
  <button class="tbtn" id="btnNew">🆕 新建</button>
  <span class="spacer"></span>
  <span class="tbtn" id="draftHint" style="background:transparent;font-size:11px;opacity:.85"></span>
</div>

<div id="formbar">
  <button title="撤销" id="fbUndo">↩ 撤销</button>
  <button title="重做" id="fbRedo">↪ 重做</button>
  <button title="加粗" id="fbBold"><b>B</b></button>
  <button title="斜体" id="fbItalic"><i>I</i></button>
  <button title="下划线" id="fbUnder"><u>U</u></button>
  <button title="删除线" id="fbStrike"><s>S</s></button>
  <button title="H2" id="fbH2">H2</button>
  <button title="H3" id="fbH3">H3</button>
  <button title="无序列表" id="fbUl">• 列表</button>
  <button title="链接" id="fbLink">🔗</button>
  <button title="清除格式" id="fbClear">清除格式</button>
</div>

<div id="scrim"></div>
<div id="sidebar">
  <div id="closeSide"><button id="btnCloseSide" title="关闭面板">✕</button></div>
  <div class="tabs">
    <div class="tab active" data-tab="ch">章节</div>
    <div class="tab" data-tab="toc">目录</div>
    <div class="tab" data-tab="meta">元数据</div>
  </div>
  <div class="panel active" id="pCh">
    <div class="sec-title">章节列表</div>
    <div id="chList"></div>
    <div class="stat" id="chStat"></div>
    <button class="add-btn" id="btnAddCh">＋ 新增章节</button>
    <div class="help">
      • 导入后自动按 me/ta 轮次分章（封面/目录/前言＋第N章）<br>
      • 新建章节含【我】【他】两个编辑区，导出自动包裹 me/ta 代码<br>
      • 合并章节后自动重新排序、目录同步更新
    </div>
  </div>
  <div class="panel" id="pToc">
    <div class="sec-title">目录（可手动改名，改名后标记 ✎）</div>
    <div id="tocList"></div>
    <div class="help">合并/排序后目录自动重建；手动改过的标题以 " ✎" 标记。</div>
  </div>
  <div class="panel" id="pMeta">
    <div class="sec-title">书籍元数据</div>
    <div class="meta-row"><label>书名</label><input id="metaTitle" placeholder="留空则导出用「未命名」"></div>
    <div class="meta-row"><label>作者</label><input id="metaAuthor" placeholder="作者"></div>
    <div class="meta-row"><label>导出名</label><input id="metaExport" placeholder="导出文件名（不含.epub）"></div>
  </div>
</div>

<div id="content">
  <div class="stat" id="curChInfo">尚未导入文件</div>
  <div id="editor" class="editor" contenteditable="true" spellcheck="false"></div>
</div>

<div id="toast"></div>

<script>
/* ============ 工具函数 ============ */
const $=(s)=>document.querySelector(s);
const $$=(s)=>document.querySelectorAll(s);
function toast(msg,ms=2400){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(toast._h);toast._h=setTimeout(()=>t.classList.remove('show'),ms)}
function safeName(s){return (s||'').replace(/[\/\\:*?"<>|]+/g,'_').replace(/\s+/g,'_').slice(0,80)||'未命名'}
function fmtCount(n){n=+n||0;if(n>=10000)return (n/10000).toFixed(1).replace(/\.0$/,'')+'万字';return n+'字'}
function el(tag,cls,html){const e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;return e}
function isMeTa(node){if(!node||node.nodeType!==1)return false;const cls=(' '+(node.className||'')+' ').replace(/\s+/g,' ');return cls.includes(' me ')||cls.includes(' ta ')}
function nodeTextLen(n){return (n.textContent||'').trim().length}

/* ============ 全局状态 ============ */
const DRAFT_KEY='epubToolV5_draft';
const META_KEY='epubToolV5_meta';
const HIST_MAX=30;
const state={
  chapters:[],   // {id,title,html,manual,order}
  toc:[],        // {id,label,chapterId,manual}
  meta:{title:'',author:'',exportName:''},
  curId:null,
  hist:{stack:[],idx:-1,timer:null},
  _importing:false // 导入分章过程中禁止保存草稿
};

/* ============ 启动 ============ */
window.addEventListener('DOMContentLoaded',()=>{
  if(typeof JSZip!=='function'){toast('JSZip 库加载失败，导入/导出将不可用',6000);console.error('JSZip not defined');}
  loadMeta();
  bindDrawer();
  bindTabs();
  bindTopbar();
  bindFormbar();
  bindEditor();
  tryRestoreDraft();
});

/* ============ 抽屉式侧栏（三道杠触发） ============ */
function bindDrawer(){
  const side=$('#sidebar'),scrim=$('#scrim');
  const open=()=>{side.classList.add('open');scrim.classList.add('show')};
  const close=()=>{side.classList.remove('open');scrim.classList.remove('show')};
  $('#burger').onclick=open;
  $('#btnCloseSide').onclick=close;
  scrim.onclick=close;
}

/* ============ 标签页 ============ */
function bindTabs(){
  $$('.tab').forEach(t=>t.onclick=()=>{
    $$('.tab').forEach(x=>x.classList.remove('active'));
    $$('.panel').forEach(x=>x.classList.remove('active'));
    t.classList.add('active');
    $('#p'+t.dataset.tab.replace(/^./,c=>c.toUpperCase())).classList.add('active');
    if(t.dataset.tab==='toc')renderToc();
  });
}

/* ============ 顶部栏 ============ */
function bindTopbar(){
  $('#btnImport').onclick=()=>$('#fileInput').click();
  $('#fileInput').onchange=e=>{const f=e.target.files[0];if(f)importEpub(f);e.target.value=''};
  $('#btnSave').onclick=()=>{saveDraft(true);toast('已保存草稿')};
  $('#btnBackup').onclick=()=>{saveDraft(true);const b=JSON.stringify({chapters:state.chapters,toc:state.toc,meta:state.meta},null,0);const u=URL.createObjectURL(new Blob([b],{type:'application/json'}));const a=document.createElement('a');a.href=u;a.download=safeName(state.meta.title||'草稿')+'_backup.json';a.click();URL.revokeObjectURL(u);toast('已备份草稿')};
  $('#btnExport').onclick=()=>exportEpub();
  $('#btnNew').onclick=()=>addNewChapter();
  $('#btnAddCh').onclick=()=>addNewChapter();
  $('#metaTitle').oninput=e=>{state.meta.title=e.target.value;saveMeta();};
  $('#metaAuthor').oninput=e=>{state.meta.author=e.target.value;saveMeta();};
  $('#metaExport').oninput=e=>{state.meta.exportName=e.target.value;saveMeta();};
}

/* ============ 富文本工具栏 ============ */
function bindFormbar(){
  const cmd=(n,p=null)=>()=>{document.execCommand(n,false,p);$('#editor').focus();pushHistory(true)};
  $('#fbUndo').onclick=()=>undo();
  $('#fbRedo').onclick=()=>redo();
  $('#fbBold').onclick=cmd('bold');$('#fbItalic').onclick=cmd('italic');$('#fbUnder').onclick=cmd('underline');$('#fbStrike').onclick=cmd('strikeThrough');
  $('#fbH2').onclick=cmd('formatBlock','H2');$('#fbH3').onclick=cmd('formatBlock','H3');
  $('#fbUl').onclick=cmd('insertUnorderedList');
  $('#fbLink').onclick=()=>{const u=prompt('链接地址');if(u)cmd('createLink',u)()};
  $('#fbClear').onclick=cmd('removeFormat');
}

/* ============ 编辑器 ============ */
function bindEditor(){
  const ed=$('#editor');
  ed.addEventListener('input',()=>{
    const c=currentCh();if(!c)return;
    c.html=ed.innerHTML;
    if(state.hist.timer)clearTimeout(state.hist.timer);
    state.hist.timer=setTimeout(()=>pushHistory(false),500);
    scheduleDraftSave();
    renderChList();
  });
}

/* ============ 历史（撤销/重做，仅正文） ============ */
function pushHistory(force){
  const c=currentCh();if(!c)return;
  if(state.hist.timer){clearTimeout(state.hist.timer);state.hist.timer=null}
  const snap=c.html;
  const h=state.hist;
  if(h.idx>=0 && h.stack[h.idx]===snap && !force)return;
  h.stack=force? h.stack.slice(0,h.idx+1) : h.stack;
  h.stack.push(snap);
  if(h.stack.length>HIST_MAX)h.stack.shift();
  h.idx=h.stack.length-1;
}
function undo(){const h=state.hist;if(h.idx>0){h.idx--;applySnap(h.stack[h.idx])}}
function redo(){const h=state.hist;if(h.idx<h.stack.length-1){h.idx++;applySnap(h.stack[h.idx])}}
function applySnap(html){const c=currentCh();if(!c)return;c.html=html;$('#editor').innerHTML=html;pushHistory(false)}

/* ============ 章节渲染 ============ */
function renderChList(){
  const box=$('#chList');box.innerHTML='';
  state.chapters.forEach((c)=>{
    const div=el('div','ch-item'+(c.id===state.curId?' active':''));
    const titleSpan=el('span','ch-title');titleSpan.textContent=c.title+(c.manual?' ✎':'');
    const cnt=el('span','cnt');cnt.textContent=fmtCount(chPlainLen(c));
    const mg=el('button','merge');mg.textContent='合并↑';mg.title='合并到上一章';mg.onclick=ev=>{ev.stopPropagation();mergeUp(c.id)};
    const dl=el('button','del');dl.textContent='×';dl.title='删除章节';dl.onclick=ev=>{ev.stopPropagation();deleteChapter(c.id)};
    div.append(titleSpan,cnt,mg,dl);
    div.onclick=()=>selectChapter(c.id);
    box.append(div);
  });
  const tot=state.chapters.reduce((s,c)=>s+chPlainLen(c),0);
  $('#chStat').textContent=`共 ${state.chapters.length} 章 · 总 ${fmtCount(tot)}`;
}
// 统计/导出时把可视化容器标签还原为标准 me/ta 再计纯文本长度
function chPlainLen(c){return nodeTextLen({textContent:stripContainerLabels(c.html)})}
function stripContainerLabels(html){return (html||'').replace(/<div class="me-box">[\s\S]*?<div class="me-edit">/g,'<div class="me">').replace(/<div class="ta-box">[\s\S]*?<div class="ta-edit">/g,'<div class="ta">')}

function currentCh(){return state.chapters.find(c=>c.id===state.curId)}
function selectChapter(id){
  const ed=$('#editor');const cur=currentCh();if(cur)cur.html=ed.innerHTML;
  state.curId=id;renderChList();
  const c=currentCh();if(!c){ed.innerHTML='';$('#curChInfo').textContent='尚未导入文件';return}
  ed.innerHTML=c.html||'';
  pushHistory(true);
  $('#curChInfo').textContent=`当前：${c.title}（${fmtCount(chPlainLen(c))}）`;
  // 切章自动回顶（正文从固定工具栏下方开始）
  try{ed.scrollTo({top:0,behavior:'instant' in ed?'instant':'auto'});}catch(e){}
  window.scrollTo(0,0);
}

/* ============ 新增章节（可视化 me/ta 容器，标准 xhtml 骨架） ============ */
function nextOrdinal(){
  let max=0;state.chapters.forEach(c=>{const m=c.title.match(/第\s*(\d+)\s*章/);if(m)max=Math.max(max,+m[1])});
  return max+1;
}
function newChapterHtml(){
  return `<div class="me-box"><div class="lbl">【我】的发言</div><div class="me-edit" contenteditable="true"></div></div><div class="ta-box"><div class="lbl">【他】的发言</div><div class="ta-edit" contenteditable="true"></div></div>`;
}
function addNewChapter(){
  const ord=nextOrdinal();
  const title=`第 ${ord} 章`;
  const ch={id:'ch_'+Date.now()+'_'+Math.random().toString(36).slice(2,6),title,html:newChapterHtml(),manual:false,order:state.chapters.length+1};
  state.chapters.push(ch);
  state.toc.push({id:'toc_'+ch.id,label:title,chapterId:ch.id,manual:false});
  selectChapter(ch.id);reorderAll(false);saveDraft(true);toast('已新增：'+title);
}

/* ============ 合并 / 删除 ============ */
function mergeUp(id){
  const idx=state.chapters.findIndex(c=>c.id===id);if(idx<=0)return toast('已是第一章，无法合并');
  const target=state.chapters[idx-1];const src=state.chapters[idx];
  target.html=(target.html||'')+(src.html||'');
  state.chapters.splice(idx,1);
  state.toc=state.toc.filter(t=>t.chapterId!==src.id);
  reorderAll(false);selectChapter(target.id);saveDraft(true);toast('已合并到：'+target.title);
}
function deleteChapter(id){
  if(state.chapters.length<=1)return toast('至少保留一章');
  if(!confirm('确定删除该章节？'))return;
  const idx=state.chapters.findIndex(c=>c.id===id);
  state.chapters.splice(idx,1);
  state.toc=state.toc.filter(t=>t.chapterId!==id);
  reorderAll(false);
  if(state.curId===id)selectChapter(state.chapters[Math.min(idx,state.chapters.length-1)].id);else renderChList();
  saveDraft(true);
}

/* ============ 重新排序（强制：正文按序号重命名 + 目录重建 + 自动触发） ============ */
function reorderAll(showToast=true){
  const special=(t)=>/^(封面|目录|前言)$/.test(t);
  const sp=state.chapters.filter(c=>special(c.title));
  const body=state.chapters.filter(c=>!special(c.title));
  body.forEach((c,i)=>{c.title=`第 ${i+1} 章`;c.manual=false;c.order=i+1});
  state.chapters=[...sp,...body];
  state.toc=state.chapters.map(c=>({id:'toc_'+c.id,label:c.title,chapterId:c.id,manual:false}));
  renderChList();renderToc();
  const cur=currentCh();if(cur)$('#curChInfo').textContent=`当前：${cur.title}`;
  if(showToast)toast('已重新排序，目录已更新');
}

/* ============ 目录面板 ============ */
function renderToc(){
  const box=$('#tocList');box.innerHTML='';
  state.toc.forEach((t,idx)=>{
    const row=el('div','toc-item');
    row.innerHTML=`<input value="${t.label.replace(/"/g,'&quot;')}"><span class="tdel" title="删除">🗑</span>`;
    const inp=row.querySelector('input');inp.oninput=()=>{t.label=inp.value;t.manual=true;renderChList()};
    row.querySelector('.tdel').onclick=()=>{state.toc.splice(idx,1);renderToc();renderChList()};
    box.append(row);
  });
}

/* ============ 导入 EPUB ============ */
async function importEpub(file){
  if(typeof JSZip!=='function')return toast('JSZip 未加载，无法导入',4000);
  state._importing=true;
  toast('正在解析 EPUB…',1500);
  try{
    const buf=await file.arrayBuffer();
    const zip=await JSZip.loadAsync(buf);
    let opfPath=null;const container=zip.file('META-INF/container.xml');if(container){const xml=await container.async('string');const m=xml.match(/full-path="([^"]+)"/);if(m)opfPath=m[1]}
    let opf=null;if(opfPath){const f=zip.file(opfPath);if(f)opf=await f.async('string')}
    const files=Object.values(zip.files).filter(f=>!f.dir && /\.xhtml?$/i.test(f.name) && !/\/(nav|cover)\.xhtml?$/i.test('/'+f.name));
    const allHtml=[];for(const f of files){const txt=await f.async('string');allHtml.push(txt)}
    const joined=allHtml.join('\n');
    const chapters=smartSplit(joined);
    const specials=[];
    const navF=zip.file(/\/(nav\.xhtml?)$/i);if(navF&&navF.length){specials.push({id:'ch_nav',title:'目录',html:await navF[0].async('string'),manual:false,order:0})}
    const coverF=zip.file(/\/(cover\.xhtml?)$/i);if(coverF&&coverF.length){specials.push({id:'ch_cover',title:'封面',html:await coverF[0].async('string'),manual:false,order:0})}
    state.chapters=[...specials,...chapters];
    state.toc=state.chapters.map(c=>({id:'toc_'+c.id,label:c.title,chapterId:c.id,manual:false}));
    state.curId=state.chapters[0]?state.chapters[0].id:null;
    renderChList();selectChapter(state.curId);saveDraft(true);
    toast(`导入成功：共 ${state.chapters.length} 章`,3000);
  }catch(e){console.error(e);toast('导入失败：'+(e.message||e),5000)}
  finally{state._importing=false}
}

/* ============ 智能分章核心 ============ */
function smartSplit(fullHtml){
  const wrap=document.createElement('div');wrap.innerHTML=fullHtml;
  const nodes=Array.from(wrap.children);
  const chapters=[];
  // 1) 定位第一个 me/ta 元素
  let firstIdx=-1;nodes.forEach((n,i)=>{if(firstIdx===-1 && isMeTa(n))firstIdx=i});
  const preNodes=firstIdx===-1? nodes : nodes.slice(0,firstIdx);
  let preface=preNodes.map(n=>n.outerHTML).join('');
  // 边界修正（仅前言→第一章）：前言末尾若为 h1 或 p.meta 块，移至第一章开头
  const preWrap=document.createElement('div');preWrap.innerHTML=preface;
  const preChildren=Array.from(preWrap.children);
  const moved=[];if(preChildren.length){const last=preChildren[preChildren.length-1];if((last.tagName==='H1')||(last.tagName==='P'&&(last.className||'').includes('meta'))){moved.unshift(preChildren.pop())}}
  preface=preChildren.map(n=>n.outerHTML).join('');
  if(preface.trim())chapters.push({id:'ch_'+Date.now()+'_pre',title:'前言',html:preface,manual:false,order:1});
  // 2) 正文：按回合切分（每个 me 块开启新回合；ta/其他归入当前回合）
  const bodyNodes=firstIdx===-1? [] : nodes.slice(firstIdx);
  let curRound=[],rounds=[];
  bodyNodes.forEach(n=>{if(isMeTa(n)){if(curRound.length){rounds.push(curRound);curRound=[]}curRound.push(n.outerHTML)}else{curRound.push(n.outerHTML)}});
  if(curRound.length)rounds.push(curRound);
  if(moved.length){const first=rounds[0]||[];rounds[0]=[...moved.map(x=>x.outerHTML),...first]}
  if(!rounds.length && !chapters.length){chapters.push({id:'ch_'+Date.now()+'_pre',title:'前言',html:preface||moved.map(x=>x.outerHTML).join(''),manual:false,order:1})}
  rounds.forEach((r,i)=>{chapters.push({id:'ch_'+Date.now()+'_'+i,title:`第 ${i+1} 章`,html:r.join(''),manual:false,order:chapters.length+1})});
  return chapters;
}

/* ============ 导出 EPUB ============ */
async function exportEpub(){
  if(typeof JSZip!=='function')return toast('JSZip 未加载，无法导出',4000);
  const zip=new JSZip();
  zip.file('mimetype','application/epub+zip');
  const metaInf=zip.folder('META-INF');metaInf.file('container.xml','<?xml version="1.0"?><container version="1.0" xmlns="urn:oasis:names:tc:opendocument:xmlns:container"><rootfiles><rootfile full-path="content.opf" media-type="application/oebps-package+xml"/></rootfiles></container>');
  const css=`body{font-family:"PingFang SC","Microsoft YaHei",sans-serif;line-height:1.8;padding:24px;color:#222}.me{color:#1b5e20}.ta{color:#1a3a8a}.meta{color:#888;font-size:.9em}`;zip.file('style.css',css);
  const pad2=n=>String(n).padStart(2,'0');
  // 导出前把可视化容器转回标准 me/ta div（保证通用 EPUB 阅读器可读）
  const chapters=state.chapters.map((c,i)=>{const fn=`ch${pad2(i+1)}.xhtml`;return {c,fn}});
  const navHtml='<?xml version="1.0" encoding="UTF-8"?><!DOCTYPE html><html xmlns="http://www.w3.org/1999/xhtml" xmlns:epub="http://www.idpf.org/2007/ops"><head><meta charset="utf-8"/><title>目录</title></head><body><nav epub:type="toc"><h1>目录</h1><ol>'+
    chapters.map(({c,fn})=>`<li><a href="${fn}">${c.title.replace(/&/g,'&amp;').replace(/</g,'&lt;')}</a></li>`).join('')+
    '</ol></nav></body></html>';
  zip.file('nav.xhtml',navHtml);
  const manifestItems=chapters.map(({c,fn})=>`<item id="id_${fn.replace('.xhtml','')}" href="${fn}" media-type="application/xhtml+xml"/>`).join('')+
    `<item id="nav" href="nav.xhtml" media-type="application/xhtml+xml" properties="nav"/>`+
    `<item id="css" href="style.css" media-type="text/css"/>`;
  const spineItems=chapters.map(({c,fn})=>`<itemref idref="id_${fn.replace('.xhtml','')}"/>`).join('');
  const titleAttr=(state.meta.title||'未命名').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  const opf=`<?xml version="1.0"?><package version="3.0" xmlns="http://www.idpf.org/2007/opf" unique-identifier="bookid"><metadata xmlns:dc="http://purl.org/dc/elements/1.1/"><dc:title>${titleAttr}</dc:title><dc:creator>${state.meta.author||''}</dc:creator><dc:identifier id="bookid">urn:uuid:${Date.now()}</dc:identifier><dc:language>zh-CN</dc:language></metadata><manifest>${manifestItems}</manifest><spine>${spineItems}</spine></package>`;
  zip.file('content.opf',opf);
  chapters.forEach(({c,fn})=>{
    const body=stripContainerLabels(c.html)||'';
    const xhtml=`<?xml version="1.0" encoding="UTF-8"?><!DOCTYPE html><html xmlns="http://www.w3.org/1999/xhtml"><head><meta charset="utf-8"/><title>${c.title.replace(/&/g,'&amp;').replace(/</g,'&lt;')}</title><link rel="stylesheet" type="text/css" href="style.css"/></head><body>${body}</body></html>`;
    zip.file(fn,xhtml);
  });
  const blob=await zip.generateAsync({type:'blob',mimeType:'application/epub+zip',compression:'STORE'});
  const name=safeName(state.meta.exportName||state.meta.title||'未命名')+'.epub';
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();URL.revokeObjectURL(a.href);
  toast('已导出：'+name,3000);
}

/* ============ 元数据 ============ */
function loadMeta(){try{const m=JSON.parse(localStorage.getItem(META_KEY)||'null');if(m)state.meta={...state.meta,...m};$('#metaTitle').value=state.meta.title||'';$('#metaAuthor').value=state.meta.author||'';$('#metaExport').value=state.meta.exportName||''}catch(e){}}
function saveMeta(){localStorage.setItem(META_KEY,JSON.stringify(state.meta))}

/* ============ 草稿（导入分章过程不保存；仅用户操作时保存） ============ */
let draftTimer=null;
function scheduleDraftSave(){if(draftTimer)clearTimeout(draftTimer);draftTimer=setTimeout(()=>saveDraft(false),900)}
function saveDraft(force){
  if(state._importing)return; // 分章中途绝不写半成品
  try{localStorage.setItem(DRAFT_KEY,JSON.stringify({chapters:state.chapters,toc:state.toc,meta:state.meta,curId:state.curId,ts:Date.now()}));$('#draftHint').textContent='已自动存草稿'}catch(e){}
}
function tryRestoreDraft(){
  try{
    const raw=localStorage.getItem(DRAFT_KEY);if(!raw)return;
    const d=JSON.parse(raw);if(!d||!Array.isArray(d.chapters)||!d.chapters.length)return;
    state.chapters=d.chapters;state.toc=Array.isArray(d.toc)? d.toc : state.chapters.map(c=>({id:'toc_'+c.id,label:c.title,chapterId:c.id,manual:false}));state.meta=d.meta||state.meta;loadMeta();
    state.curId=d.curId&&state.chapters.find(c=>c.id===d.curId)? d.curId : state.chapters[0].id;
    renderChList();selectChapter(state.curId);$('#draftHint').textContent='已恢复草稿';toast('已恢复上次草稿',2000);
  }catch(e){console.error('draft restore failed',e)}
}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden'&&!state._importing)saveDraft(false)});

/* ============ 全局错误兜底 ============ */
window.addEventListener('error',e=>{console.error('Global error:',e.error||e.message);if(/JSZip/.test(e.message||''))toast('JSZip 相关错误：'+e.message,5000)});
</script>
