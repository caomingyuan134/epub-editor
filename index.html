<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1f6feb">
<title>EPUB 分章工具 V7</title>
<script src="jszip.min.js"></script>
<style>
  :root{
    --blue:#1f6feb; --blue-d:#1858c4; --ink:#1a1a1a; --muted:#6b7280;
    --line:#e5e7eb; --bg:#f6f8fb; --card:#fff; --warn:#b45309; --warn-bg:#fff7ed;
    --danger:#dc2626; --ok:#16a34a;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    background:var(--bg);color:var(--ink);font-size:15px;line-height:1.6;
    -webkit-text-size-adjust:100%;
  }
  /* 吸顶容器：蓝栏 + 工具栏竖向排列，整体 fixed 吸顶 */
  #fixedHeader{position:fixed;top:0;left:0;right:0;z-index:1000;background:#fff;
    box-shadow:0 1px 3px rgba(0,0,0,.08);}
  #topbar{display:flex;flex-wrap:wrap;gap:6px;padding:8px 10px;background:var(--blue);color:#fff;align-items:center}
  #topbar .t{font-weight:700;font-size:15px;margin-right:auto;white-space:nowrap}
  #topbar button{background:rgba(255,255,255,.16);color:#fff;border:0;padding:6px 10px;border-radius:6px;
    font-size:13px;cursor:pointer;white-space:nowrap}
  #topbar button:active{background:rgba(255,255,255,.3)}
  #toolbar{display:flex;flex-wrap:wrap;gap:4px;padding:6px 8px;background:#fff;border-bottom:1px solid var(--line);align-items:center}
  #toolbar button,.fmt-btn{background:#f1f5f9;color:var(--ink);border:0;padding:5px 8px;border-radius:5px;
    font-size:13px;cursor:pointer;white-space:nowrap}
  #toolbar button:active,.fmt-btn:active{background:#e2e8f0}
  #toolbar .sep{width:1px;height:20px;background:var(--line);margin:0 2px}
  #restoreBar{display:none;position:fixed;left:0;right:0;top:0;z-index:1100;background:var(--warn-bg);
    color:var(--warn);padding:10px 12px;font-size:14px;align-items:center;gap:8px;flex-wrap:wrap;
    border-bottom:1px solid #fdba74}
  #restoreBar.show{display:flex}
  #restoreBar button{background:var(--warn);color:#fff;border:0;padding:5px 10px;border-radius:5px;font-size:13px;cursor:pointer}
  #restoreBar .close{background:transparent;color:var(--warn);text-decoration:underline}
  #app{display:flex;min-height:calc(100vh - 0px)}
  #sidebar{width:240px;background:#fff;border-right:1px solid var(--line);padding:10px;overflow-y:auto;
    position:fixed;top:0;bottom:0;left:0;z-index:900;transform:translateX(-100%);transition:transform .2s;
    padding-top:env(safe-area-inset-top,0px)}
  #sidebar.open{transform:translateX(0)}
  #sidebar h3{font-size:13px;color:var(--muted);margin:6px 2px;text-transform:uppercase;letter-spacing:.5px}
  .ch-item{display:flex;align-items:center;gap:4px;padding:5px 6px;border-radius:6px;cursor:pointer;font-size:13px}
  .ch-item:hover{background:#f1f5f9}
  .ch-item.active{background:#e8f0fe;color:var(--blue-d);font-weight:600}
  .ch-item .name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .ch-item .merge{background:var(--blue);color:#fff;border:0;border-radius:4px;padding:2px 6px;font-size:11px;cursor:pointer}
  .ch-item .del{background:transparent;color:var(--danger);border:0;font-size:14px;cursor:pointer;padding:0 4px}
  #newCh{margin-top:8px;width:100%;background:var(--blue);color:#fff;border:0;padding:8px;border-radius:6px;font-size:13px;cursor:pointer}
  #newCh:active{background:var(--blue-d)}
  #main{flex:1;padding:14px;min-width:0}
  #meta{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap}
  #meta input{flex:1;min-width:120px;padding:7px 9px;border:1px solid var(--line);border-radius:6px;font-size:14px}
  #titleInput{width:100%;font-size:18px;font-weight:700;padding:8px 0;background:transparent;border:0;
    border-bottom:1px solid var(--line);margin-bottom:6px;color:var(--ink)}
  #titleInput:focus{outline:0;border-bottom-color:var(--blue)}
  #info{font-size:12px;color:var(--muted);margin-bottom:8px}
  #editor[contenteditable="true"]{background:var(--card);border:1px solid var(--line);border-radius:8px;
    padding:12px 14px;min-height:50vh;outline:0;font-size:15px;line-height:1.75;overflow-wrap:anywhere}
  #editor:focus{border-color:var(--blue)}
  .me,.ta{margin:8px 0;padding:8px 10px;border-radius:8px;border:1px solid var(--line)}
  .me{background:#eef4ff;border-left:3px solid var(--blue)}
  .ta{background:#fff8ec;border-left:3px solid #f59e0b}
  .who{font-size:12px;font-weight:700;color:var(--muted);margin-bottom:2px}
  #scrim{display:none;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:850}
  #scrim.show{display:block}
  .toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%);background:#222;color:#fff;
    padding:8px 14px;border-radius:8px;font-size:13px;z-index:2000;opacity:0;transition:opacity .2s;max-width:90vw}
  .toast.show{opacity:1}
  .empty{color:var(--muted);text-align:center;padding:40px 0;font-size:14px}
  @media(max-width:640px){
    #sidebar{width:82vw}
    #main{padding:10px}
  }
</style>
</head>
<body>
<div id="restoreBar">
  <span>检测到未保存的草稿，是否恢复？</span>
  <button id="restoreBtn">恢复</button>
  <button class="close" id="discardBtn">丢弃</button>
</div>
<div id="fixedHeader">
  <div id="topbar">
    <span class="t">EPUB 分章工具 V7</span>
    <button id="btnImport">导入</button>
    <button id="btnSave">保存</button>
    <button id="btnBackup">备份</button>
    <button id="btnExport">导出</button>
    <button id="btnNew">新建</button>
    <input id="fileInput" type="file" accept=".epub,application/epub+zip" style="display:none">
  </div>
  <div id="toolbar">
    <button class="fmt-btn" data-cmd="undo" title="撤销">↩ 撤销</button>
    <button class="fmt-btn" data-cmd="redo" title="重做">↪ 重做</button>
    <span class="sep"></span>
    <button class="fmt-btn" data-cmd="bold"><b>B</b></button>
    <button class="fmt-btn" data-cmd="italic"><i>I</i></button>
    <button class="fmt-btn" data-cmd="underline"><u>U</u></button>
    <span class="sep"></span>
    <button class="fmt-btn" data-cmd="formatBlock" data-val="H2">H2</button>
    <button class="fmt-btn" data-cmd="formatBlock" data-val="H3">H3</button>
    <button class="fmt-btn" data-cmd="insertUnorderedList">• 列表</button>
    <button class="fmt-btn" data-cmd="createLink" data-val="link">🔗</button>
    <button class="fmt-btn" data-cmd="removeFormat">清除格式</button>
  </div>
</div>
<div id="scrim"></div>
<div id="app">
  <aside id="sidebar">
    <h3>章节</h3>
    <div id="chList"></div>
    <button id="newCh">＋ 新建章节</button>
    <h3 style="margin-top:12px">目录</h3>
    <div id="tocList" style="font-size:12px;color:var(--muted)"></div>
  </aside>
  <main id="main">
    <div id="meta">
      <input id="bookTitle" placeholder="书名">
      <input id="bookAuthor" placeholder="作者">
      <input id="aiRole" placeholder="AI 角色名（默认 TA）">
    </div>
    <input id="titleInput" placeholder="章节标题">
    <div id="info">第 0 段 · 0 字</div>
    <div id="editor" contenteditable="true" spellcheck="false"></div>
  </main>
</div>
<div id="toast" class="toast"></div>
<script>
"use strict";
/* ============ 工具函数 ============ */
const $=(s)=>document.querySelector(s);
const RESTORE_KEY="epubEditorDraftV7";
const HIST_MAX=30;
let toastTimer=null;
function toast(msg){const t=$("#toast");t.textContent=msg;t.classList.add("show");clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove("show"),1800);}
function safeName(s){return(String(s||"未命名").replace(/[\/\\:*?"<>|]/g,"_").trim()||"未命名");}
function el(tag,attrs={},...kids){const e=document.createElement(tag);for(const k in attrs){if(k==="class")e.className=attrs[k];else if(k==="html")e.innerHTML=attrs[k];else e.setAttribute(k,attrs[k]);}for(const k of kids){if(k==null)continue;e.appendChild(typeof k==="string"?document.createTextNode(k):k);}return e;}
function calibrateLayout(){const fh=$("#fixedHeader");const h=fh?fh.offsetHeight:0;document.body.style.paddingTop=h+"px";$("#app").style.marginTop="0px";$("#sidebar").style.top=h+"px";$("#scrim").style.top=h+"px";}
window.addEventListener("load",calibrateLayout);window.addEventListener("resize",calibrateLayout);setTimeout(calibrateLayout,100);setTimeout(calibrateLayout,600);

/* ============ 状态 ============ */
const state={
  zip:null,                 // 原始 epub JSZip 实例（仅用于读取资源）
  chapters:[],              // [{id,title,html,role,xhtmlPath}]
  currentId:null,
  meta:{title:"",author:"",aiRole:"TA"},
  history:[],historyIdx:-1,histArmed:false,histTimer:null,
  draft:null,
};

/* ============ 分章核心：按 me/ta 轮次切分 ============ */
/*
  三段划分：
    A 纯开场白 = 首个 me/ta 之前、且不含 <h1> 时间戳标题的段落 -> 前言（空则不生成）
    B h1 时间戳段 = 首个 h1 到首个 me/ta 之间 -> 并入首回合作为第一章开头
    C 首个 me/ta 起 -> 正常轮次切分（每回合=一章）
*/
function splitByRounds(html){
  const doc=new DOMParser().parseFromString("<div>"+html+"</div>","text/html");
  const root=doc.body.firstChild;
  const nodes=Array.from(root.children);
  const isMeTa=(n)=>n.nodeType===1&&(n.classList.contains("me")||n.classList.contains("ta"));
  const isH1Time=(n)=>n.nodeType===1&&n.tagName==="H1"&&/玄渊历|时间/.test(n.textContent||"");
  let firstMeTaIdx=-1;let firstH1Idx=-1;
  nodes.forEach((n,i)=>{if(firstMeTaIdx<0&&isMeTa(n))firstMeTaIdx=i;if(firstH1Idx<0&&isH1Time(n))firstH1Idx=i;});

  // A 纯开场白：首个 me/ta 之前，排除 h1 时间戳段
  const preEnd=(firstH1Idx>=0&&firstH1Idx<firstMeTaIdx)?firstH1Idx:firstMeTaIdx;
  let preamble="";
  if(preEnd>0){
    const preNodes=nodes.slice(0,preEnd).filter(n=>n.nodeType===1);
    if(preNodes.length){const wrap=doc.createElement("div");preNodes.forEach(n=>wrap.appendChild(n.cloneNode(true)));preamble=wrap.innerHTML.trim();}
  }
  // B h1 时间戳段：从首个 h1 到首个 me/ta（并入首回合）
  let headPart="";
  if(firstH1Idx>=0&&firstH1Idx<firstMeTaIdx){
    const headNodes=nodes.slice(firstH1Idx,firstMeTaIdx).filter(n=>n.nodeType===1);
    if(headNodes.length){const wrap=doc.createElement("div");headNodes.forEach(n=>wrap.appendChild(n.cloneNode(true)));headPart=wrap.innerHTML.trim();}
  }
  // C 轮次切分：从首个 me/ta 起；每个 me 开新回合，其后的 ta 归入同一回合（me+ta=一个轮次）
  const rounds=[];let buf="";let inRound=false;
  const bodyNodes=nodes.slice(firstMeTaIdx>=0?firstMeTaIdx:nodes.length).filter(n=>n.nodeType===1);
  bodyNodes.forEach((n)=>{
    if(n.classList&&n.classList.contains("me")){if(buf&&inRound){rounds.push(buf);buf="";}buf+=n.outerHTML;inRound=true;}
    else{if(inRound)buf+=n.outerHTML;}
  });
  if(buf)rounds.push(buf);
  // 首回合拼入 h1 时间戳段
  if(rounds.length&&headPart){rounds[0]=headPart+"\n"+rounds[0];}
  return {preamble,rounds};
}

function buildChaptersFromSplit(split,fileKey){
  const list=[];
  if(split.preamble){list.push({id:genId(),title:"前言",html:split.preamble,role:"preamble",xhtmlPath:null});}
  split.rounds.forEach((r,i)=>{list.push({id:genId(),title:"第"+(i+1)+"章",html:r,role:"round",xhtmlPath:null});});
  return list;
}

function genId(){return"ch_"+Math.random().toString(36).slice(2,9);}

/* ============ 导入 ============ */
async function importEpub(file){
  try{
    // 导入新书前先清旧草稿，避免旧书残留
    try{localStorage.removeItem(RESTORE_KEY);}catch(e){}
    state.draft=null;
    if(typeof JSZip==="undefined"){toast("JSZip 库加载失败");return;}
    const zip=new JSZip();const loaded=await zip.loadAsync(file);state.zip=loaded;
    const opfEntry=loaded.file(/.*content\.opf$/i)[0]||loaded.file(/.*\.opf$/i)[0];
    if(!opfEntry){toast("未找到 content.opf");return;}
    const opfXml=await opfEntry.async("string");
    const opfDoc=new DOMParser().parseFromString(opfXml,"application/xml");
    const ns={"o":"http://www.idpf.org/2007/opf"};
    const titleEl=opfDoc.querySelector("title,dc\\:title");
    const creatorEl=opfDoc.querySelector("creator,dc\\:creator");
    state.meta.title=(titleEl?titleEl.textContent:"")||"";
    state.meta.author=(creatorEl?creatorEl.textContent:"")||"";
    $("#bookTitle").value=state.meta.title;$("#bookAuthor").value=state.meta.author;$("#aiRole").value="";
    // 收集 xhtml 正文文件（排除 nav/toc/ncx/cover）
    const xhtmlFiles=Object.values(loaded.files).filter(f=>!f.dir&&/\.xhtml?$/i.test(f.name)&&!/nav\.xhtml?$|toc\.ncx$|cover\.xhtml?$/i.test(f.name));
    let allChapters=[];
    for(const f of xhtmlFiles){
      const txt=await f.async("string");
      const bodyMatch=txt.match(/<body[\s\S]*<\/body>/i);
      const bodyHtml=bodyMatch?bodyMatch[0].replace(/<\/?body[^>]*>/gi,""):txt;
      const split=splitByRounds(bodyHtml);
      const chs=buildChaptersFromSplit(split,f.name);
      allChapters=allChapters.concat(chs);
    }
    // 提取 AI 角色名（方案 B）：首个 ta.who
    let aiRole="TA";
    for(const c of allChapters){if(c.role!=="preamble"){const m=c.html.match(/<div class="ta">[\s\S]*?<p class="who">([\s\S]*?)<\/p>/);if(m&&m[1].trim()){aiRole=m[1].trim();break;}}}
    state.meta.aiRole=aiRole;$("#aiRole").value=aiRole;
    // 特殊章节：nav->目录 / cover->封面（若无对应内容则不强行生成）
    const navCh={id:genId(),title:"目录",html:'<p class="meta">目录页</p>',role:"nav",xhtmlPath:"nav.xhtml"};
    const coverCh={id:genId(),title:"封面",html:'<p class="meta">封面</p>',role:"cover",xhtmlPath:"cover.xhtml"};
    state.chapters=orderChapters([navCh,coverCh,...allChapters]);
    state.currentId=state.chapters[0]?state.chapters[0].id:null;
    renderChapters();renderToc();await selectChapter(state.currentId);
    saveDraft();toast("导入并分章完成（"+state.chapters.length+" 章）");
  }catch(e){console.error(e);toast("导入失败："+e.message);}
}

function orderChapters(list){
  const order={nav:0,cover:1,preamble:2};
  return list.slice().sort((a,b)=>{
    const ao=order[a.role]??(a.role==="round"?3+(parseInt((a.title.match(/\d+/)||["0"])[0],10)||0):99);
    const bo=order[b.role]??(b.role==="round"?3+(parseInt((b.title.match(/\d+/)||["0"])[0],10)||0):99);
    return ao-bo;
  });
}

/* ============ 渲染 ============ */
function renderChapters(){
  const box=$("#chList");box.innerHTML="";
  state.chapters.forEach(c=>{
    const item=el("div",{class:"ch-item"+(c.id===state.currentId?" active":"")},
      el("span",{class:"name"},c.title+(c.role==="round"?"":"（"+c.role+"）")),
      el("button",{class:"merge",title:"合并到上一章"},"合并↑"),
      el("button",{class:"del",title:"删除"},"×")
    );
    item.querySelector(".name").onclick=()=>selectChapter(c.id);
    item.querySelector(".merge").onclick=(ev)=>{ev.stopPropagation();mergeUp(c.id);};
    item.querySelector(".del").onclick=(ev)=>{ev.stopPropagation();deleteChapter(c.id);};
    box.appendChild(item);
  });
  $("#info").textContent="第 "+(state.chapters.findIndex(c=>c.id===state.currentId)+1)+" / "+state.chapters.length+" 章 · "+ (state.currentId?getCur().html.replace(/<[^>]+>/g,"").length:0)+" 字";
}
function renderToc(){
  const box=$("#tocList");box.innerHTML="";
  state.chapters.forEach(c=>{box.appendChild(el("div",null,c.title));});
}

function getCur(){return state.chapters.find(c=>c.id===state.currentId);}
async function selectChapter(id){
  commitTitle();state.currentId=id;const c=getCur();
  $("#titleInput").value=c?c.title:"";
  $("#editor").innerHTML=c?c.html:'<p class="empty">暂无内容</p>';
  renderChapters();renderToc();window.scrollTo({top:0,behavior:"instant"});$("#editor").scrollTop=0;
  resetHistory();
}

function commitTitle(){const c=getCur();if(!c)return;const t=$("#titleInput").value.trim();if(t)c.title=t;}

/* ============ 编辑 / 历史（撤销重写：input+setTimeout 快照） ============ */
function pushHistory(){
  const ed=$("#editor");const html=ed.innerHTML;
  if(state.history.length&&state.history[state.history.length-1]===html)return;
  state.history.push(html);if(state.history.length>HIST_MAX)state.history.shift();
  state.historyIdx=state.history.length-1;
}
function resetHistory(){const ed=$("#editor");state.history=[ed.innerHTML];state.historyIdx=0;state.histArmed=false;if(state.histTimer){clearTimeout(state.histTimer);state.histTimer=null;}}
function scheduleSave(){if(state.histTimer){clearTimeout(state.histTimer);}state.histTimer=setTimeout(()=>{saveDraft();state.histTimer=null;},900);}
function onEdit(){
  const ed=$("#editor");
  if(!state.histArmed){state.histArmed=true;pushHistory();}
  const c=getCur();if(c)c.html=ed.innerHTML;
  scheduleSave();renderChapters();
}
$("#editor").addEventListener("input",onEdit);
document.querySelectorAll(".fmt-btn").forEach(b=>b.addEventListener("click",()=>{
  const cmd=b.dataset.cmd;const val=b.dataset.val||null;
  if(cmd==="createLink"){const u=prompt("链接地址","https://");if(u)document.execCommand("createLink",false,u);}
  else if(cmd==="formatBlock")document.execCommand("formatBlock",false,val);
  else document.execCommand(cmd,false,val);
  $("#editor").focus();onEdit();
}));
$("#titleInput").addEventListener("input",()=>{const c=getCur();if(c)c.title=$("#titleInput").value.trim();renderChapters();renderToc();scheduleSave();});

/* ============ 章节操作 ============ */
function newChapter(){
  const aiRole=state.meta.aiRole||"TA";
  const html='<div class="me"><p class="who">我</p><p><br></p></div>\n<div class="ta"><p class="who">'+aiRole+'</p><p><br></p></div>';
  const ch={id:genId(),title:"第"+(state.chapters.filter(c=>c.role==="round").length+1)+"章",html,role:"round",xhtmlPath:null};
  state.chapters.push(ch);renderChapters();renderToc();selectChapter(ch.id);saveDraft();toast("已新建章节");
}
function deleteChapter(id){state.chapters=state.chapters.filter(c=>c.id!==id);if(state.currentId===id)state.currentId=state.chapters[0]?state.chapters[0].id:null;renderChapters();renderToc();selectChapter(state.currentId);saveDraft();}
function mergeUp(id){
  const idx=state.chapters.findIndex(c=>c.id===id);if(idx<=0)return;
  const cur=state.chapters[idx],prev=state.chapters[idx-1];
  if(cur.role==="nav"||cur.role==="cover"||prev.role==="nav"||prev.role==="cover"){toast("特殊章节不可合并");return;}
  prev.html=(prev.html+"\n"+cur.html).trim();prev.title=prev.title;
  state.chapters.splice(idx,1);
  // 重新编号 round 章节
  let n=0;state.chapters.forEach(c=>{if(c.role==="round"){n++;c.title="第"+n+"章";}});
  renderChapters();renderToc();saveDraft();toast("已合并到上一章");
}

/* ============ 草稿 ============ */
function saveDraft(){try{const d={chapters:state.chapters,currentId:state.currentId,meta:state.meta};localStorage.setItem(RESTORE_KEY,JSON.stringify(d));state.draft=d;}catch(e){}}
function restoreDraft(){try{const raw=localStorage.getItem(RESTORE_KEY);if(!raw)return;const d=JSON.parse(raw);if(!d||!Array.isArray(d.chapters)||!d.chapters.length)return;state.draft=d;$("#restoreBar").classList.add("show");}catch(e){}}
$("#restoreBtn").addEventListener("click",()=>{if(state.draft){state.chapters=state.draft.chapters;state.currentId=state.draft.currentId;state.meta=state.draft.meta||state.meta;$("#bookTitle").value=state.meta.title;$("#bookAuthor").value=state.meta.author;$("#aiRole").value=state.meta.aiRole||"";renderChapters();renderToc();selectChapter(state.currentId);} $("#restoreBar").classList.remove("show");toast("已恢复草稿");});
$("#discardBtn").addEventListener("click",()=>{try{localStorage.removeItem(RESTORE_KEY);}catch(e){}state.draft=null;$("#restoreBar").classList.remove("show");});
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="hidden")saveDraft();});
window.addEventListener("pagehide",saveDraft);

/* ============ 导出（完整重建 EPUB 标准结构） ============ */
async function exportEpub(){
  try{
    commitTitle();if(!state.chapters.length){toast("暂无章节可导出");return;}
    const zip=new JSZip();
    const title=safeName(state.meta.title)||"未命名";
    // 1) mimetype 必须是 zip 第一个文件，STORE 未压缩
    zip.file("mimetype","application/epub+zip",{compression:"STORE"});
    // 2) META-INF/container.xml
    zip.file("META-INF/container.xml",'<?xml version="1.0" encoding="UTF-8"?>\n<container version="1.0" xmlns="urn:oasis:names:tc:opendocument:xmlns:container"><rootfiles><rootfile full-path="OEBPS/content.opf" media-type="application/oebps-package+xml"/></rootfiles></container>');
    // 3) 各章节 xhtml（标准 EPUB3 结构）
    const oebps="OEBPS/";const chapDir=oebps+"chapters/";
    const chapterFiles=[];
    state.chapters.forEach((c,i)=>{
      const fname="ch"+String(i+1).padStart(3,"0")+".xhtml";
      const xhtml=wrapXhtml(c.title,c.html);
      zip.file(chapDir+fname,xhtml);
      chapterFiles.push({fname,title:c.title,id:c.id});
      c.xhtmlPath="chapters/"+fname;
    });
    // 4) style.css（尝试从原始 zip 读取，否则默认）
    let css="body{font-family:sans-serif;line-height:1.7;padding:16px;max-width:720px;margin:0 auto;color:#222}.me{background:#eef4ff;border-left:3px solid #1f6feb;padding:8px 10px;margin:8px 0;border-radius:8px}.ta{background:#fff8ec;border-left:3px solid #f59e0b;padding:8px 10px;margin:8px 0;border-radius:8px}.who{font-size:12px;font-weight:700;color:#6b7280;margin-bottom:2px}.meta{color:#6b7280;font-size:12px}\nh1{font-size:1.3em}";
    if(state.zip){const cf=state.zip.file(/.*style\.css$/i)[0];if(cf)css=await cf.async("string");}
    zip.file(oebps+"style.css",css);
    // 5) nav.xhtml + toc.ncx
    zip.file(oebps+"nav.xhtml",buildNav(chapterFiles));
    zip.file(oebps+"toc.ncx",buildNcx(chapterFiles));
    // 6) content.opf（manifest + spine）
    zip.file(oebps+"content.opf",buildOpf(chapterFiles,state.meta));
    const blob=await zip.generateAsync({type:"blob",mimeType:"application/epub+zip"});
    const url=URL.createObjectURL(blob);const a=document.createElement("a");a.href=url;a.download=title+".epub";document.body.appendChild(a);a.click();document.body.removeChild(a);URL.revokeObjectURL(url);
    toast("已导出 "+title+".epub");
  }catch(e){console.error(e);toast("导出失败："+e.message);}
}
function wrapXhtml(title,bodyHtml){return'<?xml version="1.0" encoding="UTF-8"?>\n<!DOCTYPE html>\n<html xmlns="http://www.w3.org/1999/xhtml" xmlns:epub="http://www.idpf.org/2007/ops" lang="zh-CN">\n<head><meta charset="utf-8"/><title>'+escapeXml(title)+'</title><link rel="stylesheet" type="text/css" href="../style.css"/></head>\n<body>\n<h1>'+escapeXml(title)+'</h1>\n'+bodyHtml+"\n</body>\n</html>\n";}
function escapeXml(s){return String(s).replace(/[<>&'"]/g,c=>({"<":"&lt;",">":"&gt;","&":"&amp;","'":"&apos;",'"':"&quot;"}[c]));}
function buildOpf(files,meta){const manifest=files.map((f,i)=>'    <item id="ch'+(i+1)+'" href="chapters/'+f.fname+'" media-type="application/xhtml+xml"/>').join("\n");const spine=files.map((f,i)=>'    <itemref idref="ch'+(i+1)+'"/>').join("\n");return'<?xml version="1.0" encoding="UTF-8"?>\n<package xmlns="http://www.idpf.org/2007/opf" version="3.0" unique-identifier="bookid">\n<metadata xmlns:dc="http://purl.org/dc/elements/1.1/">\n<dc:title>'+escapeXml(meta.title||"未命名")+'</dc:title>\n<dc:creator>'+escapeXml(meta.author||"")+'</dc:creator>\n<dc:identifier id="bookid">urn:uuid:'+genUuid()+'</dc:identifier>\n<dc:language>zh-CN</dc:language>\n</metadata>\n<manifest>\n  <item id="nav" href="nav.xhtml" media-type="application/xhtml+xml" properties="nav"/>\n  <item id="ncx" href="toc.ncx" media-type="application/x-dtbncx+xml"/>\n  <item id="css" href="style.css" media-type="text/css"/>\n'+manifest+'\n</manifest>\n<spine toc="ncx">\n'+spine+'\n</spine>\n</package>\n';}
function buildNav(files){const lis=files.map((f,i)=>'    <li><a href="chapters/'+f.fname+'">'+escapeXml(f.title)+'</a></li>').join("\n");return'<?xml version="1.0" encoding="UTF-8"?>\n<!DOCTYPE html>\n<html xmlns="http://www.w3.org/1999/xhtml" xmlns:epub="http://www.idpf.org/2007/ops" lang="zh-CN">\n<head><meta charset="utf-8"/><title>目录</title><link rel="stylesheet" type="text/css" href="style.css"/></head>\n<body>\n<nav epub:type="toc" id="toc">\n<h1>目录</h1>\n<ol>\n'+lis+'\n</ol>\n</nav>\n</body>\n</html>\n';}
function buildNcx(files){const navPoints=files.map((f,i)=>'  <navPoint id="np'+(i+1)+'" playOrder="'+(i+1)+'"><navLabel><text>'+escapeXml(f.title)+'</text></navLabel><content src="chapters/'+f.fname+'"/></navPoint>').join("\n");return'<?xml version="1.0" encoding="UTF-8"?>\n<ncx xmlns="http://www.daisy.org/z3986/2005/ncx/" version="2005-1">\n<head><meta name="dtb:uid" content="urn:uuid:'+genUuid()+'"/><meta name="dtb:depth" content="1"/><meta name="dtb:totalPageCount" content="0"/><meta name="dtb:maxPageNumber" content="0"/></head>\n<docTitle><text>'+escapeXml(state.meta.title||"未命名")+'</text></docTitle>\n<navMap>\n'+navPoints+'\n</navMap>\n</ncx>\n';}
function genUuid(){return"xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(/[xy]/g,c=>{const r=Math.random()*16|0;return(c==="x"?r:(r&0x3|0x8)).toString(16);});}

/* ============ 按钮绑定 ============ */
$("#btnImport").addEventListener("click",()=>$("#fileInput").click());
$("#fileInput").addEventListener("change",(e)=>{const f=e.target.files&&e.target.files[0];if(f)importEpub(f);e.target.value="";});
$("#btnSave").addEventListener("click",()=>{commitTitle();saveDraft();toast("已保存草稿");});
$("#btnBackup").addEventListener("click",()=>{commitTitle();saveDraft();toast("已备份（草稿已存）");});
$("#btnExport").addEventListener("click",exportEpub);
$("#btnNew").addEventListener("click",newChapter);
$("#newCh").addEventListener("click",newChapter);
$("#bookTitle").addEventListener("input",()=>{state.meta.title=$("#bookTitle").value.trim();scheduleSave();});
$("#bookAuthor").addEventListener("input",()=>{state.meta.author=$("#bookAuthor").value.trim();scheduleSave();});
$("#aiRole").addEventListener("input",()=>{state.meta.aiRole=($("#aiRole").value.trim()||"TA");scheduleSave();});

/* ============ 初始化 ============ */
(async function init(){
  if(typeof JSZip==="undefined"){toast("JSZip 库加载失败，请检查 jszip.min.js 是否同目录");return;}
  restoreDraft();
  if(!state.chapters.length){
    state.chapters=[{id:genId(),title:"第1章",html:'<p>欢迎使用 EPUB 分章工具 V7。</p><p>点击「导入」选择 .epub 文件，将自动按 me/ta 轮次分章。</p>',role:"round",xhtmlPath:null}];
    state.currentId=state.chapters[0].id;
  }
  renderChapters();renderToc();await selectChapter(state.currentId);
})();
window.addEventListener("error",(e)=>{console.error(e.error||e.message);});
</script>
