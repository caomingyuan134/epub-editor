<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>EPUB 分章工具 V4</title>
<style>
  :root{--p:#2a6df4;--p2:#1d4fc4;--bg:#f4f6fb;--card:#fff;--bd:#e3e7f0;--tx:#1c2431;--mu:#6b7688;--danger:#d64545;--ok:#1f9e5b}
  *{box-sizing:border-box}html,body{margin:0;padding:0}body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--tx);font-size:15px;line-height:1.6;-webkit-text-size-adjust:100%}
  header{position:sticky;top:0;z-index:30;background:linear-gradient(135deg,var(--p),var(--p2));color:#fff;padding:10px 12px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;box-shadow:0 2px 8px rgba(42,109,244,.25)}
  header h1{font-size:16px;margin:0;flex:1;font-weight:700;letter-spacing:.5px;min-width:120px}
  .iconbtn{background:rgba(255,255,255,.16);color:#fff;border:0;border-radius:9px;padding:7px 10px;font-size:12.5px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
  .iconbtn:active{background:rgba(255,255,255,.3)}.iconbtn.danger{background:rgba(255,255,255,.14)}
  .menu-btn{display:none;background:rgba(255,255,255,.16);color:#fff;border:0;border-radius:9px;padding:7px 10px;font-size:16px;cursor:pointer;margin-right:2px}
  main{display:flex;max-width:1200px;margin:0 auto;padding:10px;gap:10px;align-items:flex-start}
  aside{width:300px;flex:0 0 300px;display:flex;flex-direction:column;gap:10px;position:sticky;top:60px;max-height:calc(100vh - 70px);overflow:auto}
  .card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
  .card h2{font-size:14px;margin:0 0 9px;color:var(--p);font-weight:700;display:flex;align-items:center;gap:6px}
  .tabs{display:flex;gap:5px;background:#eef1f7;border-radius:10px;padding:4px;margin-bottom:9px}
  .tab{flex:1;text-align:center;padding:6px 3px;border-radius:8px;font-size:12px;font-weight:600;color:var(--mu);cursor:pointer;user-select:none}
  .tab.on{background:#fff;color:var(--p);box-shadow:0 1px 3px rgba(0,0,0,.08)}
  .ch-item{display:flex;align-items:center;gap:7px;padding:7px 9px;border-radius:9px;cursor:pointer;font-size:13.5px;border:1px solid transparent}
  .ch-item:hover{background:#f0f4ff}.ch-item.active{background:#e8f0ff;border-color:#c9dcff;color:var(--p2);font-weight:600}
  .ch-item .ch-tt{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .ch-item .ch-wc{font-size:11px;color:var(--mu);white-space:nowrap;flex:0 0 auto}
  .ch-item .x{margin-left:auto;color:#b9c0cc;background:0;border:0;font-size:15px;cursor:pointer;padding:0 2px}
  .ch-item .x:active{color:var(--danger)}
  .ch-item .merge-btn{font:inherit;font-size:11px;padding:2px 7px;border:1px solid var(--bd);border-radius:7px;background:#fafbfd;color:var(--mu);cursor:pointer;white-space:nowrap}
  .ch-item .merge-btn:active{background:#eef3ff;color:var(--p2)}
  .addbtn{width:100%;margin-top:6px;padding:8px;background:#eef3ff;color:var(--p2);border:1px dashed #b9cfff;border-radius:10px;font-weight:700;cursor:pointer;font-size:13px}
  .addbtn:active{background:#e2ecff}
  .field{display:flex;flex-direction:column;gap:3px;margin-bottom:8px}
  .field label{font-size:11.5px;color:var(--mu);font-weight:600}
  .field input,.field textarea{font:inherit;padding:7px 9px;border:1px solid var(--bd);border-radius:9px;background:#fafbfd;color:var(--tx);width:100%;max-width:100%}
  .field textarea{resize:vertical;min-height:50px}
  .editor-wrap{flex:1;min-width:0}
  .toolbar{display:flex;flex-wrap:wrap;gap:5px;background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:8px;position:sticky;top:60px;z-index:10;box-shadow:0 1px 3px rgba(0,0,0,.04)}
  .toolbar button{font:inherit;font-size:12.5px;padding:6px 9px;border:1px solid var(--bd);border-radius:9px;background:#fafbfd;cursor:pointer;font-weight:600;color:#33465f}
  .toolbar button:active{background:#e8f0ff;color:var(--p2)}
  .toolbar button.undo-redo{padding:6px 8px;font-size:14px}
  .toolbar .sep{width:1px;background:var(--bd);margin:2px 3px}
  .editor{margin-top:10px;background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:18px 20px;min-height:55vh;box-shadow:0 1px 3px rgba(0,0,0,.04);overflow:auto}
  .editor:focus{outline:0;border-color:#b9cfff;box-shadow:0 0 0 3px #e2ecff}
  .editor h2{font-size:1.4em;margin:.6em 0 .4em}.editor h3{font-size:1.2em;margin:.5em 0 .3em}
  .ch-title-input{width:100%;font:inherit;font-size:17px;font-weight:700;padding:7px 9px;border:1px solid var(--bd);border-radius:10px;margin-bottom:9px;background:#fafbfd;max-width:100%}
  .toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:#22303f;color:#fff;padding:9px 14px;border-radius:10px;font-size:13px;z-index:99;opacity:0;pointer-events:none;transition:opacity .25s;max-width:92%;text-align:center}
  .toast.show{opacity:1}
  .dialog{position:fixed;inset:0;background:rgba(20,30,45,.45);display:none;align-items:center;justify-content:center;z-index:50;padding:14px}
  .dialog.show{display:flex}.dialog .card{max-width:420px;width:100%}
  .dialog h3{margin:0 0 7px;font-size:15px;color:var(--p)}
  .dialog p{margin:0 0 12px;font-size:13px;color:var(--mu)}
  .dialog .row{display:flex;gap:8px;justify-content:flex-end}
  .btn{font:inherit;padding:8px 13px;border-radius:10px;border:0;cursor:pointer;font-weight:700;font-size:13px}
  .btn.p{background:var(--p);color:#fff}.btn.p:active{background:var(--p2)}.btn.g{background:#eef1f7;color:#33465f}
  .recover-bar{display:none;background:#fff7e6;border:1px solid #f3d99a;color:#8a5a00;padding:9px 12px;border-radius:12px;margin-bottom:10px;align-items:center;gap:9px;font-size:13px}
  .recover-bar.show{display:flex}.recover-bar button{font:inherit;padding:5px 9px;border-radius:8px;border:0;cursor:pointer;font-weight:700;font-size:12px}
  .recover-bar .yes{background:#f0b429;color:#fff}.recover-bar .no{background:#f2f4f8;color:#33465f}
  .hint{font-size:11.5px;color:var(--mu);margin-top:5px;line-height:1.5}
  .stat-bar{display:flex;flex-wrap:wrap;gap:8px;font-size:12px;color:var(--mu);margin-bottom:8px}
  .stat-bar b{color:var(--p2)}
  .auto-bar{background:#eef7ff;border:1px solid #b9dcff;color:#13407a;padding:9px 12px;border-radius:12px;margin-bottom:10px;font-size:13px;display:flex;align-items:center;gap:9px}
  .auto-bar .spinner{width:14px;height:14px;border:2px solid #b9dcff;border-top-color:var(--p);border-radius:50%;animation:spin .8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .kb-info{font-size:11px;color:var(--mu);background:#f0f4ff;border:1px dashed #c9dcff;border-radius:9px;padding:7px 9px;margin-top:7px;line-height:1.5}
  @media(max-width:820px){
    .menu-btn{display:inline-flex}
    main{padding:7px;gap:0}
    aside{position:fixed;top:0;left:0;bottom:0;width:86%;max-width:340px;height:100%;max-height:none;background:var(--bg);padding:9px;z-index:40;transform:translateX(-105%);transition:transform .28s ease;box-shadow:0 0 24px rgba(0,0,0,.18)}
    aside.open{transform:translateX(0)}
    .scrim{display:none;position:fixed;inset:0;background:rgba(20,30,45,.35);z-index:35}
    .scrim.show{display:block}
    .editor{padding:14px;min-height:50vh}
    .toolbar{top:auto;bottom:0;flex-wrap:wrap}
  }
</style>
</head>
<body>
<header>
  <button class="menu-btn" id="menuBtn" title="侧栏">☰</button>
  <h1>📖 EPUB 分章工具 V4</h1>
  <button class="iconbtn" id="importBtn">📂 导入</button>
  <button class="iconbtn" id="saveDraftBtn" title="手动保存草稿">💾 保存</button>
  <button class="iconbtn" id="backupDraftBtn" title="把草稿导出为 JSON 文件下载备份">⬇️ 备份</button>
  <button class="iconbtn" id="exportBtn">📥 导出</button>
  <button class="iconbtn danger" id="newBtn" title="新建">✨ 新建</button>
  <input type="file" id="fileInput" accept=".epub" style="display:none">
  <input type="file" id="coverInput" accept="image/*" style="display:none">
</header>
<div class="scrim" id="scrim"></div>
<main>
  <aside id="aside">
    <div class="card">
      <div class="tabs">
        <div class="tab on" data-tab="ch">章节</div>
        <div class="tab" data-tab="toc">目录</div>
        <div class="tab" data-tab="meta">元数据</div>
      </div>
      <div id="panel-ch">
        <div class="stat-bar" id="statBar"></div>
        <div id="chList"></div>
        <div class="kb-info">导入 epub 后自动按「前言 + 第 N 章」分章（识别 me/ta 轮次）。工具栏仅在编辑正文时出现，固定在顶部。</div>
      </div>
      <div id="panel-toc" style="display:none">
        <div id="tocList"></div>
        <div class="hint">目录随分章自动生成。点「改名」可手动修改目录项标题。</div>
      </div>
      <div id="panel-meta" style="display:none">
        <div class="field"><label>书名</label><input id="m-title" placeholder="书名"></div>
        <div class="field"><label>作者</label><input id="m-author" placeholder="作者"></div>
        <div class="field"><label>语言</label><input id="m-lang" placeholder="zh-CN" value="zh-CN"></div>
        <div class="field"><label>出版社</label><input id="m-pub" placeholder="出版社"></div>
        <div class="field"><label>出版日期</label><input id="m-date" placeholder="2026-08-16"></div>
        <div class="field"><label>简介</label><textarea id="m-desc" placeholder="书籍简介"></textarea></div>
        <div class="field"><label>封面</label><div class="coverbox"><img id="coverImg" src="" alt=""><button id="coverPick">选择图片</button></div></div>
      </div>
    </div>
  </aside>
  <section class="editor-wrap">
    <div class="auto-bar" id="autoBar" style="display:none"><div class="spinner"></div><span id="autoBarText">正在智能分章…</span></div>
    <div class="recover-bar" id="recoverBar"><span>检测到上次未导出的草稿，可自动恢复。</span><button class="yes" id="recoverYes">恢复</button><button class="no" id="recoverNo">丢弃</button></div>
    <div class="toolbar" id="toolbar">
      <button class="undo-redo" id="undoBtn" title="撤销（连续输入/删除合并为一步）">↩ 撤销</button>
      <button class="undo-redo" id="redoBtn" title="重做">↪ 重做</button>
      <span class="sep"></span>
      <button data-cmd="bold" title="加粗"><b>B</b></button>
      <button data-cmd="italic" title="斜体"><i>I</i></button>
      <button data-cmd="underline" title="下划线"><u>U</u></button>
      <span class="sep"></span>
      <button data-cmd="formatBlock" data-val="H2">H2</button>
      <button data-cmd="formatBlock" data-val="H3">H3</button>
      <span class="sep"></span>
      <button data-cmd="insertUnorderedList" title="无序列表">• 列表</button>
      <button data-cmd="insertOrderedList" title="有序列表">1. 列表</button>
      <span class="sep"></span>
      <button data-cmd="createLink" title="插入链接">🔗 链接</button>
      <button data-cmd="removeFormat" title="清除格式">清除格式</button>
    </div>
    <input class="ch-title-input" id="chTitle" placeholder="章节标题（如：第一章）">
    <div class="editor" id="editor" contenteditable="true" spellcheck="false" placeholder="导入 epub 后将自动分章，随后可在此编辑正文…"></div>
    <div class="hint">编辑停止输入约 0.9 秒后自动存为草稿（localStorage）。正文支持撤销/重做（↩/↪，每章最近 30 步，连续输入/删除合并为一步）。</div>
  </section>
</main>
<div class="toast" id="toast"></div>
<div class="dialog" id="dialog"><div class="card"><h3 id="d-title"></h3><p id="d-msg"></p><div class="row"><button class="btn g" id="d-no">取消</button><button class="btn p" id="d-yes">确定</button></div></div></div>

<script src="jszip.min.js"></script>
<script>
"use strict";
const $=(s)=>document.querySelector(s);
const el=(t,cls,html)=>{const e=document.createElement(t);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;return e;};
let toastTimer=null;
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),2200);}
function fmtCount(n){return n>=10000?(n/10000).toFixed(1)+'万字':n+'字';}
function safeName(s){return (s||'').replace(/[\\/:*?"<>|]/g,'_').replace(/\s+/g,' ').trim()||'book';}
function dialog(title,msg){return new Promise(r=>{$('#d-title').textContent=title;$('#d-msg').textContent=msg;$('#dialog').classList.add('show');const yes=()=>{$('#dialog').classList.remove('show');r(true);};const no=()=>{$('#dialog').classList.remove('show');r(false);};$('#d-yes').onclick=yes;$('#d-no').onclick=no;});}

const state={meta:{title:'',author:'',lang:'zh-CN',publisher:'',date:'',description:'',cover:null},chapters:[],toc:[],cover:null,cur:0};
const HIST_MAX=30;
let histTimer=null;

const uid=(p)=>p+'_'+Math.random().toString(36).slice(2,8);
function nextChapterOrdinal(){let max=0;for(const c of state.chapters){const m=c.title.match(/第\s*(\d+)\s*章/);if(m)max=Math.max(max,+m[1]);}return max+1;}
function addChapter({title,html='',addToc=true,id=null}){const c={id:id||uid('ch'),title,html,history:[],hidx:0};state.chapters.push(c);if(addToc)state.toc.push({id:uid('t'),title,chId:c.id,manual:false});return c;}
function delChapter(id){const i=state.chapters.findIndex(c=>c.id===id);if(i<0)return;state.chapters.splice(i,1);state.toc=state.toc.filter(t=>t.chId!==id);if(state.cur>=state.chapters.length)state.cur=Math.max(0,state.chapters.length-1);}
function mergeWithPrev(id){const i=state.chapters.findIndex(c=>c.id===id);if(i<=0)return;const cur=state.chapters[i],prev=state.chapters[i-1];prev.html=(prev.html||'')+(cur.html||'');for(const t of state.toc)if(t.chId===cur.id)t.chId=prev.id;state.chapters.splice(i,1);if(state.cur===i)state.cur=i-1;}
function getChapterById(id){return state.chapters.find(c=>c.id===id)||null;}
function bindTocToChapter(tocItem,chId){tocItem.chId=chId;tocItem.manual=true;}
function autoSyncToc(){for(const c of state.chapters){let t=state.toc.find(x=>x.chId===c.id);if(!t){t={id:uid('t'),title:c.title,chId:c.id,manual:false};state.toc.push(t);}else if(!t.manual)t.title=c.title;}const ids=new Set(state.chapters.map(c=>c.id));state.toc=state.toc.filter(t=>ids.has(t.chId));}

function renderChapters(){const box=$('#chList');box.innerHTML='';state.chapters.forEach((c,idx)=>{const div=el('div','ch-item'+(state.cur===idx?' active':''));div.dataset.id=c.id;const tt=el('div','ch-tt',c.title);const wc=el('div','ch-wc',fmtCount((c.html||'').replace(/<[^>]+>/g,'').length));const merge=el('button','merge-btn','合并↑');merge.title='与上一章合并';merge.onclick=(e)=>{e.stopPropagation();if(idx<=0){toast('已是第一章，无法合并');return;}if(!confirm('将「'+c.title+'」合并到上一章？'))return;mergeWithPrev(c.id);renderAll();toast('已合并到上一章');};const x=el('button','x','×');x.title='删除本章';x.onclick=(e)=>{e.stopPropagation();if(state.chapters.length<=1){toast('至少保留一章');return;}if(!confirm('删除章节「'+c.title+'」？'))return;delChapter(c.id);renderAll();};div.append(tt,wc,merge,x);div.onclick=()=>{state.cur=idx;renderAll();};box.appendChild(div);});const sb=$('#statBar');if(sb)sb.innerHTML='共 <b>'+state.chapters.length+'</b> 章 · 总 <b>'+fmtCount(state.chapters.reduce((a,c)=>a+(c.html||'').replace(/<[^>]+>/g,'').length,0))+'</b>';}
function renderToc(){const box=$('#tocList');box.innerHTML='';state.toc.forEach((t,idx)=>{const c=getChapterById(t.chId);const div=el('div','ch-item');div.style.flexWrap='wrap';const inp=el('input');inp.value=t.title;inp.style.flex='1';inp.style.minWidth='120px';inp.style.padding='5px 7px';inp.style.border='1px solid var(--bd)';inp.style.borderRadius='8px';inp.style.font='inherit';inp.style.fontSize='13px';inp.oninput=()=>{t.title=inp.value;t.manual=true;toast('目录项已标记手动，不再随章节名自动跟随');};const sel=el('select');sel.style.padding='5px 7px';sel.style.border='1px solid var(--bd)';sel.style.borderRadius='8px';sel.style.font='inherit';sel.style.fontSize='12px';sel.style.background='#fafbfd';const opt0=el('option');opt0.value='';opt0.textContent='— 绑定章节 —';sel.appendChild(opt0);state.chapters.forEach(ch=>{const o=el('option');o.value=ch.id;o.textContent=ch.title;if(t.chId===ch.id)o.selected=true;sel.appendChild(o);});sel.onchange=()=>bindTocToChapter(t,sel.value);const x=el('button','x','×');x.title='删除目录项';x.onclick=()=>{state.toc.splice(idx,1);renderToc();};div.append(inp,sel,x);box.appendChild(div);});const add=el('button','addbtn','＋ 新增目录项');add.onclick=()=>{state.toc.push({id:uid('t'),title:'新目录项',chId:state.chapters[0]?state.chapters[0].id:'',manual:true});renderToc();};box.appendChild(add);}
function renderMeta(){$('#m-title').value=state.meta.title||'';$('#m-author').value=state.meta.author||'';$('#m-lang').value=state.meta.lang||'zh-CN';$('#m-pub').value=state.meta.publisher||'';$('#m-date').value=state.meta.date||'';$('#m-desc').value=state.meta.description||'';const img=$('#coverImg');if(state.cover){img.src=state.cover;img.style.display='';}else img.style.display='none';}
function renderEditor(){const c=state.chapters[state.cur];if(!c){$('#editor').innerHTML='';$('#chTitle').value='';return;}if($('#chTitle').value!==c.title)$('#chTitle').value=c.title;if($('#editor').innerHTML!==c.html)$('#editor').innerHTML=c.html;}
function renderAll(){renderChapters();renderToc();renderMeta();renderEditor();}

function pushHistory(){const c=state.chapters[state.cur];if(!c)return;const html=$('#editor').innerHTML;if(c.history[c.hidx]===html)return;c.history=c.history.slice(0,c.hidx+1);c.history.push(html);if(c.history.length>HIST_MAX)c.history.shift();c.hidx=c.history.length-1;}
function doUndo(){const c=state.chapters[state.cur];if(!c||c.hidx<=0)return;c.hidx--;$('#editor').innerHTML=c.history[c.hidx];toast('已撤销');}
function doRedo(){const c=state.chapters[state.cur];if(!c||c.hidx>=c.history.length-1)return;c.hidx++;$('#editor').innerHTML=c.history[c.hidx];toast('已重做');}

/* ============ 自动分章核心（me/ta 轮次） ============ */
function isMeTa(el){if(!el||el.nodeType!==1)return false;const c=(el.className||'').toString();return c==='me'||c==='ta';}
function blockRole(el){if(!el||el.nodeType!==1)return null;const c=(el.className||'').toString();if(c==='me')return'me';if(c==='ta')return'ta';return null;}
function nodeToHtml(node){if(node.nodeType===1)return node.outerHTML;if(node.nodeType===3)return node.nodeValue.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');return '';}
function splitIntoBlocks(root){const blocks=[];let buf=[];function flushOther(){if(buf.length){blocks.push({role:'other',html:buf.join('')});buf=[];}}function takeNode(node){if(node.nodeType===1&&isMeTa(node)){flushOther();blocks.push({role:blockRole(node),html:node.outerHTML});}else if(node.nodeType===1)buf.push(node.outerHTML);else if(node.nodeType===3&&node.nodeValue)buf.push(node.nodeValue.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'));}const tmp=document.createElement('div');tmp.innerHTML=(typeof root==='string')?root:root.innerHTML||'';for(const node of Array.from(tmp.childNodes))takeNode(node);flushOther();return blocks;}
function autoSplitChapters(xhtmlDocs){const all=document.createElement('div');for(const d of xhtmlDocs){const wrap=document.createElement('div');wrap.innerHTML=d.html;while(wrap.firstChild)all.appendChild(wrap.firstChild);}const children=Array.from(all.childNodes);let preHtml='',restNodes=[];let foundStart=false;for(const node of children){if(!foundStart&&node.nodeType===1&&isMeTa(node))foundStart=true;if(foundStart)restNodes.push(node);else preHtml+=nodeToHtml(node);}const chapters=[];if(preHtml.replace(/<[^>]+>/g,'').trim().length>0)chapters.push({title:'前言',html:preHtml});const restContainer=document.createElement('div');for(const n of restNodes)restContainer.appendChild(n);const blocks=splitIntoBlocks(restContainer);const rounds=[];let cur=null;for(const b of blocks){if(b.role==='other'){if(cur)cur.other+=b.html;else rounds.push(cur={me:'',ta:'',other:b.html});}else if(b.role==='me'){if(cur&&cur.me&&cur.ta){rounds.push(cur={me:b.html,ta:'',other:''});}else{if(!cur)cur={me:'',ta:'',other:''};cur.me=b.html;if(!rounds.includes(cur))rounds.push(cur);}}else if(b.role==='ta'){if(!cur||(cur.me&&cur.ta)){cur={me:'',ta:b.html,other:''};rounds.push(cur);}else{cur.ta=b.html;if(!rounds.includes(cur))rounds.push(cur);}}}let n=1;for(const r of rounds){if(!r.me&&!r.ta)continue;const html=(r.other||'')+r.me+r.ta;chapters.push({title:'第 '+n+' 章',html});n++;}return chapters;}

/* ============ 导入 epub ============ */
async function importEpub(file){if(typeof JSZip!=='function'){toast('JSZip 库未加载，无法导入');return;}try{const buf=await file.arrayBuffer();const zip=new JSZip();const loaded=await zip.loadAsync(buf);const entries=[];loaded.forEach((path,entry)=>{if(!entry.dir)entries.push({path,entry});});const nav=entries.find(e=>/nav\.xhtml?$/i.test(e.path));const cover=entries.find(e=>/cover\.xhtml?$/i.test(e.path));const others=entries.filter(e=>!/nav\.xhtml?$/i.test(e.path)&&!/cover\.xhtml?$/i.test(e.path)&&/\.xhtml?$/i.test(e.path));others.sort((a,b)=>a.path.localeCompare(b.path));const readAll=async()=>{const out=[];for(const e of others){const txt=await e.entry.async('string');out.push({name:e.path,html:txt});}return out;};const docs=await readAll();state.chapters=[];state.toc=[];state.cover=null;state.cur=0;state.meta={title:file.name.replace(/\.epub$/i,''),author:'',lang:'zh-CN',publisher:'',date:'',description:'',cover:null};if(cover){try{const ch=addChapter({title:'封面',html:await cover.entry.async('string'),addToc:true});ch.history=[ch.html||''];ch.hidx=0;}catch(e){console.error(e);}}if(nav){try{const ch=addChapter({title:'目录',html:await nav.entry.async('string'),addToc:true});ch.history=[ch.html||''];ch.hidx=0;}catch(e){console.error(e);}}const bar=$('#autoBar');const barTxt=$('#autoBarText');if(bar){bar.style.display='flex';barTxt.textContent='正在智能分章（识别 me/ta 轮次）…';}await new Promise(r=>setTimeout(r,30));const chs=autoSplitChapters(docs);for(const ch of chs){const c=addChapter({title:ch.title,html:ch.html,addToc:true});c.history=[c.html||''];c.hidx=0;}autoSyncToc();if(bar)bar.style.display='none';renderAll();toast('导入完成：'+state.chapters.length+' 章（含前言/封面/目录）');}catch(e){console.error(e);toast('导入失败：'+(e.message||e));$('#autoBar').style.display='none';}}

/* ============ 导出 epub ============ */
function buildXhtml(title,bodyHtml){return '<?xml version="1.0" encoding="UTF-8"?>\n<!DOCTYPE html><html xmlns="http://www.w3.org/1999/xhtml" xmlns:epub="http://www.idpf.org/2007/ops"><head><meta charset="UTF-8"><title>'+title+'</title></head><body>'+bodyHtml+'</body></html>';}
async function exportEpub(){if(typeof JSZip!=='function'){toast('JSZip 库未加载，无法导出');return;}if(!state.chapters.length){toast('暂无章节可导出');return;}try{const zip=new JSZip();zip.file('mimetype','application/epub+zip',{compression:'STORE'});zip.folder('META-INF').file('container.xml','<?xml version="1.0"?><container version="1.0" xmlns="urn:oasis:names:tc:opendocument:xmlns:container"><rootfiles><rootfile full-path="OEBPS/content.opf" media-type="application/oebps-package+xml"/></rootfiles></container>');const oebps=zip.folder('OEBPS');const text=oebps.folder('text');const man=[],spine=[];let n=0;const safe=safeName(state.meta.title||'book');for(const c of state.chapters){n++;const name='ch'+String(n).padStart(3,'0')+'.xhtml';man.push('<item id="'+name+'" href="text/'+name+'" media-type="application/xhtml+xml"/>');spine.push('<itemref idref="'+name+'"/>');text.file(name,buildXhtml(c.title,c.html||''));}let navPoints='';n=0;for(const c of state.chapters){n++;navPoints+='<navPoint id="np'+n+'" playOrder="'+n+'"><navLabel><text>'+(c.title.replace(/&/g,'&amp;').replace(/</g,'&lt;'))+'</text></navLabel><content src="text/ch'+String(n).padStart(3,'0')+'.xhtml"/></navPoint>';}oebps.file('toc.ncx','<?xml version="1.0" encoding="UTF-8"?><ncx xmlns="http://www.daisy.org/z3986/2005/ncx/" version="2005-1"><head><meta name="dtb:uid" content="'+(state.meta.title||'book')+'"/><meta name="dtb:depth" content="1"/></head><docTitle><text>'+(state.meta.title||'book')+'</text></docTitle><navMap>'+navPoints+'</navMap></ncx>');const opf='<?xml version="1.0" encoding="UTF-8"?><package xmlns="http://www.idpf.org/2007/opf" version="3.0" unique-identifier="bookid"><metadata xmlns:dc="http://purl.org/dc/elements/1.1/"><dc:title>'+(state.meta.title||'book')+'</dc:title><dc:creator>'+(state.meta.author||'')+'</dc:creator><dc:language>'+(state.meta.lang||'zh-CN')+'</dc:language><dc:identifier id="bookid">'+(state.meta.title||'book')+'</dc:identifier></metadata><manifest><item id="ncx" href="toc.ncx" media-type="application/x-daisy+ncx"/>'+man.join('')+'</manifest><spine toc="ncx">'+spine.join('')+'</spine></package>';oebps.file('content.opf',opf);const blob=await zip.generateAsync({type:'blob',mimeType:'application/epub+zip',compression:'DEFLATE',compressionOptions:{level:6}});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=safe+'.epub';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000);toast('已导出 '+safe+'.epub');clearDraft();}catch(e){console.error(e);toast('导出失败：'+(e.message||e));}}

/* ============ 草稿（localStorage + visibilitychange） ============ */
const DRAFT_KEY='epub-split-draft-v4';
function snapshot(){return JSON.stringify({meta:state.meta,chapters:state.chapters.map(c=>({id:c.id,title:c.title,html:c.html})),toc:state.toc,cur:state.cur,cover:state.cover});}
function saveDraft(){try{localStorage.setItem(DRAFT_KEY,snapshot());}catch(e){console.warn('draft save failed',e);}}
function loadDraft(){return localStorage.getItem(DRAFT_KEY);}
function clearDraft(){localStorage.removeItem(DRAFT_KEY);}
function applyDraft(json){const o=JSON.parse(json);state.meta=Object.assign({title:'',author:'',lang:'zh-CN',publisher:'',date:'',description:'',cover:null},o.meta||{});state.cover=o.cover||null;state.chapters=(o.chapters||[]).map(c=>({id:c.id||uid('ch'),title:c.title,html:c.html||'',history:[c.html||''],hidx:0}));state.toc=(o.toc||[]).map(t=>({id:t.id||uid('t'),title:t.title,chId:t.chId,manual:!!t.manual}));state.cur=o.cur||0;if(state.cur>=state.chapters.length)state.cur=Math.max(0,state.chapters.length-1);}

/* ============ 事件绑定 ============ */
$('#importBtn').onclick=()=>$('#fileInput').click();
$('#fileInput').onchange=(e)=>{const f=e.target.files&&e.target.files[0];if(f)importEpub(f);e.target.value='';};
$('#saveDraftBtn').onclick=()=>{saveDraft();toast('草稿已保存');};
$('#backupDraftBtn').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([snapshot()],{type:'application/json'}));a.download=(safeName(state.meta.title)||'draft')+'_draft.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000);toast('草稿已备份为 JSON');};
$('#exportBtn').onclick=()=>exportEpub();
$('#newBtn').onclick=async()=>{if(await dialog('新建','确定新建？当前未导出的草稿将被清除。')){state.meta={title:'',author:'',lang:'zh-CN',publisher:'',date:'',description:'',cover:null};state.chapters=[];state.toc=[];state.cover=null;state.cur=0;clearDraft();renderAll();toast('已新建');}};
$('#menuBtn').onclick=()=>{$('#aside').classList.toggle('open');$('#scrim').classList.toggle('show');};
$('#scrim').onclick=()=>{$('#aside').classList.remove('open');$('#scrim').classList.remove('show');};
$('#recoverYes').onclick=()=>{try{const d=loadDraft();if(d){applyDraft(JSON.parse(d));renderAll();toast('草稿已恢复');$('#recoverBar').classList.remove('show');}}catch(e){console.error(e);toast('恢复失败');}};
$('#recoverNo').onclick=()=>{clearDraft();$('#recoverBar').classList.remove('show');};
for(const tab of document.querySelectorAll('.tab'))tab.onclick=()=>{for(const t of document.querySelectorAll('.tab'))t.classList.remove('on');tab.classList.add('on');$('#panel-ch').style.display=tab.dataset.tab==='ch'?'':'none';$('#panel-toc').style.display=tab.dataset.tab==='toc'?'':'none';$('#panel-meta').style.display=tab.dataset.tab==='meta'?'':'none';};
$('#toolbar').addEventListener('click',(e)=>{const b=e.target.closest('button[data-cmd]');if(!b)return;const cmd=b.dataset.cmd,val=b.dataset.val;if(cmd==='createLink'){const u=prompt('链接地址');if(u)document.execCommand(cmd,false,u);}else if(cmd==='formatBlock')document.execCommand(cmd,false,val);else document.execCommand(cmd,false,null);$('#editor').focus();});
$('#undoBtn').onclick=doUndo;$('#redoBtn').onclick=doRedo;
$('#editor').addEventListener('input',()=>{clearTimeout(histTimer);histTimer=setTimeout(pushHistory,500);});
$('#editor').addEventListener('keydown',(e)=>{if((e.ctrlKey||e.metaKey)&&!e.shiftKey&&e.key.toLowerCase()==='z'){e.preventDefault();doUndo();}if((e.ctrlKey||e.metaKey)&&(e.key==='y'||(e.shiftKey&&e.key.toLowerCase()==='z'))){e.preventDefault();doRedo();}});
$('#chTitle').addEventListener('input',()=>{const c=state.chapters[state.cur];if(!c)return;c.title=$('#chTitle').value;const t=state.toc.find(x=>x.chId===c.id);if(t&&!t.manual)t.title=c.title;renderChapters();});
for(const id of['m-title','m-author','m-lang','m-pub','m-date'])$('#'+id).addEventListener('input',(e)=>{const k=id.slice(2);state.meta[k]=e.target.value;});
$('#m-desc').addEventListener('input',(e)=>{state.meta.description=e.target.value;});
$('#coverPick').onclick=()=>$('#coverInput').click();
$('#coverInput').onchange=(e)=>{const f=e.target.files&&e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{state.cover=r.result;$('#coverImg').src=r.result;$('#coverImg').style.display='';};r.readAsDataURL(f);e.target.value='';};
let saveTimer=null;function schedSave(){clearTimeout(saveTimer);saveTimer=setTimeout(saveDraft,900);}
$('#editor').addEventListener('input',schedSave);$('#chTitle').addEventListener('input',schedSave);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')saveDraft();});

window.addEventListener('error',(e)=>{console.error(e.error||e.message);toast('发生错误：'+(e.message||'未知'));});

(async function init(){if(typeof JSZip!=='function'){toast('JSZip 库加载失败，导入/导出将不可用');console.error('JSZip is not defined');}const d=loadDraft();if(d){try{const o=JSON.parse(d);applyDraft(o);$('#recoverBar').querySelector('span').textContent='已自动恢复上次未导出的草稿（正文/目录/元数据）。';$('#recoverBar').classList.add('show');toast('草稿已自动恢复'+(o.cover?'':'（封面过大未保留，可重新选择）'));}catch(e){console.error(e);}}renderAll();})();
</script>
</body>
</html>
